<div class="container" style="text-align: center; margin-bottom: 20px;">
  <div style="font-size:16px;text-align:center;margin-top: 20px;margin-bottom: 20px;">
    Add {{data.label}}ly Customer Success Survey Batch
  </div>

  <div class="row">
    <div class="col-md-6">
      <mat-form-field appearance="outline">
        <mat-label>Select {{data.label}}</mat-label>
        <mat-select [(ngModel)]="selectedMonth">
          <mat-option *ngFor="let m of months" [value]="m.title" [title]="m.title">
            {{m.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-md-6">
      <mat-form-field style="width: 100px; padding-left: 10px;" appearance="outline">
        <mat-select name="tableYear" [(ngModel)]="_util.tableYear">
          <mat-option *ngFor="let year of _util.Years(3)" [value]="year" [title]="year">
            {{ year }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div style="text-align: center; margin-top: 15px;">
    <button (click)="SaveDetails()" class="btn btn-primary">Save</button>
  </div>
</div>
