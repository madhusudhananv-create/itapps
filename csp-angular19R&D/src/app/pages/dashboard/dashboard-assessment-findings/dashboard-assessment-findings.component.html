<!-- Page Container -->
<div class="page-container">
  <!-- White Card Container -->
  <div class="filter-card">
    <!-- Filter Fields Grid -->
    <div class="filter-grid">
      <!-- Row 1: Account, Chart Title, Select X axis, Select Y axis, Finding Status -->
      <div class="field-wrapper">
        <label class="field-label">Account</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name="ddCustomer" placeholder="Account" [(ngModel)]='customeR_IDS' [disabled]="_loading"
            (selectionChange)="selectedPeriod_OnChange()" multiple #selectCustomer panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="-1" (click)="toggleSelectionForCustomer()" #allCustomerSelected>All</mat-option>
            <mat-option *ngFor="let c of customer" [value]="c.cusT_ID" [title]="c.cusT_NM" (click)="customerTosslePerOne()">
              {{ c.cusT_NM}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Chart Title</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <input type="text" placeholder="Chart Title" matInput
            [(ngModel)]='this.assessmentFindingInputs.charT_TITLE' />
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Select X axis</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name="ddXaxis" placeholder="Select X axis" [disabled]="_loading"
            [(ngModel)]='this.assessmentFindingInputs.xAxis' panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="customer">Account</mat-option>              
            <mat-option value="csm">CSM</mat-option>             
            <mat-option value="portfolio" *ngIf="_util.IsPremier(customerId)">Portfolio</mat-option>
            <mat-option value="project">Project</mat-option>
            <mat-option value="month">Month</mat-option>
            <mat-option value="quarter">Quarter</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Select Y axis</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name="ddyaxis" placeholder="Select Y axis" [disabled]="_loading"
            [(ngModel)]='this.assessmentFindingInputs.yAxis' panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="count">Count</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Finding Status</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name="FindingStatus" placeholder="Finding Status" [disabled]="_loading"
            [(ngModel)]='assessmentFindingInputs.findinG_STATUS' panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="All"> All</mat-option>
            <mat-option value="Open"> Open</mat-option>
            <mat-option value="Close"> Close</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Row 2: Finding Type, Choose Financial Year, Choose Period, From, To -->
      <div class="field-wrapper">
        <label class="field-label">Finding Type</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name="FindingType" placeholder="Finding Type" [disabled]="_loading"
            [(ngModel)]='assessmentFindingInputs.findinG_TYPE' multiple #select panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="All" (click)="toggleSelection()" #allSelected>All</mat-option>
            <mat-option [value]="type.findingtypE_VALUE" *ngFor="let type of findingsType"
              [title]="type.findingtypE_VALUE" (click)="tosslePerOne()">{{type.findingtypE_VALUE}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Choose Financial Year</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name='tableYear' (selectionChange)="selectedPeriod_OnChange()" [(ngModel)]="selectedYear"
            placeholder="Choose Financial Year" [disabled]="_loading" panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option [value]="bb" *ngFor="let bb of ddyear" [title]="bb">{{bb}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Choose Period</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name='tableMonth' (selectionChange)="selectedPeriod_OnChange()" [(ngModel)]="selectedQuarter"
            placeholder="Choose Period" [disabled]="_loading" panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value='Q1'>Q1</mat-option>
            <mat-option value='Q2'>Q2</mat-option>
            <mat-option value='Q3'>Q3</mat-option>
            <mat-option value='Q4'>Q4</mat-option>
            <mat-option value='Select Period'>Select Period</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">From</label>
        <mat-form-field appearance="outline" class="filter-field date-field" style="width: 100%">
          <input [(ngModel)]="fromDate" matInput [matDatepicker]="picker1" placeholder="From"
            [disabled]="selectedQuarter == 'Select Period'?'false' : 'true'">
          <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">To</label>
        <mat-form-field appearance="outline" class="filter-field date-field" style="width: 100%">
          <input [(ngModel)]="toDate" matInput [matDatepicker]="picker2" placeholder="To"
            [disabled]="selectedQuarter == 'Select Period'?'false' : 'true'">
          <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
          <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Row 3: Show Data, Ageing Period, Generate Chart, Reset, View Account Level Details -->
      <div class="field-wrapper">
        <label class="field-label">Show Data</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name='tableTrend' (selectionChange)="selectedPeriod_OnChange()" [(ngModel)]="trendQuarter"
            placeholder="Show Data" [disabled]="_loading" panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option [value]="1">For Specific Period </mat-option>
            <mat-option [value]="2">Till Chosen Period </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="field-wrapper">
        <label class="field-label">Ageing Period</label>
        <mat-form-field appearance="outline" class="filter-field" style="width: 100%">
          <mat-select name='agePeriod' [(ngModel)]="assessmentFindingInputs.findinG_AGE" placeholder="Ageing Period"
            [disabled]="_loading" panelClass="compact-dropdown-panel" [panelWidth]="null">
            <mat-option value="-1"> All </mat-option>    
            <mat-option value="1"> > 30 days</mat-option>
            <mat-option value="2"> < 30 days</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <button class="btn-generate" mat-raised-button (click)="loadData()" [disabled]="_loading">
        Generate Chart
      </button>
      <button class="btn-reset" mat-raised-button (click)="reset()" [disabled]="_loading">
        Reset
      </button>
      <button class="btn-view-details" mat-raised-button (click)="ViewAssessmentFindingDetails()" 
        [disabled]="assessmentFindingData == undefined ? true : false">
        View Account Level Details
      </button>
    </div>
  </div>

  <!-- Loading Progress Bar -->
  <div class="progress-container">
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>

  <!-- Chart Display Area -->
  <div class="chart-container" *ngIf="assessmentFindingData != undefined">
    <highcharts-chart [options]="assessmentFindingData" class="chart-display"></highcharts-chart>
  </div>

  <div class="no-data-container" *ngIf="assessmentFindingData == undefined">
    <div class="no-data-title">Internal Assessment Findings</div>
    <i class="material-icons no-data-icon">warning</i>
    <div class="no-data-text">No Data found</div>
  </div>
</div>
