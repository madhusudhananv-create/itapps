<div class="row">
  <div class="col-lg-12">
    <div class="survey-header">
      <label class="verysmalltextblack">
        <b>Customer Success Score {{successScore}}</b>
        <mat-icon 
          class="info-icon"
          [matTooltip]="'To calculate Customer Success, take the number of customers who rated you 3, 4, or 5 and divide that by the total number of responses and multiply by 100 to get a percentage. CS Score = (Positive rating / Total survey response) * 100'">
          info
        </mat-icon>
      </label>
    </div>
    
    <div class="row smalltextblack starrating">
      <div class="col-lg-9"><b>Survey rating</b></div>
      <div class="col-lg-2"><b>Projects</b></div>
    </div>
    
    <!-- 5 Stars -->
    <div class="row smalltextblack starrating">
      <div class="col-lg-6">
        <svg *ngFor="let i of [1,2,3,4,5]" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-star-fill rating5color" viewBox="0 0 18 18">
          <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z" />
        </svg>
      </div>
      <div class="col-lg-3 dashspan">-------</div>
      <div class="col-lg-2 divcount">{{surveyRating5}}</div>
    </div>
