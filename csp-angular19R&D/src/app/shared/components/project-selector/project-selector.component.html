<div class="row selector-row">
  <div class="dropdown-wrapper">
    <mat-select class="mat-dropdown-plain" name="ddCustomer" [(ngModel)]="custId"
      (ngModelChange)="ddCustomer_Onchange()" (openedChange)="openedChangeSPAL($event)" placeholder="Select Customer"
      [disabled]="disabled">
      <mat-form-field class="filter-processarea" style="width: 100%;">
        <input matInput (keydown)="$event.stopPropagation()" (keyup)="applyFilterForCustomer($any($event.target).value)" [(ngModel)]="searchValueCUST"
          style="text-indent: 10px;" placeholder="Choose a Customer">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <mat-option *ngFor="let c of Customer" [value]="c.cusT_ID" [title]="c.cusT_NM">
        {{ c.cusT_NM}}
      </mat-option>
    </mat-select>
  </div>
  <div class="dropdown-wrapper">
    <mat-select class="mat-dropdown-plain" name="ddProject" [(ngModel)]="projId"
      (ngModelChange)="ddProject_Onchange()" (openedChange)="openedChangePJT($event)"
      placeholder="Select Project" [disabled]="disabled">
      <mat-form-field class="filter-processarea" style="width: 100%;">
        <input matInput (keydown)="$event.stopPropagation()" (keyup)="applyFilterForProject($any($event.target).value)" [(ngModel)]="searchValuePJT"
          style="text-indent: 10px;" placeholder="Choose a project">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <mat-option *ngFor="let p of Project" [value]="p.proJ_ID" [title]="p.proJ_NM">
        {{ p.proJ_NM}}
      </mat-option>
    </mat-select>
  </div>
</div>
