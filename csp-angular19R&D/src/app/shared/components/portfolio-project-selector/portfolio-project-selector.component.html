<!-- Portfolio & Project Selector - Horizontal Layout -->
<div class="portfolio-project-container">
  <!-- Portfolio Selector - Premier customers only -->
  <div class="selector-field" *ngIf="utilityService.IsPremier(custId)">
    <mat-form-field appearance="outline">
      <mat-label>Portfolio</mat-label>
      <mat-select multiple #select 
                  [(ngModel)]="portArray"   
                  (selectionChange)="getProjectListForPremier(portArray)">
        <mat-option [value]="-1" (click)="toggleSelection()" #allSelected>All</mat-option>
        <mat-option *ngFor="let port of portfolioList" 
                    (click)="tosslePerOne()" 
                    [value]="port.id">
          {{port.title}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  
  <!-- Project Selector - Multi-select for multiple projects -->
  <div class="selector-field" *ngIf="multiProject">
    <mat-form-field appearance="outline">
      <mat-label>Project</mat-label>
      <mat-select #mySel multiple 
                  [(ngModel)]="projArray" 
                  (ngModelChange)="ddProject_Onchange()">
        <!-- Custom trigger to show selection count -->
        <mat-select-trigger>
          <span *ngIf="projArray?.length === 0">Select projects...</span>
          <span *ngIf="projArray && projArray.length >= 1" 
                [title]="getSelectedProjectNames()">
            {{ getSelectedProjectNames() }}
          </span>
        </mat-select-trigger>
        
        <!-- Search Input inside dropdown -->
        <div class="dropdown-search">
          <mat-form-field appearance="outline" class="search-field">
            <input matInput 
                   placeholder="Search projects..." 
                   [(ngModel)]="projectSearchText" 
                   (ngModelChange)="filterProjects()" 
                   (click)="$event.stopPropagation()"
                   (keydown)="$event.stopPropagation()">
            <button mat-icon-button matSuffix *ngIf="projectSearchText" (click)="clearProjectSearch($event)">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>
        
        <mat-option [value]="-1" 
                    (click)="toggleProjectSelection()" 
                    #allProjectsSelected 
                    *ngIf="projectList.length > 0">
          All
        </mat-option>
        <mat-option *ngFor="let proj of filteredProjectList" 
                    (click)="tosslePerProject()" 
                    [title]="proj.proj_nm" 
                    [value]="proj.proj_id">
          {{proj.proj_nm}}
        </mat-option>
        <div *ngIf="filteredProjectList.length === 0" class="no-results">
          No projects found
        </div>
      </mat-select>
    </mat-form-field>
  </div>
  
  <!-- Project Selector - Single-select mode (no checkboxes, no All) -->
  <div class="selector-field" *ngIf="!multiProject">
    <mat-form-field appearance="outline">
      <mat-label>Project</mat-label>
      <mat-select [(ngModel)]="projectId" 
                  (ngModelChange)="ddProject_Onchange()"
                  [title]="getProjectName(projectId)">
        <!-- Search Input inside dropdown (only if many projects) -->
        <div class="dropdown-search" *ngIf="projectList.length > 5">
          <mat-form-field appearance="outline" class="search-field">
            <input matInput 
                   placeholder="Search projects..." 
                   [(ngModel)]="projectSearchText" 
                   (ngModelChange)="filterProjects()" 
                   (click)="$event.stopPropagation()"
                   (keydown)="$event.stopPropagation()">
            <button mat-icon-button matSuffix *ngIf="projectSearchText" (click)="clearProjectSearch($event)">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>
        
        <mat-option *ngFor="let proj of filteredProjectList" 
                    [title]="proj.proj_nm" 
                    [value]="proj.proj_id">
          {{proj.proj_nm}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Product Selector - Only when showProduct is enabled -->
  <div class="selector-field" *ngIf="showProduct && utilityService.IsPremier(custId)">
    <mat-form-field appearance="outline">
      <mat-label>Product</mat-label>
      <mat-select multiple #myprodSel 
                  [(ngModel)]="prodArray" 
                  (ngModelChange)="ddProduct_Onchange()">
        <mat-option [value]="-1" 
                    (click)="toggleProdSelection()" 
                    #allProdsSelected 
                    *ngIf="productList.length > 0">
          All
        </mat-option>
        <mat-option *ngFor="let prod of productList" 
                    (click)="tosslePerProduct()" 
                    [value]="prod.id">
          {{prod?.producT_TITLE}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
