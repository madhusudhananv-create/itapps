<div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <table class="table table-bordered" style="background-color: white">
        <thead>
          <tr>
            <th style="width:20%;text-align: center;">Customer</th>
            <th style="width:30%;text-align: center;">Project</th>
            <th style="width:10%;text-align: center;">Overall</th>
            <th style="width:10%;text-align: center;">Compliance</th>
            <th style="width:10%;text-align: center;">Value</th>
            <th style="width:10%;text-align: center;">Performance</th>
            <th style="width:10%;text-align: center;">Quality</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of TreeHealthReport">
            <td *ngFor="let col of row" [rowSpan]="col.rowSpan">
              <!-- <a class="link" (click)="showKpiCharts()"> -->
              <span *ngIf="!col.data">{{col.text}}</span>
              <div *ngIf="col.data" style="margin:auto;border-radius:50px;width: 42px;height: 42px;border-radius: 50px;font-weight: bold;padding:10px 0 0 6px;"
                [style.backgroundColor]="col.color">{{col.text}}</div>
              <!-- </a> -->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <button class="mat-raised-button" (click)="CancelOnClick()">Close</button>
