<div  *ngIf="showAccessRequestButton && !_access.IsAllowed(resourceId, accessType, '', '')">
  <button mat-button class="access-request-btn" (click)="requestAccess()" >Request Access {{feature}} </button>
</div>

  <ng-template  #confirmationDialogAccess >
  <h2 mat-dialog-title style="padding: 12px 13pc 0 13pc; margin: 0;">
    Confirm</h2>
    <mat-dialog-content style="padding: 12px 12px 0 12px; margin: 0 80px;">
    Are you sure you want to {{confirmAction}} the request?
  </mat-dialog-content>
  <div *ngIf="showReasonInput">
    <textarea [(ngModel)]="reasonText" rows="3" style="width: 80%; margin: 5px 30px;" 
    placeholder="Please provide a reason for rejection"></textarea>
  </div>
  <mat-dialog-actions style="padding: 20px;">
    <button mat-button [mat-dialog-close]="1" class="btn btn-primary" (click)="onConfirm(true)"
    style="margin: 0 100px;">Yes</button>
    <button mat-button [mat-dialog-close]="0" class="btn btn-warning" (click)="onConfirm(false)"
      style="margin-left: 5%;">No</button>
  </mat-dialog-actions>
</ng-template>
