<div class="row" style="padding:3px;border-collapse: collapse;">
  <mat-select placeholder="Filter by..." [(ngModel)]="selectedFilterPref" style="width:240px;background-color: white;border: solid #d0d0d0 1px;padding: 5px;margin-right: 5px;margin-left: 20px">
    <mat-option *ngFor="let field of filterPref" [value]="field" [title]="field.displaY_NAME">{{field.displaY_NAME}}</mat-option>
  </mat-select>
  <input *ngIf="selectedFilterPref.datA_TYPE === 'string'" type="text" style="background-color: white;border: solid #d0d0d0 1px;padding: 5px;width:50%"
    [(ngModel)]="selectedFilterPref.searchString" placeholder="Search text....">
  <mat-select *ngIf="selectedFilterPref.datA_TYPE === 'number'" placeholder="Filters" style="background-color: white;border: solid #d0d0d0 1px;padding: 5px;width:50%"
    [(ngModel)]="selectedFilterPref.searchString">
    <mat-option *ngFor="let option of selectedFilterPref.values" [value]="option.id" [title]="option.name">{{option.name}}</mat-option>
  </mat-select>
  <button name="btnAddFilter" (click)="tbnAddFilter_OnClick()" style="background-color: white;border: solid #d0d0d0 1px;height:32px;margin-right: 5px;margin-left:10px">Apply</button>
  <button name="btnAddFilter" (click)="btnClearFilter_OnClick()" style="background-color: white;border: solid #d0d0d0 1px;height:32px;;margin-left:10px">Clear</button>
</div>
<div class="row custom" style="padding:3px;border-collapse: collapse;">
  <span *ngFor="let filter of filterCriterias" style="border: solid 2px #509fff;height: 28px;vertical-align: middle;padding: 3px 4px 3px 4px;border-radius: 12px;
    margin: 3px;background-color: #e9eef5;">
    <label></label>
    {{filter.displaY_NAME}} : {{filter.searchStringValue}}
    <mat-icon style="color: #509fff;cursor:pointer" (click)="btnRemoveFilter_OnClick(filter)">cancel_outline</mat-icon>
  </span>
</div>
