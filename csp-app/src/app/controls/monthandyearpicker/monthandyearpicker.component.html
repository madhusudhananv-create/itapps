<div class="row" style="text-align: left">
  <div class="col-lg-12">
      <div class="container">
    <input type="radio" name="option" value="quarter" [checked]="selectedOption==='quarter'" [(ngModel)]="selectedOption" (change)="DateChange()">&nbsp;Quarter&nbsp;&nbsp;
    <input type="radio" name="option" value="range" [checked]="selectedOption==='range'" [(ngModel)]="selectedOption" (change)="DateChange()">&nbsp;Year to Quarter&nbsp;&nbsp;
    <select style="margin-right:10px" name='tableYear' [(ngModel)]="selectedYear" (change)="DateChange()" placeholder="Year"
      required>
      <option [value]="bb" *ngFor="let bb of years">{{bb}}</option>
    </select>
    
      <span style="font-family: calibri;font-weight: 600;">Q1</span>
      <mat-slider [(ngModel)]="selectedQuarter" (input)="onInputChange($event)" (change)="DateChange()" style="margin: 0 5px 0 5px;min-width: 70px;"
        class="example-margin" [max]="QuarterSlideMax" [min]="QuarterSlideMin" tickInterval="1" [step]="step" thumbLabel [displayWith]="formatLabel"
        vertical="false">
      </mat-slider>
      <span style="font-family: calibri;font-weight: 600;">Q4</span>
    </div>
  </div>
</div>
