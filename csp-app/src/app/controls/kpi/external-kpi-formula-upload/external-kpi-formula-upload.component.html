<div class="dialog" style="box-shadow: 0px -3px 3px #00000029;opacity: 1;overflow-x: hidden;">
  <div class="row" mat-dialog-title style="height: 40px;background: #EBEBEB 0% 0% no-repeat padding-box;opacity: 1;">

    <div style="float:left">
      <label
        style="height: 17px;text-align: left;font: normal normal normal 14px/17px Roboto,'Helvetica Neue',sans-serif;;letter-spacing: 0px;color: #333333;opacity: 1;margin-left: 15px;margin-top: 5px">Upload
        KPI Formulas</label>
    </div> 

    <div style="float:right;margin: 5px;">
      <a class="close-button" (click)="onClose()" style="color:#333333;cursor: pointer;">
        <mat-icon class="close-icon">close</mat-icon>
      </a>
    </div>
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>

  <div style="margin: 15px">
      
    <div class="row">
    Source
    </div>
    <div class="row">
        <select id="selectSource" style="width:calc(90% - 20px)"   [disabled]="_loading"   [(ngModel)]="selSource" class="form-control" >
          <option value="freshworks">FreshWorks</option>
          <!-- <option value="zif">ZIF</option> -->
        </select>
      </div>
      <div class="row"  *ngIf="selSource=='freshworks'">
        <br>
      <div class="row">
      <input type="file" #fileUpload class="form-control" name="single"  [disabled]="_loading"   accept=".csv" ng2FileSelect style="width:calc(90% - 20px)"/> 
      <span style="color:#4e5882; font-size: 9px;"><span style="color:red">*</span>.csv file only</span>
    </div>
    
    <div class="row">
      <button class="btn btn-primary" value="Upload"  [disabled]="_loading"  (click)='Save_onClick(fileUpload)'
      style="margin-left: 40%;"> Upload
    </button>
    </div>
  </div>
  <div class="row"  *ngIf="selSource=='zif'">
    <br>
  <div class="row">
  <input type="file" #fileUploadjson class="form-control" name="single"   [disabled]="_loading"   accept=".json" ng2FileSelect style="width:calc(90% - 20px)"/>
  
  <span style="color:#4e5882; font-size: 9px;"><span style="color:red">*</span>.json file only</span>
</div>

<div class="row">
  <button class="btn btn-primary" value="Upload"  [disabled]="_loading"  (click)='Save_onClick(fileUploadjson)'
  style="margin-left: 40%;"> Upload
</button>
</div>
</div>
   
  </div>
</div>
