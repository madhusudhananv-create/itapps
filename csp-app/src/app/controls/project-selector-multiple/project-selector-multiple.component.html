<div class="row">

  <div class="row">
    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
  </div>

    <div class="col-lg-6 col-md-6">
      <mat-form-field>
        <mat-select name="ddCustomer" [(ngModel)]='custId' multiple (selectionChange)="ddCustomer_Onchange($event)" 
          placeholder = "Customer" #selectCustomer>
          <mat-option value="-1" (click)="toggleSelectionForCustomer()" #allCustomerSelected>All</mat-option>
          <mat-option *ngFor="let c of Customer" [value]="c.cusT_ID" [title]="c.cusT_NM" (click)="customerTosslePerOne()">
            {{ c.cusT_NM}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-lg-6 col-md-6">
      <mat-form-field>
        <mat-select name="ddProject" [(ngModel)]="projId" multiple (ngModelChange)="ddProject_Onchange()" 
          placeholder = "Project" #selectProject>
          <mat-option value="-1" (click)="toggleSelectionForProject()" #allProjectSelected>All</mat-option>
          <mat-option *ngFor="let p of Project" [value]="p.proJ_ID" [title]="p.proJ_NM" (click)="projectTosslePerOne()">
            {{ p.proJ_NM}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
</div>
