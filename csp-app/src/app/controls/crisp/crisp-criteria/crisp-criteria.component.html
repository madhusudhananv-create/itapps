<form #criteriaForm="ngForm" (ngSubmit)="SubmitForm_criteria(criteriaForm)">
  <div class="row">
    <div class="col-lg-6">
      <div clasS="row">
        <mat-form-field>
          <mat-select name="ddCategories" [(ngModel)]="criteria.categorY_ID" placeholder="Category Name" required>
            <mat-option *ngFor="let c of categories" [value]="c.id" [title]="c.categorY_NAME">  
              {{ c.categorY_NAME}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div clasS="row">
        <mat-form-field>
          <input name="txtCriteriaName" maxlength="255" [(ngModel)]="criteria.criteriA_NAME" matInput placeholder="Category Name" required>
        </mat-form-field>
      </div>
      <div clasS="row">
          <mat-form-field>
            <input type="number" name="txtScore" [max]="100" [(ngModel)]="criteria.score" matInput placeholder="Score" required>
          </mat-form-field>
        </div>
      <div clasS="row">
        <mat-form-field>
          <input name="txtComments" [(ngModel)]="criteria.comments" matInput placeholder="Comments">
        </mat-form-field>
      </div>
      <div class="row">
        <button type="submit" class="btn btn-primary">Save</button>
        <a type="button" (click)="formreset(criteriaForm)" class="btn btn-primary">Cancel</a>
      </div>
    </div>
    <div class="col-lg-6">
      <mat-table #table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="index">
          <mat-header-cell [ngClass]="'indexWidth'" *matHeaderCellDef>No.</mat-header-cell>
          <mat-cell [ngClass]="'indexWidth'" *matCellDef="let element = index;"> {{ (element + 1) + (paginator.pageIndex) * paginator.pageSize  }} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="category">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Category Name</mat-header-cell>
          <mat-cell *matCellDef="let definitions">{{getCategory(definitions.categorY_ID)}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="criteriA_NAME">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Criteria Name</mat-header-cell>
          <mat-cell *matCellDef="let criteria">{{criteria.criteriA_NAME}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="score">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Score</mat-header-cell>
          <mat-cell *matCellDef="let criteria">{{criteria.score}}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="comments">
          <mat-header-cell *matHeaderCellDef mat-sort-header>Comments</mat-header-cell>
          <mat-cell *matCellDef="let criteria"> {{criteria.comments}} </mat-cell>
        </ng-container>
        <ng-container matColumnDef="edit">
          <mat-header-cell [ngClass]="'editWidth'" *matHeaderCellDef>
            <div *ngIf="_util.IsEditable()"></div>
          </mat-header-cell>
          <mat-cell [ngClass]="'editWidth'" *matCellDef="let element">
            <a class="link" (click)="EditRow_onClick(element)" *ngIf="_util.IsEditable()">
              <i class="fa fa-edit"></i>
            </a>
          </mat-cell>
        </ng-container>
        <ng-container matColumnDef="delete">
          <mat-header-cell [ngClass]="'deleteWidth'" *matHeaderCellDef>
            <div *ngIf="_util.IsEditable()"></div>
          </mat-header-cell>
          <mat-cell [ngClass]="'deleteWidth'" *matCellDef="let element">
            <a class="link" (click)="DeleteRow_onClick(element)" *ngIf="_util.IsEditable()">
              <i class="fa fa-trash"></i>
            </a>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
      <mat-paginator #paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </div>
  </div>
</form>
