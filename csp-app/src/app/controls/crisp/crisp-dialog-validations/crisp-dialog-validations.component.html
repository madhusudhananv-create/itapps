<div style="padding:10px">
  <table width="100%" class="table table-bordered" style="padding:15px">
    <tr>
      <th>Project</th>
      <th>C</th>
      <th>R</th>
      <th>I</th>
      <th>S</th>
      <th>P</th>
      <th style="font-size:12px">Total</th>
    </tr>
    <tr>
      <td style="padding:2px;font-size:10px;width:58%">{{ data.summary.projecT_NAME}}</td>
      <td *ngFor="let cat of data.summary.categories" [style.background-color]="cat.rag" style="padding:2px;width:6%;text-align:center">{{cat.score}}</td>
      <td style="padding:2px;width:6%;text-align:center" [style.background-color]="data.summary.rag">{{data.summary.score}}</td>
    </tr>
  </table>
  <table width="100%" class="table table-bordered" style="padding:15px;font-size:12px">
    <!-- <tr>
      <th colspan="3" style="text-align:center;font-size: 15px">{{data.category}}</th>
    </tr> -->
    <tr *ngIf="data.summary.validations.length > 0" style="background-color:#80808052">
      <th>Category</th>
      <th>Criteria</th>
      <th>Check Points</th>
      <th>Eligible</th>
      <th>Achieved</th>
      <th>Status</th>
    </tr>
    <tbody *ngIf="data.summary.validations.length > 0">
      <tr *ngFor="let val of data.summary.validations; let i = index">
        <td width="10%"><a  style="margin-top: 1px;cursor: pointer ;" (click)="navigate(val)">{{val.categorY_NAME}}</a> </td>
        <td width="10%">{{val.criteriA_NAME}}</td>
        <td width="50%">{{val.validatioN_NAME}}</td>
        <td width="5%">{{val.eligible}}</td>
        <td width="5%">{{val.score}}</td>
        <td width="10%">{{val.status}}</td>
      </tr>
    </tbody>
    <tbody *ngIf="data.summary.validations.length === 0">
      <th colspan="3" style="text-align: center;padding:10px">No comments to display</th>
    </tbody>
  </table>
  <div style="text-align:center;padding-bottom:2px">
    <button mat-button mat-dialog-close>Close</button>
  </div>
</div>
