<app-navbar style="z-index:1000 !important"></app-navbar>
<div class="row" style="margin-top: 5px">
  <div class="col-sm-2 col-lg-2">
    <!-- <button [routerLink]="['/dashboard']" class="btn">
      <i class="fa fa-chevron-left"></i>&nbsp;&nbsp;Back</button> -->
    <div *ngIf="_util.IsGAVS()" class="backbuttonlink" [routerLink]="['/newdashboard/custm']"> 
        <img src="assets/images/back_round.png">
    </div>  
  </div>
  <div class="col-sm-8 col-lg-8" style="text-align:center">
    <h2>CRISP Settings</h2>
  </div>
  <div class="col-sm-2 col-lg-2"></div>
</div>

<div style="padding: 0 10px 0 10px">
  <mat-accordion>
    <mat-expansion-panel *ngIf="_util.IsEditable()">
      <mat-expansion-panel-header>
        <mat-panel-title>
          Set CRISP Category
        </mat-panel-title>
        <mat-panel-description>
          Add or modify category
        </mat-panel-description>
      </mat-expansion-panel-header>
      <app-crisp-category></app-crisp-category>
    </mat-expansion-panel>
    <mat-expansion-panel  *ngIf="_util.IsEditable()">
      <mat-expansion-panel-header>
        <mat-panel-title>
          Set CRISP Criteria
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-crisp-criteria></app-crisp-criteria>
    </mat-expansion-panel> 
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          Set CRIPS Validations
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-crisp-validations></app-crisp-validations>
    </mat-expansion-panel>
  </mat-accordion>
</div>
