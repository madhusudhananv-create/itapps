<ng-template #confirmationDialog>
  <a class="link" (click)="close_PopUp()" style="margin-left: 95%; cursor: pointer;">
    <i class="fa fa-times" style="font-size: 25px;"></i>
  </a>
  <h3 style="text-align: center;">{{templateHeading}}</h3>

  <iframe [src]="templateUrl" width="100%" height="600px" seamless></iframe>
</ng-template>
