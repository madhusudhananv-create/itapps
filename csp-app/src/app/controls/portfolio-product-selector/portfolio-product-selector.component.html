<div class="row">
  <div class="col-lg-4 col-md-4 col-sm-4" *ngIf="includePortfolio"
    style=" text-align: left; margin-right: 20px; vertical-align: middle;">
    <mat-form-field style="width: 100%;">
      <mat-label> Portfolio :</mat-label>
      <mat-select style="margin-right: 10px;" #select [(ngModel)]="portArray"
        (selectionChange)="getProductList(portArray)">
        <mat-option *ngFor="let port of portfolioList" [value]="port.id">{{port.title}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-lg-6 col-md-6 col-sm-6">
    <mat-form-field style="width: 100%;">
      <mat-label> Product :</mat-label>
      <mat-select #mySel [(ngModel)]="prodArray" (ngModelChange)="ddProduct_Onchange()"
        (openedChange)="resetFilterValue($event)">
        <mat-form-field class="filter-scope" style="width: 100%;">
          <input matInput #searchInput (keyup)="applyFilterForScope(searchInput.value)" style="text-indent: 10px;"
            placeholder="Search Product">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
        <mat-option *ngFor="let prod of productList" [value]="prod.id">{{prod.producT_TITLE}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>
<div class="row">
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
</div>
