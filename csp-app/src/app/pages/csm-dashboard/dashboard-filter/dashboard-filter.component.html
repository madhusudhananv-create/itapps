<div class="row">
  <app-navbar-new [ShowMenu]="true" (showDashboardMenu)="onMenuToggleChange($event)"></app-navbar-new>
  <app-menu [custid]="selectedCust" *ngIf="menuToggleStatus" ></app-menu> 
</div>
<div class="row">
  <!-- <div class="col-lg-2 col-md-2 col-sm-2">
     <app-customer-navigation (custId)="checkCustomer($event)" (projId)="checkProjects($event)" (portfolioId)="checkPortfolios($event)"></app-customer-navigation>   
  </div> -->
  <div class="col-lg-1 col-md-1 col-sm-1">
    <label style="height: 15px;text-align: left;font-size:12px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">Customers</label>
  </div>
  <div class="col-lg-3 col-md-3 col-sm-3" style="margin-left: -45px">
  
<mat-form-field floatLabel="never" class="no-line" style="width: 80%;margin-top: -15px;">
  <mat-select #identifiedSelect name="ddlCustomer" class="drpdown" [(ngModel)]="selectedCust" (ngModelChange)="selectedCust_OnChange($event)">
    <mat-option *ngFor="let list of customers;" [value]="list.cusT_ID">
      {{list.cusT_NM}}
    </mat-option>
  </mat-select>
</mat-form-field> 
</div>
<div class="col-lg-1 col-md-1 col-sm-1" *ngIf="_util.IsPremier(selectedCust)" style="margin-left: -40px;">
  <label style="height: 15px;text-align: left;font-size:12px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">Portfolio</label>
</div>
<div class="col-lg-3 col-md-3 col-sm-3" *ngIf="_util.IsPremier(selectedCust)" style="margin-left: -70px;">  
  <mat-form-field floatLabel="never" class="no-line" style="width: 80%;margin-top: -15px;margin-left: 15px;">
  <mat-select #portSelect multiple name="ddlPortfolio" class="drpdown" [(ngModel)]="selectedPortfolio" (ngModelChange)="portfolio_OnChange($event)">
    <mat-option [value]="-1" (click)="toggleSelection()" #allSelected>All</mat-option>
    <mat-option *ngFor="let port of portfolioList" (click)="tosslePerOne()" [value]="port.id">{{port.title}}</mat-option>
  </mat-select>
  </mat-form-field>
</div>
<div class="col-lg-1 col-md-1 col-sm-1" *ngIf="_util.IsPremier(selectedCust)" style="margin-left: -30px;">
  <label style="height: 15px;text-align: left;font-size:12px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">Projects</label>
</div>
<div class="col-lg-3 col-md-3 col-sm-3" *ngIf="_util.IsPremier(selectedCust)" style="margin-left: -70px;">
  <mat-form-field floatLabel="never" class="no-line" style="width: 80%;margin-top: -15px;margin-left: 15px;">
    <mat-select #projectSelect name="ddlProjects" class="drpdown" [(ngModel)]="selectedProj" (ngModelChange)="selectedProjects_OnChange($event)" multiple>
     <mat-option [value]="'-1'" (click)="tosslePerProjectAll()" #allSelected *ngIf="projects?.length > 0">All</mat-option> 
     <mat-option *ngFor="let proj of projects " (click)="tosslePerProject()" [value]="proj.proj_id ">
       {{proj.proj_nm}}
      </mat-option>
    </mat-select>
   </mat-form-field>
</div> 
<div class="col-lg-1 col-md-1 col-sm-1" style="margin-left: -35px;" *ngIf="!_util.IsPremier(selectedCust)">
  <label style="height: 15px;text-align: left;font-size:12px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">Projects</label>
</div>
<div class="col-lg-3 col-md-3 col-sm-3" style="margin-left: -70px;" *ngIf="!_util.IsPremier(selectedCust)">
  <mat-form-field floatLabel="never" class="no-line" style="width: 80%;margin-top: -15px;margin-left: 15px;">
   <mat-select #projectSelect name="ddlProjects" class="drpdown" [(ngModel)]="selectedProj" (ngModelChange)="selectedProjects_OnChange($event)" multiple>
    <mat-option [value]="'-1'" (click)="tosslePerProjectAll()" #allSelected *ngIf="projects?.length > 0">All</mat-option> 
    <mat-option *ngFor="let proj of projects " (click)="tosslePerProject()" [value]="proj.proJ_ID ">
      {{proj.proJ_NM}}
     </mat-option>
   </mat-select>
  </mat-form-field>
</div>
</div>

  <div class="slider" style="float: right;margin-right: 35px;">
   <mat-slide-toggle [(ngModel)]="isChecked" >View High Level Data</mat-slide-toggle>
  </div> 
   
</div>
<div>
  <app-customer-navigation [opened]="isChecked" [customerId]="customerId"></app-customer-navigation>
</div> -->

<div class="row" *ngIf="loading">
  <mat-tab-group class="navTabGrp" [selectedIndex]="0">
      <mat-tab label="Operational Dashboard">
          <ng-template matTabContent>
            <app-csm-customer-dashboard [customerId]="customerId" [projId]="projId" [portfolioId]="portId"></app-csm-customer-dashboard>              
          </ng-template>
      </mat-tab>
      <mat-tab label="Business Value Dashboard">
          <ng-template matTabContent>
              <app-bvd-dashboard [customerId]="customerId"></app-bvd-dashboard>
          </ng-template>
      </mat-tab>
  </mat-tab-group>
</div>
