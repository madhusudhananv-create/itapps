<div class="issueMap">
  <div *ngIf="_util.chartsMonthly">
    <mat-card style="height:250px;width:329px;box-shadow: 0 0 1px -2px rgba(0,0,0,.8), 0 0px 2px 0 rgba(0,0,0,0.54), 0 0px 5px 0 rgba(0,0,0,.12);">
        <mat-card-header>
            <mat-card-title>Issue Progress Status</mat-card-title>
        </mat-card-header>
        <highcharts-chart [Highcharts]="Highcharts" [options]="_util.chartsMonthly.issueChartHighChart" style="width: 100%; height: 225px; display: block;">
        </highcharts-chart>
    </mat-card>
</div>
</div>
