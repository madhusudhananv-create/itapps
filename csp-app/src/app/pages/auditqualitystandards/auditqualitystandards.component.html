
<app-navbar-new [ShowMenu]="false"></app-navbar-new>

<br>
<div style="font-size: 16px; font-weight: 700;font-family: 'Roboto', sans-serif; margin-bottom: 15px;color: #4e5882">
    <div style="display: inline-block; ">
      Auditor Quality Standards
    </div>
</div>

<div #TABLE *ngIf="!editmode">
    <table class="table" mat-table #table [dataSource]="dataSource" matSort style="width: 100%" *ngIf="result?.length > 0">
      <ng-container matColumnDef="index">
        <th mat-header-cell style="font-family: calibri;" [ngClass]="'indexWidth'" *matHeaderCellDef mat-sort-header>
          S.No
        </th>
        <td mat-cell *matCellDef="let row; let element = index">
          {{ (paginator.pageIndex * paginator.pageSize) + element + 1 }}
        </td>
      </ng-container> 
      <ng-container matColumnDef="frsT_NM">
        <th mat-header-cell style="font-family: calibri;" [ngClass]="'idendateWidth'" *matHeaderCellDef mat-sort-header>
          Name</th>
        <td mat-cell *matCellDef="let Item">{{Item.frsT_NM}}</td>
      </ng-container>
      <ng-container matColumnDef="procesS_MODEL">
        <th mat-header-cell style="font-family: calibri;" [ngClass]="'idendateWidth'" *matHeaderCellDef mat-sort-header>
          Process Model Name</th>
        <td mat-cell *matCellDef="let Item">{{Item.procesS_MODEL}}</td>
      </ng-container>
      <ng-container matColumnDef="effectivE_FROM">
        <th mat-header-cell style="font-family: calibri;" [ngClass]="'idendateWidth'" *matHeaderCellDef mat-sort-header>
          Effective From</th>
        <td mat-cell *matCellDef="let Item"> {{Item.effectivE_FROM | date :'dd-MMM-yyyy'}} </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell style="font-family: calibri;" [ngClass]="'editWidth'" *matHeaderCellDef>Action</th>
        <td mat-cell [ngClass]="'editWidth'" *matCellDef="let Item">
          <a class="link" (click)="EditRow_onClick(Item)" style="font-size: 18px; cursor: pointer;">
            <i class="fa fa-edit"></i>
          </a>
          </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="mat-elevation-z5"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="mat-elevation-z5"
        style="margin-bottom: 5px; box-sizing: border-box"></tr>
    </table>
    <div>
      <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[10, 20, 30]"></mat-paginator>
    </div>
</div>

<div *ngIf="editmode">
    <form style="background: white;padding-left: 10px;padding-bottom: 10px;" #audititemForm="ngForm"
      (ngSubmit)="SubmitForm(audititemForm.valid)">
      <div class="row tabheader">
        <div class="col-lg-10 col-md-10 col-sm-10">
        </div>
        <div class="col-lg-2 col-md-2 col-sm-2 header">
          <button class="link_button" type="submit" style="margin-right: 10px;">
            <i class="fa fa-save"></i>
          </button>
          <a class="link" (click)="Cancel_onClick()" style="cursor: pointer;">
            <i class="fa fa-times"></i>
          </a>
        </div>
      </div>
        
        <div class="row">
            <mat-form-field style="width:30%">
              <mat-select name="ddEmployee" [(ngModel)]="editItem.emP_ID" [disabled]="true" placeholder="Employee Name" required>
                <mat-option [value]="item.emP_ID" *ngFor="let item of empList">{{item.frsT_NM}}</mat-option>
              </mat-select>
            </mat-form-field>
        </div>
  
        <div class="row">
            <mat-form-field style="width:30%">
            <mat-select name="ddProcessModel" [(ngModel)]="editItem.title" placeholder="Process Model" multiple>
                <mat-option [value]="item.title" *ngFor="let item of ProcessModelList" [title]="item.title">{{item.title}}</mat-option>
            </mat-select>
            </mat-form-field>
        </div>
  
        <div class="row">
          <mat-form-field>
            <input [max]="_util.Today()" matInput name="dtEffectiveFrom" [(ngModel)]="editItem.effectivE_FROM"
              [matDatepicker]="picker1" placeholder="Effective From" required>
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="row">
          <button type="submit" class="btn btn-success">Save</button>
        </div>

    </form>
  </div>
