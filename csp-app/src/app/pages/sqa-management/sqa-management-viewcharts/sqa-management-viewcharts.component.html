<div style="background-color: #e9ebf0">
  <div class="row" style="margin:5px">
    <div class="col-lg-6 col-md-6 col-sm-6">
      <div style="margin:10px;background-color:white;height:200px">
        <div class="row" style="padding: 0 5px 0 5px">
          <div class="col-lg-6 col-md-6 col-sm-6">
            <mat-form-field class="padding10">
              <input name='dtStartDate' [(ngModel)]='starT_DATE' matInput [matDatepicker]="pickerGroupStartDate" placeholder="Start Date"
                required>
              <mat-datepicker-toggle matSuffix [for]="pickerGroupStartDate"></mat-datepicker-toggle>
              <mat-datepicker #pickerGroupStartDate></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="col-lg-6 col-md-6 col-sm-6">
            <mat-form-field class="padding10">
              <input name='dtEndDate' [(ngModel)]='enD_DATE' matInput [matDatepicker]="pickerGroupEndDate" placeholder="End Date" required>
              <mat-datepicker-toggle matSuffix [for]="pickerGroupEndDate"></mat-datepicker-toggle>
              <mat-datepicker #pickerGroupEndDate></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-6 col-md-6 col-sm-6">
            <mat-form-field class="padding10">
              <mat-select name="ddChartUsers1" [(ngModel)]="selectedChartUser" placeholder="Select Chart User" (ngModelChange)="ChartUsers_onChange($event)">
                <mat-option *ngFor="let r of lstChartUsers" [value]="r" [title]="r">{{r}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col-lg-6 col-md-6 col-sm-6">
            <mat-form-field class="padding10">
              <mat-select name="ddChartGroups1" [(ngModel)]="selectedChartGroup" placeholder="Select chart Group" (ngModelChange)="ChartGroups_onChange($event)">
                <mat-option *ngFor="let r of lstChartGroups" [value]="r" [title]="r">{{r}}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="row" style="text-align: center; padding-bottom: 5px">
          <div class="col-lg-11 col-md-11 col-sm-11">
            <button class="btn btn-success" value="Generate Chart" (click)='GenerateCharts_onClick()' style="margin-right:5px">Generate charts</button>
          </div>
          <div class="col-lg-1 col-md-1 col-sm-1">
            <mat-icon class="link" (click)='Refresh_onClick()' matTooltip="Refresh">refresh_circle</mat-icon>
          </div>
        </div>
        <div *ngIf="_loadingCharts" class="row">
          <div class="col-lg-12 col-md-12 col-sm-12" style="font-size:26px">
            Loading <span class="countfont">{{iChartCurrent}}</span> of <span class="countfont">{{this.iChartCount}}</span> charts
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-6">
      <div style="margin:10px;background-color:white;height:200px">
        <!-- <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12"> -->
        <div class="example-container">
          <table mat-table [dataSource]="filteredCharts" class="table table-bordered">
            <ng-container matColumnDef="index">
              <th mat-header-cell [ngClass]="'indexWidth'" *matHeaderCellDef>No.</th>
              <td mat-cell [ngClass]="'indexWidth'" *matCellDef="let element = index;"> {{(element + 1)}} </td>
            </ng-container>
            <ng-container matColumnDef="subcategory">
              <th mat-header-cell *matHeaderCellDef>Perspective</th>
              <td mat-cell *matCellDef="let definitions">{{definitions.subcategory}}</td>
            </ng-container>
            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef>Chart Title</th>
              <td mat-cell *matCellDef="let definitions">{{definitions.title}}</td>
            </ng-container>
            <ng-container matColumnDef="edit">
              <th [ngClass]="'editWidth'" *matHeaderCellDef>
                <div></div>
              </th>
              <td mat-cell [ngClass]="'editWidth'" *matCellDef="let element">
                <a class="link" (click)="EditRow_onClick(element)" style="padding-right:5px">
                  <i class="fa fa-edit"></i>
                </a>
                <a class="link" (click)="DeleteRow_onClick(element)" style="padding-right:5px">
                  <i class="fa fa-trash"></i>
                </a>
                <a class="link" (click)="SaveRow_onClick(element)">
                  <i class="fa fa-save"></i>
                </a>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
        <!-- </div>
        </div> -->
      </div>
    </div>
  </div>
</div>
<mat-progress-bar *ngIf="_loadingCharts" mode="indeterminate"></mat-progress-bar>
<div class="row" style="background-color: #e9ebf0">
  <div *ngFor="let chart of ProjectVisualCharts" class="col-lg-6 col-md-6 col-sm-12">
    <div style="padding:5px 10px 5px 10px">
      <highcharts-chart [Highcharts]="Highcharts" [options]="chart" [(update)]="updateFromInput" [oneToOne]=true style="width: 100%; display: block;">
      </highcharts-chart>
    </div>
  </div>
</div>
