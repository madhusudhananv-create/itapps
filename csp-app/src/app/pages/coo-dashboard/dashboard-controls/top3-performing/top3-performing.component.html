<div class="row">
    <div class="col-lg-12 Top3Performing" style="left: 18%;">
        <i [ngClass]="top3Performing=='P' ? 'fa fa-thumbs-up' : 'fa fa-thumbs-down'"
            style="margin-left: -28px; margin-top: 5px;"></i> 
        <mat-form-field class="noUnderline"
            style="width:170px;margin-top: -10px;margin-bottom: -10px;">
            <mat-select name="top3Performing" (ngModelChange)="ontop3PerformingChange($event)" [(ngModel)]="top3Performing">
                <mat-option value="P">
                    Overall Top 3 Performing
                </mat-option>
                <mat-option value="NP">
                    Overall Top 3 Non Performing
                </mat-option>       
            </mat-select>
        </mat-form-field>
    </div>
</div>
<div class="row">
    <div class="col-lg-12 marginleft-10px">
        <mat-tab-group class="Top3Perform"  [selectedIndex]="0" (selectedTabChange)="OntabChange()">
            <mat-tab label="Accounts" *ngIf="_cooDashboardCommon.top3CSSAccounts!=null">
                <div *ngIf="_cooDashboardCommon.top3CSSAccounts.length>0">
                    <div class="row" *ngFor="let t of _cooDashboardCommon.top3CSSAccounts">
                        <div class="col-lg-10">
                            <span class="top3Performvalues" title="{{t.Name}}"> {{t.Name}}</span>
                        </div>
                        <div class="col-lg-2">
                            {{t.value}}%
                        </div>
                    </div>
                </div>
                <div *ngIf="_cooDashboardCommon.top3CSSAccounts.length==0">
                    <div class="row">
                        <div class="col-lg-12">
                            No data available
                        </div>
                    </div>
                </div>
            </mat-tab>
            <mat-tab label="Portfolios"
                *ngIf="_cooDashboardCommon.top3CSSPortfolios!=null && _cooDashboardCommon.top3CSSPortfolios.length>0">
                <div *ngIf="_cooDashboardCommon.top3CSSPortfolios.length>0">
                    <div class="row" *ngFor="let t of _cooDashboardCommon.top3CSSPortfolios">
                        <div class="col-lg-10">
                            <span class="top3Performvalues" title="{{t.Name}}"> {{t.Name}}</span>
                        </div>
                        <div class="col-lg-2">
                            {{t.value}}%
                        </div>
                    </div>
                </div>
                <div *ngIf="_cooDashboardCommon.top3CSSPortfolios.length==0">
                    <div class="row">
                        <div class="col-lg-12">
                            No data available
                        </div>
                    </div>
                </div>
            </mat-tab>
            <mat-tab label="Projects" *ngIf="_cooDashboardCommon.top3CSSProjects!=null">
                <div *ngIf="_cooDashboardCommon.top3CSSProjects.length>0">
                    <div class="row" *ngFor="let t of _cooDashboardCommon.top3CSSProjects">
                        <div class="col-lg-10">
                            <span class="top3Performvalues" title="{{t.Name}}"> {{t.Name}}</span>
                        </div>
                        <div class="col-lg-2">
                            {{t.value}}%
                        </div>
                    </div>
                </div>
                <div *ngIf="_cooDashboardCommon.top3CSSProjects.length==0">
                    <div class="row">
                        <div class="col-lg-12">
                            No data available
                        </div>
                    </div>
                </div>
            </mat-tab>
        </mat-tab-group>

    </div>
</div>
