<div class="row" style="margin-top: 30px !important; height: 50px !important">
  <div class="col-lg-6 col-md-6 col-sm-6" style="text-align: left">
    <label class="titlename">Review & Approve</label>
  </div>
  <div class="col-lg-6 col-md-6 col-sm-6" style="text-align: right; padding-right: 30px">
    <button class="btnBack" (click)="setBack()" style="margin-right: 7px">Back</button>
    <!-- *ngIf="_util.IsCSM()" -->
    <button class="btnView" *ngIf="_util.IsCSM()" [disabled]="disabled" style="margin-right: 7px" (click)="submitReviewerResponse()">Submit Response</button>
    <button class="btnNext" *ngIf="disabled" (click)="setNext()" style="margin-right: 7px">Next</button>
  </div>
</div>

<div *ngIf="isLoading" style="text-align: center; height: 100px; line-height: 100px;">
  <i class="fa fa-circle-o-notch fa-spin" style="margin-right: 10px; font-size: 25px;"></i>Loading...
</div>

<div *ngIf="!isLoading" style="width: 97%; padding-left: 15px; padding-right: 15px; margin-left: auto; margin-right: auto;
 min-height: 573px;background: #FFFFFF 0% 0% no-repeat padding-box;box-shadow: -2px 2px 3px #00000007;border: 2px solid #E3E4E9;opacity: 1;">
  <div class="row">
    <label style="top: 208px;left: 34px;width: 97px;height: 19px;text-align: left;font: normal normal normal 16px/19px Lato;letter-spacing: 0px;color: #2A397D;opacity: 1;margin-top: 10px;">Idea's Activity</label>
  </div>
  <div class="row">
    <div class="col-lg-8 col-md-8 col-sm-8">
      <mat-vertical-stepper #stepper class="vertStep">
        <ng-template matStepperIcon="number">
          <mat-icon></mat-icon>
        </ng-template>
        <ng-template matStepperIcon="edit">
          <mat-icon></mat-icon>
        </ng-template>
        <ng-template matStepperIcon="idea">
          <mat-icon></mat-icon>
        </ng-template>
        <ng-template matStepperIcon="addBenefit">
          <mat-icon></mat-icon>
        </ng-template>
        <ng-template matStepperIcon="impPlan">
          <mat-icon></mat-icon>
        </ng-template>

        <mat-step *ngFor="let stage of _bvdService.bvdstages" label={{stage.action}}>
          <div>
            <i>{{stage.updateD_FORMAT_DATE}}</i>
          </div>
          <div>
            <i>{{stage.updateD_PERSON}}</i>
          </div>
        </mat-step>

      </mat-vertical-stepper>
    </div>
    <!-- *ngIf="_util.IsCSM()" -->
    <div class="col-lg-4 col-md-4 col-sm-4" *ngIf="_util.IsCSMorPM()"> 
      <label class="control-label" style="top: 246px;left: 722px;width: 33px;">Status</label>
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-label class="placeholder" style="top: 276px;left: 732px;width: 68px;margin-top: 10px;margin-left: 10px">Select Status</mat-label>
        <mat-select class="input" [disabled]="disabled" [(ngModel)]="review.ideA_STATUS_ID" style="top: 266px;left: 722px;width: 297px;height: 35px;">
          <mat-option *ngFor="let st of status" [value]="st.id">
            {{ st.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <label class="control-label" style="top: 321px;left: 722px;width: 57px;">Comments</label>
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-label class="placeholder" style="top: 351px;left: 732px;width: 112px;margin-top: 10px;margin-left: 10px">Enter your comments</mat-label>
        <textarea matInput class="input" [readonly]="disabled" [(ngModel)]="review.revieW_COMMENTS" style="top: 341px;left: 722px;width: 605px;height: 120px;"></textarea>
      </mat-form-field>
    </div>
  </div>
</div>
