<div style="width: 100%;height: 509px;background: #FFFFFF 0% 0% no-repeat padding-box;
box-shadow: -2px 2px 3px #00000007;border: 2px solid #E3E4E9;opacity: 1;">
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <label style="margin: 10px;height: 19px;text-align: left;font: normal normal normal 16px/19px Lato;letter-spacing: 0px;color: #2A397D;opacity: 1;">
        Similar Ideas/Innovations/ available.Do you want to use it?
      </label>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <table mat-table [dataSource]="dataSource" class="table mat-elevation-z0">
        <ng-container matColumnDef="ideaDescription">
          <th mat-header-cell *matHeaderCellDef style="width: 30% !important">Idea Description</th>
          <td mat-cell *matCellDef="let description">{{description.description}}</td>
        </ng-container>
        <ng-container matColumnDef="projecT_NAME">
          <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Project Name</th>
          <td mat-cell *matCellDef="let description">{{description.projecT_NAME}}</td>
        </ng-container>
        <ng-container matColumnDef="customeR_NAME">
          <th mat-header-cell *matHeaderCellDef style="width: 10% !important;">Customer Name</th>
          <td mat-cell *matCellDef="let description" >{{description.customeR_NAME}}</td>
        </ng-container>
        <ng-container matColumnDef="identifiedDate">
          <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Identified Date</th>
          <td mat-cell *matCellDef="let description">{{description.identifieD_DATE | date :'dd-MMM-yyyy'}}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef style="width: 10% !important;">Status</th>
          <td mat-cell *matCellDef="let description" >{{description.status}}</td>
        </ng-container>
        <ng-container matColumnDef="identifiedBy">
          <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Identified By</th>
          <td mat-cell *matCellDef="let description">{{description.identifieD_BY}}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="width: 5% !important;">Actions</th>
          <td mat-cell *matCellDef="let description">
            <a class="Uselink" style="margin-left: 10px">Use ></a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>

</div>
