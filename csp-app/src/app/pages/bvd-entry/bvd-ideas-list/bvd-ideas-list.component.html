<div class="container">
  <div class="row" style="width: 1080px;margin-top: 10px">
    <div class="col-lg-6 col-md-6 col-sm-6">
      <label style="top: 91px;left: 15px;width: 194px;height: 22px;text-align: left;font: normal normal 600 18px/22px Lato;letter-spacing: 0px;color: #4C4C47;opacity: 1;">Ideas and Improvements</label>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-6">
      <button style="margin-left:350px;width: 105px;height: 30px;background: #4B4EB1 0% 0% no-repeat padding-box;border-radius: 5px;opacity: 1;font: normal normal medium 14px/17px Lato;letter-spacing: 0px;color: #FFFFFF;opacity: 1;">+ Add New</button>
    </div>
  </div>
  <div class="row" style="margin-top: 20px;width: 952px;margin-left: -2px">
    <label class="col-lg-1 col-md-1 col-sm-1 control-label" style="margin-top: 5px;width:33px">Status</label>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-select style="top: 128px;left: 55px;width: 124px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
    <label class="col-lg-1 col-md-1 col-sm-1 control-label" style="margin-top: 5px;width: 37px;margin-left:-20px">Project</label>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-select style="top: 128px;left: 251px;width: 196px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
    <label class="col-lg-1 col-md-1 col-sm-1 control-label" style="margin-top: 5px;width: 25px;margin-left:50px">Type</label>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-select style="top: 128px;left: 497px;width: 148px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
    <label class="col-lg-1 col-md-1 col-sm-1 control-label" style="margin-top: 5px;width: 63px;">Responsible</label>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-select style="top: 128px;left: 733px;width: 204px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
  </div>


  <div class="row">
    <div class="col-lg-3 col-sm-3 col-md-3">
      <mat-form-field floatLabel="never" class="no-line" style="width: 100%;margin-top: -15px;">
        <mat-label class="control-label" style="top: 172px;left: 21px;width: 72px;margin-left:5px">Filter Options</mat-label>
        <mat-select style="top: 168px;left: 15px;width: 138px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-6" style="margin-left:-170px">
      <mat-form-field style="margin-top: -15px;width:600px" class="no-line">
        <mat-label style="width: 35px;height: 15px;text-align: left;font: normal normal normal 12px/15px Lato;letter-spacing: 0px;color: #000000;opacity: 1;margin-left:5px">Search</mat-label>
        <input matInput type="text" style="width: 1065px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;">
        <button mat-button matSuffix mat-icon-button>
          <mat-icon style="margin-left:-40px;margin-top: -10px">search</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2" style="margin-left:-50px">
      <button style="left: 1234px;width: 75px;height: 26px;background: #7192FF 0% 0% no-repeat padding-box;border-radius: 4px;opacity: 1;text-align: center;font: normal normal medium 12px/15px Lato;letter-spacing: 0px;color: #FFFFFF;">Apply</button>
    </div>
    <div class="col-lg-1 col-md-1 col-sm-1" style="margin-left:-140px">
      <button style="width: 50px;height: 25px;text-align: left;font: normal normal normal 12px/15px Lato;letter-spacing: 0px;color: #4B4EB1;opacity: 1;">Reset</button>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-2 col-sm-2 col-md-2"></div>
    <div class="col-lg-2 col-sm-2 col-md-2"></div>
    <label class="col-lg-2 col-md-2 col-sm-2 control-label" style="left:275px;margin-top: 5px">Bulk Action</label>
    <div class="col-lg-2 col-sm-2 col-md-2" style="margin-top: -10px;left:120px">
      <mat-form-field class="no-line" style="width: 100%;margin-top: -8px">
        <mat-select style="width: 105px;height: 25px;background: #FFFFFF 0% 0% no-repeat padding-box;border: 0.5px solid #C3C3C3;border-radius: 2px;opacity: 1;"></mat-select>
      </mat-form-field>
    </div>
    <div class="col-lg-3 col-sm-3 col-md-3" style="left:15px">
      <button style="width: 75px;height: 25px;background: #7192FF 0% 0% no-repeat padding-box;border-radius: 2px;opacity: 1;text-align: center;font: normal normal medium 12px/15px Proxima Nova;letter-spacing: 0px;color: #FFFFFF;">Submit</button>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" class="table mat-elevation-z0">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox class="select"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox class="select"></mat-checkbox>
      </td>

    </ng-container>
    <ng-container matColumnDef="ideaDescription">
      <th mat-header-cell *matHeaderCellDef>Idea Description</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.ideaDescription}}</td>
    </ng-container>
    <ng-container matColumnDef="ideaType">
      <th mat-header-cell *matHeaderCellDef>Identified Date</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.ideaType}}</td>
    </ng-container>
    <ng-container matColumnDef="project">
      <th mat-header-cell *matHeaderCellDef>Project</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.project}}</td>
    </ng-container>
    <ng-container matColumnDef="responsible">
      <th mat-header-cell *matHeaderCellDef>Responsible</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.responsible}}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let listIdeas" [ngClass]="{'Waiting': listIdeas.status == 'Waiting for Approval',
            'InProgress': listIdeas.status == 'In Progress','Completed': listIdeas.status == 'Completed'}">{{listIdeas.status}}</td>
    </ng-container>
    <ng-container matColumnDef="identifiedDate">
      <th mat-header-cell *matHeaderCellDef>Identified Date</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.identifiedDate}}</td>
    </ng-container>
    <ng-container matColumnDef="targetDate">
      <th mat-header-cell *matHeaderCellDef>Target Date</th>
      <td mat-cell *matCellDef="let listIdeas">{{listIdeas.targetDate}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let listIdeas">
        <a class="Uselink" style="margin-left: 10px">View></a>
      </td>
    </ng-container>
    <ng-container matColumnDef="ellipsis">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef>
        <!-- <i class="fa fa-ellipsis-v" style="width: 3px;height: 10px;opacity: 1;background: #999999;"></i> -->
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="approval">
          <mat-icon style="margin-top:-20px;margin-left:-20px">more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon style="color: green">check_circle</mat-icon>
            <span style="width: 45px;height: 15px;text-align: left;font: normal normal medium 12px/15px Lato;letter-spacing: 0px;color: #7E7E7E;opacity: 1;">Approve</span>
          </button>
          <hr style="background: #FFFFFF 0% 0% no-repeat padding-box;border: 1px solid #D3D3D3;opacity: 1;">
          <button mat-menu-item>
            <mat-icon style="color: red">highlight_off</mat-icon>
            <span style="width: 33px;height: 15px;text-align: left;font: normal normal medium 12px/15px Lato;letter-spacing: 0px;color: #7E7E7E;opacity: 1;">Reject</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
