    <div class="row" style="padding: 10px;">
      <div class="col-lg-12 col-md-12 col-sm-12" style="text-align: left;">
        <button *ngIf="!bAddNewObjective" (click)="btnAddObjective_Onclick()" style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary" >
          Add New Objective</button>
            <table *ngIf="bAddNewObjective" class="table-bordered" style="width:400px; text-align:right">
            <tr style="text-align: center">
              <td>New Objective</td>
            </tr>
            <tr style="text-align: center">
              <td>
                <input [(ngModel)]="newObjective.title" style="width:400px" placeholder="Objective title">
              </td>
            </tr>
            <tr style="text-align: center">
              <td>
                <textarea [(ngModel)]="newObjective.description" style="height:100px;width:400px" placeholder="Objective description"></textarea>
              </td>
            </tr>
            <tr style="text-align: center">
              <td>
                <button (click)="btnSaveObjective_Onclick()" style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary">Save</button>
                <button (click)="btnCancelObjective_Onclick()" style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary">Cancel</button>
              </td>
            </tr>
          </table>
      </div>
    </div>

    <div class="row" style="text-align: right; padding-bottom: 10px;">
      <div class="col-lg-4 col-md-4 col-sm-4" style="text-align: left;">   
        <mat-select class="mat-dropdown-plain" style="width:250px !important" name="ddObjectives" [(ngModel)]="selectedObjective"
            (selectionChange)="ddObjectiveChange()" placeholder="Choose Objective to map Process" required>
            <mat-option *ngFor="let c of ObjectivesList" [value]="c" [title]="c.description"
            [ngStyle]="{'color' : c.isMapped ? 'green' : 'red'}">{{c.description}}</mat-option>
        </mat-select>
      </div>
      <div class="col-lg-8 col-md-8 col-sm-8" style="text-align: right;">
        <mat-select class="mat-dropdown-plain" style="width:200px !important; margin-right: 5px;" name="ddProcessModel" [(ngModel)]="selectedProcessModel"
            (selectionChange)="getServiceAreaForAModel()" placeholder="Filter By Process Model" required>
            <mat-option *ngFor="let c of ProcessModelList" [value]="c" [title]="c.title">{{c.title}}</mat-option>
        </mat-select>
       
        <mat-select class="mat-dropdown-plain" style="width:200px !important; margin-right: 5px" name="ddProcessArea" [(ngModel)]="selectedProcessArea"
            (selectionChange)="getObjectivesForProcessArea()" placeholder="Filter By Process Area" required>
            <mat-option *ngFor="let c of ProcessAreaList" [value]="c" [title]="c.title">{{c.title}}</mat-option>
        </mat-select>

        <mat-select class="mat-dropdown-plain" style="width:200px !important; margin-right: 5px" name="ddServiceArea" [(ngModel)]="selectedServiceArea"
            (selectionChange)="getProcessAreaForServiceArea()" placeholder="Filter By Service Tower" required>
            <mat-option *ngFor="let c of ServiceAreaList" [value]="c" [title]="c.title">{{c.title}}</mat-option>
        </mat-select>
        <button style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary" (click)="clear()">Clear </button>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12">
        <table mat-table [dataSource]="dataSource" class="table-bordered table-responsive-md table-striped text-center" style="width:100%">
          <ng-container matColumnDef="index">
            <th Style="color:black" class="index" mat-header-cell *matHeaderCellDef><strong>S.No</strong> </th>
            <td class="index" mat-cell *matCellDef="let element = index"> {{element + 1}} </td>
          </ng-container>
          <ng-container matColumnDef="procesS_AREA_ID">
            <th Style="color:black" mat-header-cell *matHeaderCellDef><strong>Process Area</strong></th>
            <td mat-cell *matCellDef="let element;let id = index" style="padding:0px !important">
              <!-- <mat-form-field *ngIf="id == iEditIndex" style="width:100%"> -->
              <mat-select *ngIf="id == iEditIndex" style="width:100%" name="ddProcessArea" [(ngModel)]="element.procesS_AREA_ID" placeholder="Select Process Area"
                required>
                <mat-option *ngFor="let c of ProcessAreaList" [value]="c.id" [title]="c.name">{{c.name}}</mat-option>
              </mat-select>
              <!-- </mat-form-field> -->
              <span *ngIf="id != iEditIndex">{{getProcessArea(element.procesS_AREA_ID)}} </span>
            </td>
          </ng-container>
          <ng-container matColumnDef="procesS_NAME">
            <th Style="color:black" mat-header-cell *matHeaderCellDef> <strong>Process Title</strong> </th>
            <td mat-cell *matCellDef="let element;let id = index" style="padding:0px !important">
              <input *ngIf="id == iEditIndex" type="text" id="txtProcessArea[{{id}}]" [(ngModel)]="element.procesS_NAME" style="width:100%;height:30px">
              <span *ngIf="id != iEditIndex" class="index">{{element.title}}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="procesS_DESCRIPTION">
            <th Style="color:black" mat-header-cell *matHeaderCellDef> <strong>Process Description</strong> </th>
            <td mat-cell *matCellDef="let element;let id = index" style="padding:0px !important">
              <textarea *ngIf="id == iEditIndex" [(ngModel)]="element.procesS_DESCRIPTION" style="width:100%;height:30px"></textarea>
              <span *ngIf="id != iEditIndex">{{element.description}}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="edit">
            <th mat-header-cell style="font-family: calibri;" *matHeaderCellDef>
            </th>
            <td mat-cell *matCellDef="let element;let id=index" style="text-align: center;">
              <mat-checkbox [(ngModel)]="element.bSelected"></mat-checkbox>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
    <div>
      <mat-paginator  #paginator [pageSize]="10"  [pageSizeOptions]="[5, 10, 20]" ></mat-paginator>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12" style="text-align: center">
        <button style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary" (click)="SaveRow_onClick()">Save</button>
        <button style="margin-left:5px;margin-right: 5px;margin-top: 2px;margin-bottom: 2px" class="btn btn-primary" >Cancel</button>
      </div>
    </div>
