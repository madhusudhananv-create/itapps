<div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12" style="text-align: left;">
      <div style="display: inline-block; margin-right: 10px; cursor: pointer; text-decoration: none; outline: none"
        [routerLink]="['/newdashboard/cust', _layoutService.selectedCust, false]">
        <img src="assets/images/back_round.png">
      </div>
      <img class="image" style="height:45px;padding:5px" src="assets/images/{{_layoutService.selectedCust}}.png"
        onerror="this.src ='assets/images/CustomerLogo.png'">

</div>

<div class="col-lg-6 col-md-6 col-sm-6"
      style="font-size: 16px; font-weight: 700;font-family: 'Roboto', sans-serif; margin-left: 30px; color: #4e5882">

      <div style="display: inline-block; ">
        Success Goals
      </div>
    </div>

<div class="row" *ngIf="readonlymode" style="min-height:250px;height:100%;margin-right: 30px;">
        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 header" *ngIf="_access.IsAllowed(15, 3, '', '')">
            <a class="link" (click)="Edit_onClick()">
              <i class="fa fa-edit"></i>
            </a>
          </div>
        </div>

        <table style="width: 96%; background:white;margin-left: 25px;margin-bottom: 35px;min-height:250px" >
          <tr><td class="topicarea">
        <div class="row">
          <div class="col-sm-12 col-md-12 col-lg-12">
            <p style="white-space: pre-line;">
              {{clientGoals}}
            </p>
          </div>
        </div>
      </td></tr></table>

      </div>
      <div *ngIf="editmode" style="min-height:250px;height:100%;margin: 15px;" class="row" >
        
          <div class="col-lg-12 col-md-12 col-sm-12 header">
            <a class="link" (click)="GoalsSave_onClick(clientId, txtGoals.value)">
              <i class="fa fa-save"></i>
            </a>&nbsp;&nbsp;
            <a class="link" (click)="Cancel_onClick()">
              <i class="fa fa-times"></i>
            </a>
          </div>
        
        <div>
          <!-- <div class="row">
            <div class="col">
              <h3>Success Goals</h3>
            </div>
          </div> -->
          
          <table style="width: 96%; background:white;margin: 15px;min-height:250px">
            <tr>
              <td class="topicarea">
          
              

              <textarea #txtGoals class="Edit_textarea" matInput placeholder="Success Goals"
                matTextareaAutosize matAutosizeMinRows="2"   style="height:250px"
                matAutosizeMaxRows="5">{{clientGoals}}</textarea>
           
         </td></tr></table>

        </div>
      </div>
