<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12" style="text-align: left;">
    <div style="display: inline-block; margin-right: 10px; cursor: pointer; text-decoration: none; outline: none"
      [routerLink]="['/newdashboard/cust', _layoutService.selectedCust, false]">
      <img src="assets/images/back_round.png">
    </div>
    <img class="image" style="height:45px;padding:5px" src="assets/images/{{_layoutService.selectedCust}}.png"
      onerror="this.src ='assets/images/CustomerLogo.png'">
    <!-- 
    <mat-select placeholder="Select Project" [(ngModel)]="input_projectid" (selectionChange)="onProjectChange()"
      style="margin-left:15px; width:260px;background-color: white;border: solid #d0d0d0 1px;padding: 5px;">
      <mat-option *ngFor="let proj of projNames" [value]="proj.proJ_ID" [title]="proj.proJ_NM">{{proj.proJ_NM}}</mat-option>
    </mat-select> -->

  </div>
  <div class="col-lg-6 col-md-6 col-sm-6"
    style="font-size: 16px; font-weight: 700;font-family: 'Roboto', sans-serif; margin: 15px; color: #4e5882">

    <div style="display: inline-block; ">
      FMEA Project Setup
    </div>
  </div>

</div>


<div style="padding: 5px">
  <div class="row" style="margin-top: 20px; margin-bottom: 10px">
    <div class="col-lg-1 col-md-1 col-sm-1">
      <!-- <div style="display: inline-block; margin-right: 10px; cursor: pointer; text-decoration: none; outline: none" [routerLink]="['/newdashboard/cust', input_customerid, false]">
        <img src="assets/images/back_round.png">
      </div> -->
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <div class="FormField-Mat-Label" style="width: 200px">Project</div>
      <mat-select placeholder="Select Project" [(ngModel)]="fmeafilter.projectid" (ngModelChange)="onProjectChange()"
        style="width:200px;background-color: white;border: solid #d0d0d0 1px;padding: 5px">
        <mat-option *ngFor="let proj of projNames" [value]="proj.proJ_ID" [title]="proj.proJ_NM">
          {{proj.proJ_NM}}
        </mat-option>
      </mat-select>
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <div class="FormField-Mat-Label" style="width: 200px">Service Tower</div>
      <mat-select placeholder="Select Service Tower" [(ngModel)]="fmeafilter.serviceareaId"
        (ngModelChange)="onServiceAreaChange()" style="margin-left:10px; width:200px;background-color: white;
      border: solid #d0d0d0 1px;padding: 5px;">
        <mat-option *ngFor="let sa of serviceAreas" [value]="sa.id" [title]="sa.title">
          {{sa.title}}
        </mat-option>
      </mat-select>
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2">
      <div class="FormField-Mat-Label" style="width: 180px">Service Level</div>
      <mat-select placeholder="Select Service Level" name="ddServiceLevel" [(ngModel)]="fmeafilter.servicelevel" style="margin-left:10px; 
      width:180px;background-color: white;
      border: solid #d0d0d0 1px;padding: 5px;">
        <mat-option *ngFor="let c of ServiceLevelList" [value]="c.id"
          [title]="c.servicE_LEVEL_IDENTIFIER">{{c.servicE_LEVEL_IDENTIFIER}}</mat-option>
      </mat-select>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2">
      <div class="FormField-Mat-Label" style="width: 230px">Process</div>
      <mat-select placeholder="Select Process" [(ngModel)]="fmeafilter.processId" style="margin-left:15px; width:230px;background-color: white;
      border: solid #d0d0d0 1px;padding: 5px;" (selectionChange)="onProcessChange()">
        <mat-option *ngFor="let sa of processes" [value]="sa.procesS_ID" [title]="sa.procesS_TITLE">
          {{sa.procesS_TITLE}}
        </mat-option>
      </mat-select>
    </div>
    <div class="col-lg-3 col-md-3 col-sm-3">
      <div class="FormField-Mat-Label" style="width: 150px">Task</div>
      <mat-select name="ddTask" placeholder="Select Task" [(ngModel)]="fmeafilter.taskId" style="margin-left:10px; width:150px;background-color: white;
      border: solid #d0d0d0 1px;padding: 5px;margin-right: 5px;">
        <mat-option *ngFor="let c of taskList" [value]="c.id" [title]="c.tasK_TITLE">{{c.tasK_TITLE}}</mat-option>
      </mat-select>
      <button class="btn btn-primary" (click)="getApplicableFailures()">Apply</button>
    </div>

  </div>
  <mat-horizontal-stepper #stepper *ngIf="mappings && mappings.length > 0">
    <mat-step>
      <ng-template matStepLabel>Evaluate Applicability of Failures and Controls</ng-template>
      <app-project-specific-failures [projectmapping]="mappings"
        [projectid]="fmeafilter.projectid"></app-project-specific-failures>
    </mat-step>
    <mat-step>
      <ng-template matStepLabel>Assess and Improve</ng-template>
      <app-failure-assessment [approvedData]="_layoutService.approvedMappings"></app-failure-assessment>
    </mat-step>
  </mat-horizontal-stepper>
</div>
