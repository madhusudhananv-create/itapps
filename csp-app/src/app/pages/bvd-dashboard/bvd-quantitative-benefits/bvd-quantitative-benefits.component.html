<div class="container">
  <div class="row" style=" height: 30px !important;">
    <div class="col-lg-4 col-sm-4 col-md-4" style="text-align: left; padding: 5px;height: 30px !important">
      <label style="height: 12px;text-align: left;font-size:14px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;font-weight: 550;margin-left: -5px">Quantitative Benefits</label>
      <hr style="margin-top: auto;width: 25px;height: 1px;background: #4B4EB1 0% 0% no-repeat padding-box;opacity: 1;margin-left: -5px">
    </div>
    <div class="col-lg-4 col-sm-4 col-md-4" style="text-align: center;  height: 30px !important;">
      <label style="top: 270px;margin-left: -25px;height: 12px;text-align: left;font-size:11px;letter-spacing: 0px;color: #333333;
      opacity: 1;font-weight: 300; margin-right: 7px">View By:</label>
      <mat-form-field floatLabel="never" class="no-line" style="width: 40%;margin-top: -15px;">
        <mat-select name="ddlView" class="drpdown" [(value)]="selectedView" style="height: 13px;text-align: left;font-size:11px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">
          <mat-option value="benefits">Benefits</mat-option>
          <mat-option value="ideas">Ideas</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-lg-4 col-sm-4 col-md-4" style="text-align: center; padding-right: 5px; height: 30px !important;" *ngIf="selectedView == 'benefits'">
      <mat-form-field floatLabel="never" class="no-line" style="width: 45%;margin-top: -15px;">
        <mat-select [(ngModel)]="UOM_ID" class="drpdown" (selectionChange)="onUOMChange()" style="height: 13px;width:130px;text-align: left;font-size:11px;letter-spacing: 0px;color: #4C4C47;opacity: 1;">
          <mat-option [value]="uom.id" *ngFor="let uom of UOM_Title">
            {{uom.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div *ngIf="selectedView == 'benefits' && Value.length > 0 && ValueColumn.length > 0">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-sm-6" style="margin-left: -80px;">
        <google-chart #chart1 [type]="type" [data]="pieData" [columnNames]="columnNames" [options]="options" [width]="width" [height]="height">
        </google-chart>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-6" style="margin-left:80px;margin-top: -20px;">
          <!-- Note : Y Axis is Rendering but throwing errors, Issues Will be sorted out in next release. -->
        <google-chart #chart2 [type]="type1" [data]="columnGraphData" [columnNames]="columnNames1" [options]="options1" [width]="width1"
          [height]="height1">
        </google-chart>
      </div>
    </div>
  </div>
  <div *ngIf="selectedView == 'ideas' && !isDataEmpty">
    <div class="row">
      <div class="col-lg-8 col-md-8 col-sm-8" style="margin-left: -50px;">
        <google-chart #chart3 [type]="type2" [data]="stackedData" [columnNames]="columnNames2" [options]="options2" [width]="width2"
          [height]="height2">
        </google-chart>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-4" style="font-size: 14px; display: flex; align-content: center;align-items: center; height: 142px;margin-left: 50px;">
        <table [ngClass]="ideasCount.length >= 4 ? 'collapse1' : 'collapse2'">
          <tr>
            <th style="padding-right: 10px">Idea Type</th>
            <th>Total</th>
          </tr>
          <tbody>
            <tr *ngFor="let row of ideasCount">
              <td style="padding-right: 10px">{{row[0]}}</td>
              <td style="text-align: center">{{row[1]}}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div *ngIf="selectedView == 'ideas' && isDataEmpty" style="text-align: center; height: 120px; line-height: 120px;margin-top: 50px">
    <h5>No Ideas available for the selected period.</h5>
  </div>

  <div style="text-align: center; height: 120px; line-height: 120px;margin-top: 50px" *ngIf="selectedView == 'benefits' && Value.length == 0 && ValueColumn.length == 0">
    <h5>No Benefits available for the selected period.</h5>
  </div>
   <div style="font-size: 11px; color: #94d3f1; text-align: right; margin-top: 5px;">
    <a style="margin-left: auto;cursor: pointer;" (click)="openView()">
      View More >
    </a>
  </div>  
</div>
