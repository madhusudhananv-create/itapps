<div *ngIf="benefitsFilter.CustomerId" class="mainDiv">

  <div class="row" style="margin-bottom: 20px;">
    <div class="col-lg-2 col-md-2 col-sm-2">
      <div *ngIf="_util.IsGAVS()" class="backbuttonlink" [routerLink]="['/newdashboard/custm']" (click)="resetValues()">
        <img src="assets/images/back_round.png">
      </div>
      <img class="image" style="height:45px;padding:5px" src="assets/images/{{benefitsFilter.CustomerId}}.png" onerror="this.src='assets/images/CustomerLogo.png'">
    </div>
    <div class="col-lg-10 col-md-10 col-sm-10" style="text-align:right">
      <div style="padding:0 15px">
        <i class="fa fa-filter link" (click)="showFilter = !showFilter" style="color:steelblue;font-size:20px; margin-right: 10px;cursor: pointer"></i>
        <!-- <button *ngIf="!_util.IsGAVS()" class="btn btn-warning" style="margin: 2px;">
          <a style="margin-right: 7px; text-decoration: none; color: white;" class="link" [routerLink]="['/dashboard']">Link to old CSM Portal</a>
        </button> -->
        <button *ngIf="!_util.IsGAVS() && _util.IsPremier(benefitsFilter.CustomerId)" class="btn btn-warning" style="margin: 2px;">
          <a style="margin-right: 7px;margin-left: 7px; text-decoration: none; color: white;" class="link" [routerLink]="['/layout/timesheetnewhome', benefitsFilter.CustomerId]">Time Sheets</a>
        </button>


        <img *ngIf="progress" class="image" style="height:20px;padding:0px" src="assets/images/loading_spinner.gif">
        <a *ngIf="!progress" (click)="Refresh_Onclick()" style="cursor: pointer">
          <!-- <mat-icon style="vertical-align: middle;color:#e0dbdb">refresh</mat-icon> -->
        </a>
        <a *ngIf="_util.IsPremier(benefitsFilter.CustomerId)" [routerLink]="['/newdashboard/port', benefitsFilter.CustomerId]">
          <img class="image" style="height:40px" src="assets/images/portfolio_view.png">
        </a>
      </div>
    </div>
  </div>
  <div style="padding-left: 20px; padding-right: 20px; margin-bottom: 10px" *ngIf="showFilter">
    <div style="position: relative;background-color: #eff8ff">
      <app-portfolio-project-selector [custId]="benefitsFilter.CustomerId" [allproj]="false" [portinput]="_shared.selectedPortfolios"
        [projinput]="_shared.selectedProjects" (projectsSelected)="getSelectedProjectsList($event)">
      </app-portfolio-project-selector>
    </div>
    <div (click)="showFilter = false" style="position:absolute; right: 40px; top: 90px; text-align: right;cursor: pointer;">
      <mat-icon class="link" (click)="showFilter = false">close</mat-icon>
    </div>
  </div>
  <div class="row" style="margin-top: 5px; margin-bottom: 10px;">
    <label class="col-lg-4 col-md-4 col-sm-4" style="height: 15px;text-align: left;font-size:14px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;font-weight: 550">Business Benefits</label>
    <hr style="margin-left:15px;width: 25px;height: 2px;background: #4B4EB1 0% 0% no-repeat padding-box;opacity: 1;">
    <!-- <div style="font-size: 11px; color: black; text-align: right;margin-top:-40px;margin-right:100px">
        <img src="/assets/images/Group 11651.png" alt="Trend">
      </div>
      <div style="font-size: 11px; color: black; text-align: right;margin-top:-12px;margin-right:70px">
        <img src="/assets/images/Group 11652.png" alt="Settings">
      </div>
      <div style="font-size: 11px; color:black; text-align: right;margin-top:-15px;margin-right:40px">
        <img src="/assets/images/Group 11653.png" alt="Expand">
      </div> -->
      <!-- <div style="font-size: 12px; color: #94d3f1; text-align: right; margin-top: 13px;margin-right: 10px"> -->

        
      <!-- </div> -->
  </div>

  <div class="row" style="font-size: 13px !important;
     text-align: center!important; margin-left: 10px; margin-right: auto;margin-top: -20px">
    <div class="col-lg-1 col-md-1 col-sm-1" style="margin-top:2px;margin-right: 22px;text-align: center;font: normal normal normal 12px/13px Roboto;letter-spacing: 0px;color: #4C4C47;opacity: 1;width: 102px;">
      <mat-form-field style="width: 100%;">
        <mat-label style="font-size: 15px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;">Beneficiary:</mat-label>
        <mat-select [(ngModel)]="benefitsFilter.Beneficiary" class="drpdown" multiple>
          <mat-option [value]="b.value" *ngFor="let b of beneficiary;let i =index">
            {{b.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2" style="margin-left:-33px;opacity: 1;margin-right: -15px; cursor: pointer;"> 
      <mat-form-field style="width: 50%;">
        <mat-label style="font-size: 15px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;">From:</mat-label>
        <input name="dateStart" class="input" [(ngModel)]="startDate" matInput [matDatepicker]="pickerStartDate">
        <mat-datepicker-toggle class="startdatepickers" matSuffix [for]="pickerStartDate"></mat-datepicker-toggle>
        <mat-datepicker #pickerStartDate></mat-datepicker>
      </mat-form-field>
    </div>
   
    <div class="col-lg-2 col-md-2 col-sm-2" style="opacity: 1;margin-right: -5px;margin-left:-55px">
      <mat-form-field style="width: 50%;font-size: 13px">
        <mat-label style="font-size: 15px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;">To:</mat-label>
        <input name="dateEnd" class="input" [(ngModel)]="endDate" matInput [matDatepicker]="pickerEndDate">
        <mat-datepicker-toggle class="enddatepicker" matSuffix [for]="pickerEndDate"></mat-datepicker-toggle>
        <mat-datepicker #pickerEndDate></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2" style="opacity: 1;margin-right: 10px;margin-left:-68px">
      <mat-form-field style="width: 120px; margin-right: 10px">
        <mat-label style="font-size: 15px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;">Benefit Pillar:</mat-label>
        <mat-select class="drpdown" [(ngModel)]="benefitsFilter.BenefitPillar" multiple>
          <mat-option [value]="pillar.value" *ngFor="let pillar of benefitPillar;">
            {{pillar.title}}
          </mat-option>
        </mat-select>
      </mat-form-field>
     
      <!-- <button class="btn btn-primary" [routerLink]="['listview']"  style="text-align: left;font: normal normal normal 12px/13px Roboto;letter-spacing: 0px;opacity: 1;">View Ideas</button> -->
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2" style="margin-left: -73px;">
      <mat-form-field style="width: 118px; margin-right: 10px">
        <mat-label style="font-size: 15px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;">Status:</mat-label>
        <mat-select multiple #select  [(ngModel)]="status">
          <mat-option [value]="0" #allstatusSelected (click)="toggleSelection()">All</mat-option>
          <mat-option [value]="2" (click)="tosslePerOne()">Submitted</mat-option>
          <mat-option [value]="4" (click)="tosslePerOne()">Approved</mat-option>
          <mat-option [value]="3" (click)="tosslePerOne()">Implemented</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-lg-2 col-md-2 col-sm-2" style="text-align: center;margin-left: -56px;margin-top: -0.4%">
      <!-- <mat-form-field class="no-line" style="width: 150px; margin-right: 10px"> -->
      <mat-label style="margin-right: 45%;font-size: 14px;font-family: Roboto;letter-spacing: 0px;color: #333333;opacity: 1;font-weight: bolder;">Identified By:
      <i class="info fa fa-info-circle " matTooltip="This List will show only the employees who have identified & updated ideas / improvements under the selected account / project in the CSM Platform.">
      </i> </mat-label>
      <mat-form-field style="margin-right: 10px;margin-top: -15px;width:90%">
        <mat-select #identifiedSelect class="drpdown" [(ngModel)]="benefitsFilter.IdentifiedBy" (ngModelChange)="identifiedBy_OnChange($event)" (openedChange)="openedChange($event)" multiple>
          <mat-form-field class="filter-identified">
            <input matInput (keydown)="$event.stopPropagation()" (keyup)="applyFilter($event.target.value)"
            [(ngModel)]="searchValue" placeholder="Choose Identified By" style="width:100px !important;text-indent: 10px;">
           <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
            <mat-option [value]="'-1'" (click)="toggleIdentifiedAll()" #allSelected *ngIf="employees?.length > 0">All</mat-option>
            <mat-option *ngFor="let emp of employees" (click)="toggleIdentifiedby()" [value]="emp.emP_ID.toString()" >{{emp.frsT_NM}}</mat-option>
        </mat-select>
      </mat-form-field>
      
      <!-- </mat-form-field> -->
    </div> 
   <div class="col-lg-1 col-md-1 col-sm-1" style="text-align: center;margin-top: 0px;right: 30px;">
    <button class="btn btn-primary" (click)="getFilterValues()" style="text-align: left;font-size: 14px;font-family: Roboto;letter-spacing: 0px;opacity: 1;">Apply</button>
   </div>
   <div class="col-lg-1 col-md-1 col-sm-1" style="right: 10px;"> 
    <button class="btn btn-primary" style="float:left; font-size: 14px;font-family:Roboto;letter-spacing: 0px;opacity: 1" [routerLink]="['listview']">
      View Ideas
    </button> 
   </div>
   <div class="col-lg-1 col-md-1 col-sm-1" style="right: 20px;">
     <button class="btn btn-warning" (click)="addNewIdea()" style="float:right;font-size: 14px;font-family:Roboto;letter-spacing: 0px;opacity: 1;">
      <i class="fa fa-plus"></i> Add Idea</button>
   </div>  
  </div>

  <div class="row" style="margin-top: 10px;">

    <div class="col-lg-6 col-md-6 col-sm-6">
      <app-bvd-quantitative-benefits [Value]="Valuechart" [ValueColumn]="ValueColumnChart" [ValueStacked]="ideasStackedDataValue"
        [isDataEmpty]="stackedValueEmpty" [ValueBenefitDetaildata]="ValueDetail" (uom)="UOM_OnChange($event,1)"></app-bvd-quantitative-benefits>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-6" style="margin-left: -10px">
      <app-bvd-qualitative-benefits [ValueBenefitdata]="Value" [ValueBenefitDetaildata]="ValueDetailQualitative"></app-bvd-qualitative-benefits>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-3 col-md-3 col-sm-3">
      <label style="margin-top:20px;margin-left: 20px;height: 15px;text-align: left;font: normal normal bold 13px/15px Roboto;letter-spacing: 0px;color: #4B4EB1;text-transform: uppercase;opacity: 1;">VALUE ADDITIONS</label>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-6 col-md-6 col-sm-6">
      <app-bvd-quantitative-benefits [Value]="ValueAddchart" [ValueColumn]="ValueAddColumnChart" [ValueStacked]="ideasStackedDataValueAdd"
        [isDataEmpty]="stackedValueAddEmpty" [ValueBenefitDetaildata]="ValueAddDetail" (uom)="UOM_OnChange($event,2)"></app-bvd-quantitative-benefits>
    </div>
    <div class="col-lg-6 col-md-6 col-sm-6" style="margin-left: -10px">
      <app-bvd-qualitative-benefits [ValueBenefitdata]="ValueAdd" [ValueBenefitDetaildata]="ValueAddDetailQualitative"></app-bvd-qualitative-benefits>
    </div>
  </div>
  

</div>
