<div class="container">
  <div class="row" style="margin-top:5px">
    <label style="margin-left:-5px;top: 270px;left: 699px;height: 12px;text-align: left;font-size:14px;font-family: Roboto; letter-spacing: 0px;color: #333333;opacity: 1;font-weight: 550">Qualitative Benefits</label>
    <hr style="margin-left:-5px;margin-top:5px;width: 25px;height: 1px;background: #4B4EB1 0% 0% no-repeat padding-box;opacity: 1;">
  </div>
  <div *ngIf="graphData && graphData.length > 0" style="width:100%;max-width:fit-content;height: 130px;overflow-y: auto;overflow-x: hidden;border-radius: 5px;opacity: 1;">
    <table style="border-collapse: separate;border-spacing: 0 0.1em;">
      <tr *ngFor="let benefit of graphData">
        <td style="margin-left: 2px">{{benefit.benefit_Title}}</td>
      </tr>
    </table>
  </div>
  <div style="text-align: center; height: 115px; line-height: 115px;margin-top: 25px" *ngIf="graphData.length == 0">
    <h5>No Benefits available for the selected period.</h5>
  </div>
  <div *ngIf="!graphData" style="text-align: center; height: 100px; line-height: 100px;">
    <i class="fa fa-circle-o-notch fa-spin" style="margin-right: 10px; font-size: 25px;"></i>Loading...
  </div>
   <div style="font-size: 11px; color: #94d3f1; text-align: right; margin-top: 13px;">
     <a style="margin-left: auto;cursor: pointer;" (click)="openDialog()">
      View More >
    </a>
    
  </div> 
</div>
