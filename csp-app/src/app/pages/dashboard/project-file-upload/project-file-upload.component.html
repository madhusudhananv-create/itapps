<mat-card style="height: 100%; width: 100%; overflow: auto;line-height: 0.7;">

  <div class="col-lg-6 col-md-6 col-sm-6"
    style="font-size: 16px; font-weight: 700;font-family: 'Roboto', sans-serif; margin: 15px; color: #4e5882">
    <div style="display: inline-block; ">
      Knowledge Management
    </div>
  </div>

  <div *ngIf="readMode" style="right: 5%;position: absolute;">
    <a class="link" (click)="Cancel_onClick()" style="cursor: pointer;color: gray;">
      <i class="fa fa-times"></i>
    </a>
  </div>

  <div *ngIf="readMode && parentFolder.id == 0" style="right: 8%;position: absolute;margin-top: 3.5%;">
    <button (click)="AddFolderOnClick()" class="btn btn-primary">Create Folder</button>
  </div>
  <div *ngIf="readMode&& parentFolder.id > 0" style="right: 14%;position: absolute;margin-top: 3.5%;">
    <button (click)="AddSubFolderOnClick()" class="btn btn-primary">Add Folder</button>
  </div>
  <div *ngIf="readMode&& parentFolder.id > 0" style="right: 2%;position: absolute;margin-top: 3.5%;">
    <button (click)="openUploadOption()" class="btn btn-primary">Add File</button>
  </div>

  <br><br><br>
  <div class="row">
    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
  </div>

  <div *ngIf="readMode" style="position: relative;left: 5%;width: 65%;">
    <input type="text" style="width: 70%;" placeholder="Search">&nbsp;&nbsp;
    <label style="display: inline-block;max-width: 100%;margin-bottom: 5px;font-size: small;color:grey">
      <input type="radio" name="searchType" value="Files">&nbsp;Files</label>&nbsp;&nbsp;
    <label style="display: inline-block;max-width: 100%;margin-bottom: 5px;font-size: small;color:grey">
      <input type="radio" name="searchType" value="File Content">&nbsp;File Content</label>
  </div>

  <div *ngIf="editMode" style="position: absolute;left: 15%;margin-top: 5%;">
    <div *ngIf="!UploadFile && !renameFile" class="row">
      <mat-form-field style="float: left;">
        <input matInput name="type" [(ngModel)]="folderName" placeholder="Folder Name" required>
      </mat-form-field>
    </div>
    <div *ngIf="!UploadFile && renameFile" class="row">
      <mat-form-field style="float: left;">
        <input matInput name="type" [(ngModel)]="fileName" placeholder="File Name" required>
      </mat-form-field>
    </div>
    <br>

    <div *ngIf="UploadFile">
      <input type="file" #fileUpload class="form-control" name="single" ng2FileSelect style="width:calc(100% - 20px)"
        required>
      <br> <br>
      <button class="btn btn-success" value="Upload" (click)='UploadProjectFile(fileUpload)' [disabled]="isLoading">
        Upload </button> &nbsp; &nbsp;
      <button (click)="refreshFileData()" [disabled]="isLoading" class="btn btn-grey">Back</button>
    </div>

    <button *ngIf="!enableSubFolder && !UploadFile && !renameMode && !renameFile" (click)="createMainFolder(folderName)"
      class="btn btn-success" [disabled]="isLoading">Save</button>
    <button *ngIf="enableSubFolder && !UploadFile && !renameMode && !renameFile" (click)="createSubFolder(folderName)"
      class="btn btn-success" [disabled]="isLoading">Save</button>
    <button *ngIf="renameMode && !enableSubFolder && !UploadFile && !renameFile" (click)="renameFolder(folderName)"
      class="btn btn-success" [disabled]="isLoading">Save</button>
    <button *ngIf="!enableSubFolder && !UploadFile && !renameMode && renameFile" (click)="renameFiles(fileName)"
      class="btn btn-success" [disabled]="isLoading">Save</button>

    &nbsp; &nbsp;
    <button *ngIf="!UploadFile" [disabled]="isLoading" (click)="refreshFileData()" class="btn btn-grey">Back</button>

  </div>

  <div *ngIf="readMode && parentFolder.id > 0" style="position: absolute; left: 7%; margin-top: 2%;">
    <a class="iconbutton1" style="cursor: pointer;" [ngClass]="{'selected-folder': folderId === parentFolder.id}"
      (click)="setFolderId(parentFolder.id)">
      <i class="fa fa-folder" style="font-size: 16px;"></i>
      &nbsp;
      {{ parentFolder.folderName }}
      &nbsp;
    </a>
    &nbsp;
    <a class="link" style="cursor: pointer;" (click)="renameFolderOnClick(parentFolder.folderName, parentFolder.id)">
      <i class="fa fa-edit" style="font-size: 13px;"></i>
    </a>
    &nbsp;
    <a class="link" style="cursor: pointer;" (click)="deleteFolder(parentFolder.id)">
      <i class="fa fa-trash" style="font-size: 13px;"></i>
    </a>
    <br>
    <br>
    <div *ngIf="readMode && parentFolder.folderList.length > 0"
      style="position: absolute; left: 15%;width: max-content;">
      <div>
        <div *ngFor="let subFolder of parentFolder.folderList">
          <a class="link" style="cursor: pointer;" (click)="toggleFolderView(subFolder)">
            <i class="fa" [ngClass]="{'fa-plus': !subFolder.showFiles, 'fa-minus': subFolder.showFiles}"
              style="font-size: 13px;"></i>
          </a>
          <a class="iconbutton1" style="cursor: pointer; font-size: 13px;"
            [ngClass]="{'selected-folder': folderId === subFolder.id}" (click)="setFolderId(subFolder.id)">
            <i class="fa fa-folder" style="font-size: 13px;"></i>
            &nbsp;
            {{ subFolder.folderName }}
          </a>
          &nbsp;
          <a class="link" style="cursor: pointer;" (click)="renameFolderOnClick(subFolder.folderName, subFolder.id)">
            <i class="fa fa-edit" style="font-size: 13px;"></i>
          </a>
          &nbsp;
          <a class="link" style="cursor: pointer;" (click)="deleteFolder(subFolder.id)">
            <i class="fa fa-trash" style="font-size: 13px;"></i>
          </a>
          <br><br>

          <div *ngIf="subFolder.showFiles && subFolder.folderList.length > 0" style="position: relative;left: 10%;">
            <div *ngFor="let c of subFolder.folderList">
              <div class="nested-folder-item">
                <a class="link" style="cursor: pointer;" (click)="toggleFolderView(c)">
                  <i class="fa" [ngClass]="{'fa-plus': !c.showFiles, 'fa-minus': c.showFiles}"
                    style="font-size: 13px;"></i>
                </a>
                <a class="iconbutton1" style="cursor: pointer; font-size: 13px;"
                  [ngClass]="{'selected-folder': folderId === c.id}" (click)="setFolderId(c.id)">
                  <i class="fa fa-folder" style="font-size: 13px;"></i>
                  &nbsp;
                  {{ c.folderName }}
                </a>
                &nbsp;
                <a class="link" style="cursor: pointer;" (click)="renameFolderOnClick(c.folderName, c.id)">
                  <i class="fa fa-edit" style="font-size: 13px;"></i>
                </a>
                &nbsp;
                <a class="link" style="cursor: pointer;" (click)="deleteFolder(c.id)">
                  <i class="fa fa-trash" style="font-size: 13px;"></i>
                </a>
              </div>
              <br>
              <div *ngIf="c.showFiles" style="position: relative;left: 10%;">
                <div *ngFor="let cf of c.fileList">
                  <a class="iconbutton1" style="cursor: pointer;font-size: 12px;"
                    (click)="exportFile(cf.fileName,cf.filePath,cf.fileType ,cf.fileExtension)">
                    <i [class]='getIcon(cf.fileExtension)'></i>
                    &nbsp;
                    {{ cf.fileName }} ({{cf.createD_DATE | date : 'dd-MMM-yyyy'}})
                  </a>
                  &nbsp;
                  <a class="link" style="cursor: pointer;" (click)="renameOnClick(cf.fileName, cf.id)">
                    <i class="fa fa-edit" style="font-size: 13px;"></i>
                  </a>
                  &nbsp;
                  <a class="link" style="cursor: pointer;" (click)="deleteFile(cf.id)">
                    <i class="fa fa-trash" style="font-size: 13px;"></i>
                  </a>
                  <br><br>
                </div>
                <br>
              </div>
            </div>
          </div>

          <div *ngIf="subFolder.showFiles" style="position: relative;left: 10%;">
            <div *ngFor="let b of subFolder.fileList">
              <a class="iconbutton1" style="cursor: pointer;font-size: 12px;"
                (click)="exportFile(b.fileName,b.filePath,b.fileType ,b.fileExtension)">
                <i [class]='getIcon(b.fileExtension)'></i>
                &nbsp;
                {{ b.fileName }} ({{b.createD_DATE | date : 'dd-MMM-yyyy'}})
              </a>
              &nbsp;
              <a class="link" style="cursor: pointer;" (click)="renameOnClick(b.fileName, b.id)">
                <i class="fa fa-edit" style="font-size: 13px;"></i>
              </a>
              &nbsp;
              <a class="link" style="cursor: pointer;" (click)="deleteFile(b.id)">
                <i class="fa fa-trash" style="font-size: 13px;"></i>
              </a>
              <br><br>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</mat-card>
