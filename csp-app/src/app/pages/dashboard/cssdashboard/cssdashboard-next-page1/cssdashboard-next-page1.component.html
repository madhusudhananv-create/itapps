<!-- <app-cssdashboard-filter [allCust] = "allCust" [custId]="customerId" (getCssInputEmitter) = "receivedCssInput($event)"></app-cssdashboard-filter> -->

<div class="row"> 
  <div style="float: left;width: 97%;margin-left: 1%;height:auto">
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>
  <div class="col-sm-4" style="float: left;height: 500px">
    <highcharts-chart *ngIf="trendChartDataNPSInPercentage != undefined" [Highcharts]="Highcharts"
      [options]="trendChartDataNPSInPercentage"
      style="display: block;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">
    </highcharts-chart>
    <div
      style="display: block;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);height:400px;text-align: center;"
      *ngIf="trendChartDataNPSInPercentage == undefined">
      <div style='font-family: Lucida Grande, "Lucida Sans Unicode", Arial, Helvetica, sans-serif;      font-size: 12px;'>Response Category ( % )</div>
      <i style="font-size: 70px;margin-top: 90px;opacity: 0.6;" class="material-icons md-inactive">warning</i>
      <div style="font-family: calibri;font-weight: normal;font-size: 18px">No Data found for the Period </div>
    </div>
  </div>

  <div class="col-sm-4" style="float: left;height: 500px">
    <highcharts-chart *ngIf="surveyData != undefined" [Highcharts]="Highcharts" [options]="surveyData"
      style="display: block;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">
    </highcharts-chart>
    <div
      style="display: block;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);height:400px;text-align: center;"
      *ngIf="surveyData == undefined ">
      <div style='font-family: Lucida Grande, "Lucida Sans Unicode", Arial, Helvetica, sans-serif; font-size: 12px'>Customer Success Distribution</div>
      <i style="font-size: 70px;margin-top: 90px;opacity: 0.6;" class="material-icons md-inactive">warning</i>
      <div style="font-family: calibri;font-weight: normal;font-size: 18px">No Data found for the Period </div>
    </div>
  </div>
</div>
