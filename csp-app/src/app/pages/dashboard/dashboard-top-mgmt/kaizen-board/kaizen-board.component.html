<div id="ideas">
  <div style="font-size: 14px; margin-bottom: 2px;">Ideas, Innovations and improvements</div>
  <google-chart #chart1 style="float:left;margin-bottom: 9px;" [type]="type1" [data]="data1" [columnNames]="columnNames1" [options]="options1"
    [width]="width1" [height]="height1">
  </google-chart>
  <div id="ideasData" style="float: left;margin-left:40px; ">
    <table style="height: 130px; width: 120px; border-collapse: collapse;">
      <tr style="border-bottom: 0.2px solid gray; padding: 5px;">
        <td style="font-size: 15px;">Ideas</td>
        <td class="issuesSplitNo" style="font-size: 22px;">{{ideasCount}}</td>
      </tr>
      <tr style="border-bottom: 0.2px solid gray; padding: 5px;">
        <td style="font-size: 13px;padding-left:5px">Automation</td>
        <td class="issuesSplitNo" style="font-size: 18px;">{{automationCount}}</td>
      </tr>
      <tr style="border-bottom: 0.2px solid gray;padding: 5px;">
        <td style="font-size: 13px;padding-left:5px">Innovations</td>
        <td class="issuesSplitNo" style="font-size: 18px;">{{innovationCount}}</td>
      </tr>
      <tr style="padding: 5px;">
        <td style="font-size: 13px;padding-left:5px;">Improvements</td>
        <td class="issuesSplitNo" style="font-size: 18px;">{{improvementsCount}}</td>
      </tr>
    </table>
  </div>
  <div style=" margin-top: 140px; height: 70px;">
    <div id="businessProcess">
      <div style="height: 20px; margin-left: 7px;font-size: 12px;  padding-top: 0px;color:   #8b8b8b">Internal Business Process</div>
      <div style="font-size: 10px; margin-left: 7px;margin-bottom: 5px;color: #999999">Efforts saved per year (In person hours)</div>
      <div style="text-align: center; font-size: 17px;color:#535d85">{{hoursSaved1}}</div>
    </div>
    <div id="savings" style="float: left; margin-left: 230px;margin-top: -77px;">
      <div style="font-size: 12px;margin-left: 7px;margin-bottom: 0px; color:   #8b8b8b">Customer</div>
      <div style="font-size: 10px; margin-left: 7px;margin-bottom: 5px;color: #999999">Savings per year</div>
      <div style="text-align: center; font-size: 17px;color:#535d85">{{effortSaved1}}</div>
    </div>
  </div>
  <div style="font-size: 11px; color: #94d3f1; text-align: right; padding-right: 20px ">
    <a style="margin-left: auto; cursor: pointer;" (click)="openIdeasDetails()">
      <u>View Details</u>
    </a>
  </div>
</div>
