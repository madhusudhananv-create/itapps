<div style="margin: 17px">
<div class="row" style="margin-bottom: 10px;">
    <div class="col-lg-12 col-md-12 col-sm-12" style="text-align:right; cursor: pointer;" (click)="closePopup()" >
    <i style="font-size:24px; margin-right: 10px;" class="fa">&#xf00d;</i>
  </div>
</div>
<div *ngIf="lineGraphData !=null">
<div class="row"  *ngIf="lineGraphData.hasOwnProperty('series') && lineGraphData['series'].length > 0">
  <highcharts-chart style="width: 80%;display: block; margin-left: auto; margin-right: auto;" [Highcharts]="Highcharts" [options]="lineGraphData">
  </highcharts-chart>
</div>
<div class="row" *ngIf="lineGraphData.hasOwnProperty('series') && lineGraphData['series'].length == 0" style="height: 400px; width: 800px; line-height: 200px; text-align: center;">
    <b> No Achievement Trend available for this Time Range </b>
</div>
</div>
<div class ="row" *ngIf="!lineGraphData" style="height: 400px; width: 800px; line-height: 200px; text-align: center;">
  <i class="fa fa-circle-o-notch fa-spin" style="margin-right: 10px; font-size: 25px;"></i>Loading...
</div>
</div>
