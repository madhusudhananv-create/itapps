  <div class="row">
    <div class="separateCard" style="float:left;width:48%;margin-left: 1%;">
      <div>
        <div style="font-size: 14px;text-align: left">Assessment Status - ({{month}} - {{year}}) </div>
        <!-- <div style="font-size: 10px;color: dark gray">(Current Month)</div> -->
      </div>
      <div *ngIf="isAuditStatusEmpty" style="height:200px;margin-top:10%;font-size: 12px;color:black">
        <span style="display: block;padding-top: 25px;padding-left: 10px; text-align: center">
          No Assessment Planned for this month
        </span>
      </div>
      <div *ngIf="!isAuditStatusEmpty" style="height: 264px; width: 350px;">
        <google-chart #chartAudit [type]="typeaudit" [data]="auditdata" [columnNames]="columaudit"
          [options]="optionaudit" [width]="widthaudit" [height]="heightaudit">
        </google-chart>
      </div>
      <div style="font-size: 9px; color: #94d3f1; text-align: right; ">
        <a style="cursor: pointer; text-decoration: none" [routerLink]="['/layout/assessment', customerId]">
          <u>View Details</u>
        </a>
      </div>
    </div>
    <div class="separateCard" style="float:right;width:48%;margin-right: 2%;">
              <div>
                <span style="font-size: 14px;text-align: left">CAP Stages</span>
                <span style="text-align: right"></span>
              </div>
              <div *ngIf="isFindingsByStageEmpty" style="height: 213px;margin-top:10%;font-size: 12px;color:black">
                <span style="display: block;padding-top: 25px;padding-left: 10px; text-align: center">
                  No Open Findings
                </span>
              </div>
              <div *ngIf="!isFindingsByStageEmpty" style="height: 264px; width: 350px;">
                <google-chart #chartfinding [type]="typefindingBystage" [data]="findingdatastage"
                  [columnNames]="columfindingstage" [options]="optionfindingstage" [width]="widthfindingstage"
                  [height]="heightfindingstage">
                </google-chart>
              </div>
              <div style="font-size: 9px; color: #94d3f1; text-align: right;" *ngIf="!isFindingsByStageEmpty">
                <a style="cursor: pointer; text-decoration: none" [routerLink]="['/layout/qasummary', customerId]">
                  <u>View Details</u>
                </a>
              </div>
            </div>

  </div>
  <div class="row">
    <!-- Findings by Type-->
    <div class="separateCard" style="float:left;width:48%;margin-left: 1%;">
      <div>
        <span style="font-size: 14px;text-align: left">Findings by Type</span>
        <span style="text-align: right"></span>
      </div>
      <div *ngIf="isFindingsByTypeEmpty" style="margin-top:10%;height:200px;font-size: 12px;color:black">
        <span style="display: block;padding-top: 25px;padding-left: 10px; text-align: center">
          No Open Findings
        </span>
      </div>
      <div style="height: 264px;" *ngIf="!isFindingsByTypeEmpty">
        <google-chart #chartfinding [type]="typefindingBytype" [data]="findingdatatype" [columnNames]="columfinding"
          [options]="optionfinding" [width]="widthfinding" [height]="heightfinding">
        </google-chart>
      </div>
      <div style="font-size: 9px; color: #94d3f1; text-align: right; ">
        <a style="cursor: pointer; text-decoration: none" [routerLink]="['/layout/qasummary', customerId]">
          <u>View Details</u>
        </a>
      </div>
    </div>
    <div class="separateCard" style="float:right;width:48%;margin-right: 2%;">
      <div>
        <span style="font-size: 14px;text-align: left">Findings by Age</span>
        <span style="text-align: right"></span>
      </div>
      <div *ngIf="isFindingsByTimeEmpty" style="margin-top:10%;height:200px;font-size: 12px;color:black">
        <span style="display: block;padding-top: 25px;padding-left: 10px; text-align: center">
          No Open Findings
        </span>
      </div>
      <div style="height: 264px;" *ngIf="!isFindingsByTimeEmpty">
        <google-chart #chartfinding [type]="typefindingBytime" [data]="findingdatatime" [columnNames]="columfindingtime"
          [options]="optionfindingtime" [width]="widthfindingtime" [height]="heightfindingtime">
        </google-chart>
      </div>
      <div style="font-size: 9px; color: #94d3f1; text-align: right; ">
        <a style="cursor: pointer; text-decoration: none" [routerLink]="['/layout/qasummary', customerId]" (click)="setValue()">
          <u>View Details</u>
        </a>
      </div>
    </div>
  </div>
