<button mat-icon-button [color]="color" *ngFor="let ratingId of ratingArr;index as i" 
[id]="'star_'+i" (click)="onClick(i+1)" [matTooltip]="tooltips[i]" matTooltipPosition="above"[disabled]="disabled"
[ngClass]="{'disabled-button': disabled}">
  <mat-icon>
    {{showIcon(i)}}
  </mat-icon>
</button>
<mat-error *ngIf="starCount == null || starCount == 0">
 Rating is <strong>required</strong> and cannot be zero.
</mat-error>
