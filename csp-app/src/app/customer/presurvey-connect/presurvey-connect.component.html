<div style="overflow-x: hidden;">

  <div class="row"
    style="padding: 25px 40px 15px 40px; border-bottom: 1px solid #ddd; margin-bottom: 15px; margin-left: 0; margin-right: 0;">
    <div class="col-md-11" style="padding-left: 0;">
      <h4 style="margin: 0; color: #4e5882; font-weight: 700;">PCSAT Presurvey Connect</h4>
      <div class="row">
        <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
      </div>
    </div>
    <div class="col-md-1" style="text-align: right; padding-right: 0;">
      <i class="fa fa-times" style="cursor: pointer; font-size: 18px; color: #666;" (click)="closePopup()"
        title="Close">
      </i>
    </div>
  </div>

  <form style="background: white; padding-left: 40px; padding-bottom: 10px; padding-right: 40px;"
    #presurveyconnectForm="ngForm" (ngSubmit)="SubmitForm(presurveyconnectForm.valid)">

    <div class="row">
      <mat-form-field style="width: 50%;">
        <mat-select name="ddStatus" [disabled]="isDisabledData" 
         [(ngModel)]="presurveyformData.status" placeholder="Status" required>
          <mat-option value="To Be Planned">To Be Planned</mat-option>
          <mat-option value="Planned">Planned</mat-option>
          <mat-option value="Completed">Completed</mat-option>
        </mat-select>
        <mat-error>Status is required</mat-error>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field style="width: 50%;">
        <input matInput name="dtPlannedDate" [disabled]="isDisabledData" [(ngModel)]="presurveyformData.planneD_DATE"
          [matDatepicker]="picker2" placeholder="Planned Date" [required]="presurveyformData.status === 'Planned'">
        <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
        <mat-error *ngIf="presurveyformData.status === 'Planned'">Planned Date is required for Planned
          status</mat-error>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field style="width: 50%;">
        <input [max]="_util.Today()" matInput name="dtActualDate" [disabled]="isDisabledData"
          [(ngModel)]="presurveyformData.actuaL_DATE" [matDatepicker]="picker1" placeholder="Actual Date"
          [required]="presurveyformData.status === 'Completed'">
        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
        <mat-error *ngIf="presurveyformData.status === 'Completed'">Actual Date is required for Completed
          status</mat-error>
      </mat-form-field>
    </div>


    <div class="row">
      <mat-form-field style="width: 80%;">
        <textarea name="txtRemarks" [(ngModel)]="presurveyformData.remarks" maxlength="2000" matInput
          placeholder="Remarks" [disabled]="isDisabledData"></textarea>
      </mat-form-field>
    </div>

    <div class="row" style="margin-top: 15px;">
      <button type="submit" class="btn btn-primary-confirm" [disabled]="isDisabledData">Save</button>
      <button type="button" style="margin-left: 10px;" class="btn btn-warning-confirm" (click)="closePopup()">Cancel</button>
    </div>
  </form>

</div>
