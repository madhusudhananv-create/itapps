<div *ngIf="readonlymode">
    <div class="row tabheader">
        <div class="col-lg-10 col-md-10 col-sm-10">
        </div>
        <div class="col-lg-2 col-md-2 col-sm-2 header" *ngIf="_access.IsAllowed(1, 3, '', input_projectid)">
            <a class="link" style="font-size: 20px" (click)="Edit_onClick()">
                <i class="fa fa-edit"></i>
            </a>
        </div>
    </div>
    <mat-accordion>
        <mat-expansion-panel style="white-space:pre-line;margin-bottom: 5px">
            <mat-expansion-panel-header style="background-color: rgb(255, 255, 255);">
                <h3 style="color: #3c3838;font-size: 18px;line-height: 35px;font-weight: 700;font-family: calibri;">
                    Project Description
                </h3>
            </mat-expansion-panel-header>
            <!-- <div style="font-family: calibri;margin-top: -60px;"> -->
                    <div style="font-family: calibri;">
                    {{input.description}}
            </div>    
        </mat-expansion-panel>
        <mat-expansion-panel style="white-space:pre-line;margin-bottom: 5px">
            <mat-expansion-panel-header style="background-color: rgb(255, 255, 255);">
                <h3 style="color: #3c3838;font-size: 18px;line-height: 35px;font-weight: 700;font-family: calibri;">
                    Scope
                </h3>
            </mat-expansion-panel-header>
            <div style="font-family: calibri">
                    {{input.scope}}
            </div>  
        </mat-expansion-panel>
        <mat-expansion-panel style="white-space:pre-line;margin-bottom: 5px">
            <mat-expansion-panel-header style="font-family: calibri;background-color: rgb(255, 255, 255);">
                <h3 style="color: #3c3838;font-size: 18px;line-height: 35px;font-weight: 700;font-family: calibri;">
                    Technology
                </h3>
            </mat-expansion-panel-header>
            <div style="font-family: calibri;">
                    {{input.technologY_USED}}
            </div>    
        </mat-expansion-panel>
    </mat-accordion>
    <!-- <div class="row">
        <h3>Project Description</h3>
        <p style="white-space:pre-wrap;">{{input.description}}</p>
    </div>
    <div class="row">
        <h3>Scope</h3>
        <p style="white-space:pre-wrap;">{{input.scope}}</p>
    </div>
    <div class="row">
        <h3>Technology</h3>
        <p style="white-space:pre-wrap;">{{input.technologY_USED}}</p>
    </div> -->
</div>
<div *ngIf="editmode">
    <form #rvform="ngForm" (ngSubmit)="SubmitForm(rvform)">
        <div class="row tabheader">
            <div class="col-lg-2 col-md-2 col-sm-2">
                <mat-form-field style="width:125px">
                    <mat-select ngModel name="ragSelected" #ragSelected placeholder="RAG" [(ngModel)]="input.rag" required>
                        <mat-option value="green" style="color:green">Green</mat-option>
                        <mat-option value="orange" style="color:orange">Amber</mat-option>
                        <mat-option value="red" style="color:red">Red</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-lg-8 col-md-8 col-sm-8">
            </div>
            <div class="col-lg-2 col-md-2 col-sm-2 header">
                <!-- <a class="link" (click)="Save_onClick(ragSelected.value, txtdescription.value, txttechnology.value, txtscope.value)">  -->
                <button class= "link_button" type="submit">
                    <i class="fa fa-save"></i>
                </button>&nbsp;&nbsp;
                <a class="link" (click)="Cancel_onClick()">
                    <i class="fa fa-times"></i>
                </a>
            </div>
        </div>
        <div>
            <div class="row">
                <mat-form-field style="width:calc(100% - 20px)">
                    <textarea ngModel name="txtdescription" #txtdescription matInput placeholder="Project Description" [(ngModel)]="input.description"
                        required matTextareaAutosize matAutosizeMinRows="2"></textarea>
                </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field style="width:calc(100% - 20px)">
                    <textarea ngModel name="txtscope" #txtscope matInput placeholder="Scope" [(ngModel)]="input.scope" required></textarea>
                </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field style="width:calc(100% - 20px)">
                    <textarea ngModel name="txttechnology" #txttechnology matInput placeholder="Technology" [(ngModel)]="input.technologY_USED"
                        required></textarea>
                </mat-form-field>
            </div>
        </div>
    </form>
</div>
