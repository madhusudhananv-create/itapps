<!-- <app-matspinner [Hidden]="false"></app-matspinner> -->
<div class="mainlogin">
  <img id="bg" src="assets/images/BrandElement_desktop_v1.jpg" style="width:100vw">
  <div class="layout">
    <form #setpasswordform="ngForm" (ngSubmit)="SubmitForm(setpasswordform.valid)" style="align-self: center">
      <div style="text-align:center;font-size:25px;padding:15px 0 15px">Set password</div>
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fa fa-user-o fa-fw"></i>
          </span>
          <input type="text" [(ngModel)]="email" #username id="username" required="required" placeholder="Emailid" name="txtUsername" class="form-control input-md LoginTextBox" readonly
            style="Width:250px;Height:40px">
        </div>
      </div>
      <!-- <div class="row" style="padding:15px">
          Please enter new password.
        </div> -->
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fa fa-user-o fa-fw"></i>
          </span>
          <input type="password" [(ngModel)]="password1" placeholder="password" name="txtpassword1" class="form-control input-md LoginTextBox"
            style="Width:250px;Height:40px" [disabled]="password_disable" required>
        </div>
      </div>
      <div class="row" style="padding:15px">
          <div class="input-group">
            <span class="input-group-addon">
              <i class="fa fa-user-o fa-fw"></i>
            </span>
            <input type="password" [(ngModel)]="password2" placeholder="re-enter password" name="txtpassword2" class="form-control input-md LoginTextBox"
              style="Width:250px;Height:40px" [disabled]="password_disable" required>
          </div>
        </div>
      <div style="text-align: center">
        <button type="submit" ID="btnLogin" Text="Login" class="btn btn-success">Submit</button>
        <a type="button" class="btn btn-success" [routerLink]="['/login']">Cancel</a>
      </div>
      <!-- <div class="row">
        <p style="color:red;font-size:smaller">{{errMessage}}</p>
      </div> -->
    </form>
    <div class="row" style="margin-top:25px">
      <a class="link" [routerLink]="['/login']">Login page</a>
    </div>
  </div>
</div>
