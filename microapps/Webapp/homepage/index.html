<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Apps Portal - Homepage</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d1526 0%, #1a2642 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 30px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }
    
    .error {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 id="statusTitle">Authenticating...</h2>
    <p id="statusMessage">Please wait while we verify your credentials...</p>
    <div id="errorContainer"></div>
  </div>

  <!-- Load environment configuration -->
  <script src="/env-config.js"></script>
  
  <!-- Load access control configuration -->
  <script src="/sales/access-control-config.js"></script>
  
  <script>
    /**
     * IT Apps Homepage - Authentication Gateway + OAuth Callback Handler
     * 
     * This page serves dual purpose:
     * 1. OAuth callback handler (receives code from Azure AD)
     * 2. Authentication gateway (checks access and redirects)
     * 
     * This page acts as the main entry point and authentication gateway.
     * It checks if the user is authenticated and has access to the requested resource.
     * 
     * Flow:
     * 1. Check if user is authenticated (localStorage has token)
     * 2. Check if user has access permission (access-control-config.js)
     * 3. Redirect to requested page or default to pipeline analytics
     * 4. If not authenticated, redirect to SSO login
     */
    
    const STATUS_TITLE = document.getElementById('statusTitle');
    const STATUS_MESSAGE = document.getElementById('statusMessage');
    const ERROR_CONTAINER = document.getElementById('errorContainer');
    
    /**
     * Show error message
     */
    function showError(message, autoRedirect = true) {
      // Convert newlines to <br> for HTML display
      const htmlMessage = message.replace(/\n/g, '<br>');
      
      ERROR_CONTAINER.innerHTML = `
        <div class="error">
          <h2>Authentication Error</h2>
          <p style="white-space: pre-wrap; text-align: left;">${htmlMessage}</p>
        </div>
      `;
      
      STATUS_TITLE.textContent = 'Authentication Failed';
      STATUS_MESSAGE.textContent = '';
      
      // Only auto-redirect if not a configuration error
      if (autoRedirect && !message.includes('Configuration Error')) {
        setTimeout(() => {
          redirectToLogin();
        }, 5000);
      }
    }
    
    /**
     * Redirect to SSO login page
     */
    function redirectToLogin() {
      const urls = getRedirectUrls();
      window.location.href = urls.login;
    }
    
    /**
     * Check if user is authenticated
     */
    function isAuthenticated() {
      const storageKeys = getStorageKeys();
      const token = localStorage.getItem(storageKeys.tokenKey);
      const empid = localStorage.getItem(storageKeys.empidKey);
      
      return !!(token && empid);
    }
    
    /**
     * Get current user info
     */
    function getCurrentUser() {
      const storageKeys = getStorageKeys();
      return {
        token: localStorage.getItem(storageKeys.tokenKey),
        empid: localStorage.getItem(storageKeys.empidKey),
        displayname: localStorage.getItem(storageKeys.displaynameKey),
        logintype: localStorage.getItem(storageKeys.logintypeKey)
      };
    }
    
    /**
     * Check if user has access to Pipeline Analytics or restricted resources
     */
    function checkAccess(userEmail, resourcePath) {
      // Check if access control is enabled
      if (typeof ACCESS_CONTROL_CONFIG === 'undefined') {
        console.warn('[Access Control] Config not loaded');
        return { granted: true, reason: 'Config not available' };
      }
      
      if (!ACCESS_CONTROL_CONFIG.enabled) {
        console.log('[Access Control] Access control disabled');
        return { granted: true, reason: 'Access control disabled' };
      }
      
      // Check if resource requires access control (e.g., pipeline analytics)
      const isRestrictedResource = resourcePath && 
        (resourcePath.includes('pipeline_analytics') || resourcePath.includes('/sales/'));
      
      if (!isRestrictedResource) {
        console.log('[Access Control] Resource not restricted:', resourcePath);
        return { granted: true, reason: 'Resource not restricted' };
      }
      
      // Check if user is in authorized users list
      const authorizedUser = ACCESS_CONTROL_CONFIG.AUTHORIZED_USERS.find(
        user => user.email.toLowerCase() === userEmail.toLowerCase()
      );
      
      if (authorizedUser) {
        console.log('[Access Control] Access GRANTED for', userEmail, '| BU:', authorizedUser.bu);
        return { granted: true, user: authorizedUser };
      }
      
      console.log('[Access Control] Access DENIED for', userEmail);
      return { granted: false, reason: 'User not in authorized list' };
    }
    
    /**
     * Get intended destination from URL or storage
     */
    function getIntendedDestination() {
      // Check URL parameter first
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      
      if (redirect) {
        console.log('[Redirect] Found redirect in URL:', redirect);
        return redirect;
      }
      
      // Check localStorage
      const storageKeys = getStorageKeys();
      const savedUrl = localStorage.getItem(storageKeys.navigateurlKey);
      
      if (savedUrl) {
        console.log('[Redirect] Found redirect in localStorage:', savedUrl);
        localStorage.removeItem(storageKeys.navigateurlKey);
        return savedUrl;
      }
      
      // Default to microapps dashboard
      const urls = getRedirectUrls();
      console.log('[Redirect] No redirect found, using default:', urls.microapps);
      return urls.microapps;
    }
    
    /**
     * Handle OAuth callback from Azure AD (Implicit Flow)
     * Returns true if this is an OAuth callback, false otherwise
     */
    async function handleOAuthCallback() {
      // Check URL fragment for ID token (implicit flow uses #id_token=xxx)
      const hash = window.location.hash;
      
      if (!hash) {
        // Check query params for errors
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');
        
        if (error) {
          console.error('[OAuth] Error:', error, errorDescription);
          showError('Authentication failed: ' + (errorDescription || error), false);
          return true;
        }
        
        return false;
      }

      // Parse fragment parameters
      const fragmentParams = new URLSearchParams(hash.substring(1));
      const idToken = fragmentParams.get('id_token');
      const state = fragmentParams.get('state');
      const error = fragmentParams.get('error');
      const errorDescription = fragmentParams.get('error_description');

      // Check for errors from Azure AD
      if (error) {
        console.error('[OAuth] Error:', error, errorDescription);
        showError('Authentication failed: ' + (errorDescription || error), false);
        return true;
      }

      // If we have an ID token, this is an OAuth callback
      if (idToken) {
        // Validate state parameter (CSRF protection)
        const savedState = sessionStorage.getItem('oauth_state');
        if (state && savedState && state !== savedState) {
          console.error('[OAuth] State mismatch - possible CSRF attack');
          showError('Security validation failed. Please try again.', false);
          return true;
        }

        // Clear OAuth session data
        sessionStorage.removeItem('oauth_state');
        sessionStorage.removeItem('oauth_nonce');

        // Process the ID token
        await processIdToken(idToken);
        return true;
      }

      return false;
    }

    /**
     * Process ID token from implicit flow
     */
    async function processIdToken(idToken) {
      try {
        STATUS_TITLE.textContent = 'Completing Authentication...';
        STATUS_MESSAGE.textContent = 'Processing your credentials...';

        // Decode ID token (basic JWT decode - split by dots, decode middle part)
        const tokenParts = idToken.split('.');
        if (tokenParts.length !== 3) {
          throw new Error('Invalid ID token format');
        }
        
        const payload = JSON.parse(atob(tokenParts[1]));
        
        console.log('[Auth] ID Token payload:', payload);
        
        // Extract user information from ID token
        const empid = payload.preferred_username || payload.email || payload.upn;
        const displayname = payload.name || empid;

        if (!empid) {
          throw new Error('Could not extract user email from ID token');
        }

        // Store authentication data in localStorage
        const storageKeys = getStorageKeys();
        localStorage.setItem(storageKeys.tokenKey, idToken);  // Store ID token
        localStorage.setItem(storageKeys.empidKey, empid);
        localStorage.setItem(storageKeys.displaynameKey, displayname);
        localStorage.setItem(storageKeys.logintypeKey, 'microsoft');
        
        // Preserve redirect parameter if it exists in URL
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');
        if (redirectParam && !localStorage.getItem(storageKeys.navigateurlKey)) {
          console.log('[Auth] Preserving redirect destination:', redirectParam);
          localStorage.setItem(storageKeys.navigateurlKey, redirectParam);
        }

        // Clean URL (remove hash fragment)
        window.history.replaceState({}, document.title, '/homepage');

        // Continue with normal authentication flow (access check + redirect)
        STATUS_TITLE.textContent = 'Authentication Successful';
        STATUS_MESSAGE.textContent = 'Verifying access permissions...';
        
        // Small delay then proceed to access check
        setTimeout(() => {
          authenticate();
        }, 500);

      } catch (error) {
        console.error('[Token Processing] Error:', error);
        showError('Failed to process authentication: ' + error.message, false);
      }
    }

    /**
     * Main authentication flow
     */
    async function authenticate() {
      try {
        // Step 1: Get intended destination FIRST (before checking auth)
        const destination = getIntendedDestination();
        console.log('[Auth] Intended destination:', destination);
        
        // Step 2: Check if authenticated
        if (!isAuthenticated()) {
          STATUS_MESSAGE.textContent = 'No authentication found. Redirecting to login...';

          // Only persist a genuine deep-link destination for after login.
          // Otherwise clear any stale value so it doesn't keep re-surfacing
          // on unrelated login attempts (it would just get re-saved here
          // every time this runs, forever, since getIntendedDestination()
          // only removes it once it's actually consumed).
          const storageKeys = getStorageKeys();
          const urls = getRedirectUrls();
          if (destination !== urls.microapps) {
            localStorage.setItem(storageKeys.navigateurlKey, destination);
            console.log('[Auth] Not authenticated. Saved destination and redirecting to login...');
          } else {
            localStorage.removeItem(storageKeys.navigateurlKey);
            console.log('[Auth] Not authenticated. No deep-link destination; redirecting to login...');
          }

          setTimeout(redirectToLogin, 1500);
          return;
        }
        
        // Step 3: Get current user
        const user = getCurrentUser();
        STATUS_MESSAGE.textContent = `Welcome back, ${user.displayname || user.empid}`;
        console.log('[Auth] User authenticated:', user.empid);
        
        // Step 4: Check access control for restricted resources
        const accessCheck = checkAccess(user.empid, destination);
        
        if (!accessCheck.granted) {
          // Access denied - show error and redirect to microapps
          STATUS_TITLE.textContent = 'Access Denied';
          STATUS_MESSAGE.textContent = '';
          
          ERROR_CONTAINER.innerHTML = `
            <div class="error">
              <h2>Access Denied</h2>
              <p>You do not have permission to access this resource.</p>
              <p style="margin-top: 8px; font-size: 12px;">Reason: ${accessCheck.reason}</p>
              <p style="margin-top: 12px;">Redirecting to dashboard...</p>
            </div>
          `;
          
          console.log('[Auth] Access denied:', user.empid, 'to', destination);
          
          setTimeout(() => {
            const urls = getRedirectUrls();
            window.location.href = urls.microapps;
          }, 3000);
          return;
        }
        
        // Step 5: Access granted - redirect to intended destination
        STATUS_TITLE.textContent = 'Access Granted';
        STATUS_MESSAGE.textContent = 'Redirecting to application...';
        
        console.log('[Auth] Access granted:', user.empid, 'to', destination);
        
        setTimeout(() => {
          window.location.href = destination;
        }, 1000);
        
      } catch (error) {
        console.error('Authentication error:', error);
        showError('An error occurred during authentication. Please try again.');
      }
    }
    
    /**
     * Initialize on page load
     */
    window.addEventListener('DOMContentLoaded', async function() {
      console.log('[Homepage] Page loaded');
      console.log('[Homepage] Current URL:', window.location.href);
      console.log('[Homepage] Hash:', window.location.hash);
      console.log('[Homepage] Search:', window.location.search);
      
      // Check if this is an OAuth callback (handleOAuthCallback returns true if it is)
      const isCallback = await handleOAuthCallback();
      
      console.log('[Homepage] Is OAuth callback?', isCallback);
      
      if (!isCallback) {
        // Normal authentication check
        console.log('[Homepage] Running normal authentication check...');
        setTimeout(authenticate, 500);
      }
    });
  </script>
</body>
</html>
