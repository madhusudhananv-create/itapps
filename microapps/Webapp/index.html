<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Apps Portal - Redirecting...</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d1526 0%, #1a2642 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 30px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }
  </style>
</head>

    <p>Please wait...</p>

<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 id="statusTitle">Authenticating...</h2>
    <p id="statusMessage">Please wait while we verify your credentials...</p>
    <div id="errorContainer"></div>
  </div>

  <!-- Load environment configuration -->
  <script src="/env-config.js"></script>
  
  <!-- Load access control configuration -->
  <script src="/sales/access-control-config.js"></script>
  
  <script>
    /**
     * IT Apps Homepage - Authentication Gateway + OAuth Callback Handler
     * 
     * This page serves dual purpose:
     * 1. OAuth callback handler (receives code from Azure AD)
     * 2. Authentication gateway (checks access and redirects)
     * 
     * This page acts as the main entry point and authentication gateway.
     * It checks if the user is authenticated and has access to the requested resource.
     * 
     * Flow:
     * 1. Check if user is authenticated (localStorage has token)
     * 2. Check if user has access permission (access-control-config.js)
     * 3. Redirect to requested page or default to pipeline analytics
     * 4. If not authenticated, redirect to SSO login
     */
    
    const STATUS_TITLE = document.getElementById('statusTitle');
    const STATUS_MESSAGE = document.getElementById('statusMessage');
    const ERROR_CONTAINER = document.getElementById('errorContainer');
    
    /**
     * Show error message
     */
    function showError(message) {
      ERROR_CONTAINER.innerHTML = `
        <div class="error">
          <h2>Access Denied</h2>
          <p>${message}</p>
        </div>
      `;
      
      STATUS_TITLE.textContent = 'Authentication Failed';
      STATUS_MESSAGE.textContent = '';
      
      setTimeout(() => {
        redirectToLogin();
      }, 3000);
    }
    
    /**
     * Redirect to SSO login page
     */
    function redirectToLogin() {
      const urls = getRedirectUrls();
      window.location.href = urls.login;
    }
    
    /**
     * Check if user is authenticated
     */
    function isAuthenticated() {
      const storageKeys = getStorageKeys();
      const token = localStorage.getItem(storageKeys.tokenKey);
      const empid = localStorage.getItem(storageKeys.empidKey);
      
      return !!(token && empid);
    }
    
    /**
     * Get current user info
     */
    function getCurrentUser() {
      const storageKeys = getStorageKeys();
      return {
        token: localStorage.getItem(storageKeys.tokenKey),
        empid: localStorage.getItem(storageKeys.empidKey),
        displayname: localStorage.getItem(storageKeys.displaynameKey),
        logintype: localStorage.getItem(storageKeys.logintypeKey)
      };
    }
    
    /**
     * Check if user has access to Pipeline Analytics
     */
    function checkAccess(userEmail) {
      // Check if access control is enabled
      if (typeof ACCESS_CONTROL_CONFIG === 'undefined') {
        console.warn('Access control config not loaded');
        return true; // Allow if config not loaded
      }
      
      if (!ACCESS_CONTROL_CONFIG.enabled) {
        return true; // Access control disabled
      }
      
      // Check if user is in authorized users list
      const authorizedUser = ACCESS_CONTROL_CONFIG.authorizedUsers.find(
        user => user.email.toLowerCase() === userEmail.toLowerCase()
      );
      
      return !!authorizedUser;
    }
    
    /**
     * Get intended destination from URL or storage
     */
    function getIntendedDestination() {
      // Check URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      
      if (redirect) {
        return redirect;
      }
      
      // Check localStorage
      const storageKeys = getStorageKeys();
      const savedUrl = localStorage.getItem(storageKeys.navigateurlKey);
      
      if (savedUrl) {
        localStorage.removeItem(storageKeys.navigateurlKey);
        return savedUrl;
      }
      
      // Default to microapps dashboard
      const urls = getRedirectUrls();
      return urls.microapps;
    }
    
    /**
     * Handle OAuth callback from Azure AD
     * Returns true if this is an OAuth callback, false otherwise
     */
    async function handleOAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorDescription = urlParams.get('error_description');

      // Check for errors from Azure AD
      if (error) {
        console.error('OAuth error:', error, errorDescription);
        showError('Authentication failed: ' + (errorDescription || error));
        return true;
      }

      // If we have a code, this is an OAuth callback
      if (code) {
        // Validate state parameter (CSRF protection)
        const savedState = sessionStorage.getItem('oauth_state');
        if (state && savedState && state !== savedState) {
          console.error('State mismatch - possible CSRF attack');
          showError('Security validation failed. Please try again.');
          return true;
        }

        // Clear OAuth session data
        sessionStorage.removeItem('oauth_state');
        sessionStorage.removeItem('oauth_nonce');

        // Exchange code for token
        await exchangeCodeForToken(code);
        return true;
      }

      return false;
    }

    /**
     * Exchange authorization code for access token
     */
    async function exchangeCodeForToken(code) {
      try {
        STATUS_TITLE.textContent = 'Completing Authentication...';
        STATUS_MESSAGE.textContent = 'Exchanging authorization code for access token...';

        const config = getAzureADConfig();
        const apiEndpoints = getApiEndpoints();

        const response = await fetch(apiEndpoints.tokenExchange, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            code: code,
            redirectUri: config.redirectUri,
            clientId: config.clientId,
            tenantId: config.tenantId
          })
        });

        if (!response.ok) {
          throw new Error('Token exchange failed: ' + response.statusText);
        }

        // Extract user information from response headers
        const empid = response.headers.get('empid');
        const displayname = response.headers.get('displayname');
        const token = response.headers.get('token');
        const logintype = response.headers.get('logintype') || 'microsoft';

        if (!empid || !token) {
          throw new Error('Invalid response from authentication server');
        }

        // Store authentication data in localStorage
        const storageKeys = getStorageKeys();
        localStorage.setItem(storageKeys.tokenKey, token);
        localStorage.setItem(storageKeys.empidKey, empid);
        localStorage.setItem(storageKeys.displaynameKey, displayname || '');
        localStorage.setItem(storageKeys.logintypeKey, logintype);

        // Clean URL (remove OAuth parameters)
        window.history.replaceState({}, document.title, '/homepage');

        // Continue with normal authentication flow (access check + redirect)
        STATUS_TITLE.textContent = 'Authentication Successful';
        STATUS_MESSAGE.textContent = 'Verifying access permissions...';
        
        // Small delay then proceed to access check
        setTimeout(() => {
          authenticate();
        }, 500);

      } catch (error) {
        console.error('Token exchange error:', error);
        showError('Authentication failed: ' + error.message);
      }
    }

    /**
     * Main authentication flow
     */
    async function authenticate() {
      try {
        // Step 1: Check if authenticated
        if (!isAuthenticated()) {
          STATUS_MESSAGE.textContent = 'No authentication found. Redirecting to login...';
          
          // Save intended destination
          const destination = getIntendedDestination();
          const storageKeys = getStorageKeys();
          localStorage.setItem(storageKeys.navigateurlKey, destination);
          
          setTimeout(redirectToLogin, 1500);
          return;
        }
        
        // Step 2: Get current user
        const user = getCurrentUser();
        STATUS_MESSAGE.textContent = `Welcome back, ${user.displayname || user.empid}`;
        
        // Step 3: Redirect to intended destination
        STATUS_TITLE.textContent = 'Access Granted';
        STATUS_MESSAGE.textContent = 'Redirecting to application...';
        
        const destination = getIntendedDestination();
        
        setTimeout(() => {
          window.location.href = destination;
        }, 1000);
        
      } catch (error) {
        console.error('Authentication error:', error);
        showError('An error occurred during authentication. Please try again.');
      }
    }
    
    /**
     * Initialize on page load
     */
    window.addEventListener('DOMContentLoaded', async function() {
      // Check if this is an OAuth callback (handleOAuthCallback returns true if it is)
      const isCallback = await handleOAuthCallback();
      
      if (!isCallback) {
        // Normal authentication check
        setTimeout(authenticate, 500);
      }
    });
  </script>
</body>
</html>
