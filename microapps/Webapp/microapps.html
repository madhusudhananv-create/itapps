<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Apps Portal - Applications</title>
 
  <!-- Load environment configuration -->
  <script src="/env-config.js"></script>
  <script src="/sales/access-control-config.js"></script>
  <script src="/hr/js/attendance-routes.js"></script>
  <script src="/hr/js/access-control-config.js"></script>
 
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
   
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d1526 0%, #1a2642 100%);
      min-height: 100vh;
      color: white;
    }
   
    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
   
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
   
    .logo {
      height: 40px;
      width: auto;
      background: white;
      padding: 8px 16px;
      border-radius: 6px;
    }
   
    .header-title {
      font-size: 24px;
      font-weight: 600;
      color: white;
    }
   
    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
   
    .user-name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }
   
    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
   
    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }
   
    /* Main Content */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }
   
    .welcome-section {
      margin-bottom: 50px;
    }
   
    .welcome-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 10px;
    }
   
    .welcome-subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }
   
    /* App Grid */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }
   
    .app-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
   
    .app-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
   
    .app-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }
   
    .app-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4285f4 0%, #0d47a1 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: white;
    }
   
    .app-icon.pipeline {
      background: linear-gradient(135deg, #34a853 0%, #0f9d58 100%);
    }
   
    .app-icon.csm {
      background: linear-gradient(135deg, #fbbc04 0%, #f57c00 100%);
    }
   
    .app-icon.attendance {
      background: linear-gradient(135deg, #0B5D52 0%, #073c35 100%);
    }
   
    .app-info {
      flex: 1;
    }
   
    .app-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
   
    .app-description {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
   
    .app-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }
   
    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 21, 38, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
   
    .loading-overlay.active {
      display: flex;
    }
   
    .loading-content {
      text-align: center;
    }
   
    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
   
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="/assets/images/GAVS_Logo.png" alt="GAVS Logo" class="logo">
      <div class="header-title">IT Apps Portal</div>
    </div>
    <div class="user-info">
      <span class="user-name" id="userName">Loading...</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
 
  <!-- Main Content -->
  <div class="container">
    <div class="welcome-section">
      <h1 class="welcome-title">Welcome to IT Apps Portal</h1>
      <p class="welcome-subtitle">Select an application to get started</p>
    </div>
   
    <div class="apps-grid" id="appsGrid">
      <!-- Apps will be dynamically loaded here -->
    </div>
  </div>
 
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Loading application...</p>
    </div>
  </div>
 
  <script>
    /**
     * Microapps Dashboard
     * Lists available applications based on user permissions
     */
   
    const attendanceEntryUrl =
      (window.ATTENDANCE_ROUTES && window.ATTENDANCE_ROUTES.entryPath)
      ? window.ATTENDANCE_ROUTES.entryPath
      : '/hr/workmodepolicy';
 
	// Resolve environment-aware URLs
    const REDIRECT_URLS = (typeof getRedirectUrls === 'function') ? getRedirectUrls() : {};
    const BMS_DASHBOARD_URL = REDIRECT_URLS.bmsDashboard || '/admin/bookmyseat/';


    // Available applications
    const APPLICATIONS = [
      {
        id: 'pipeline',
        name: 'Pipeline Analytics',
        description: 'Healthcare pipeline tracking and analytics dashboard',
        url: '/sales/pipeline_analytics.html',
        icon: 'PA',
        iconClass: 'pipeline',
        badge: 'Sales',
        requiresAuth: true,
        checkAccess: true
      },
      {
        id: 'bms',
        name: 'Seat Booking Application',
        description: 'Seat booking and workspace management application',
        url: BMS_DASHBOARD_URL,
        icon: 'BMS',
        iconClass: 'bms',
        badge: 'Facilities',
        requiresAuth: true,
        checkAccess: false
      },
      {
        id: 'attendance',
        name: 'Work Mode Policy Compliance',
        description: 'Weekly work mode policy compliance dashboard',
        url: attendanceEntryUrl,
        icon: 'OA',
        iconClass: 'attendance',
        badge: 'HR',
        requiresAuth: true,
        checkAccess: true
      }
    ];
   
    /**
     * Initialize page
     */
    async function initialize() {
      // Check authentication
      const storageKeys = getStorageKeys();
      const token = localStorage.getItem(storageKeys.tokenKey);
      const empid = localStorage.getItem(storageKeys.empidKey);
      const displayname = localStorage.getItem(storageKeys.displaynameKey);
     
      if (!token || !empid) {
        // Not authenticated, redirect to homepage (which will redirect to login)
        window.location.href = '/homepage';
        return;
      }
     
      // Show user info
      document.getElementById('userName').textContent = displayname || empid;
 
      // Resolve identity used for allow-list checks (prefer email).
      const userIdentity = getUserIdentityForAccess(token, empid);
     
      // Load applications
      loadApplications(userIdentity);
    }
 
    function base64UrlDecode(input) {
      try {
        const base64 = input.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
        return atob(padded);
      } catch (e) {
        return null;
      }
    }
 
    function getUserIdentityForAccess(token, fallbackEmpid) {
      const directEmail = localStorage.getItem('email');
      if (directEmail) return directEmail;
 
      if (token) {
        try {
          const parts = token.split('.');
          if (parts.length === 3) {
            const payloadRaw = base64UrlDecode(parts[1]);
            if (payloadRaw) {
              const payload = JSON.parse(payloadRaw);
              return payload.preferred_username || payload.email || payload.upn || fallbackEmpid;
            }
          }
        } catch (e) {
          // Ignore token parse errors and fallback to empid.
        }
      }
 
      return fallbackEmpid;
    }
   
    /**
     * Load and display applications
     */
    function loadApplications(userEmail) {
      const appsGrid = document.getElementById('appsGrid');
      appsGrid.innerHTML = '';
     
      APPLICATIONS.forEach(app => {
        // Check if user has access
        let hasAccess = true;
       
        if (app.checkAccess) {
          if (app.id === 'pipeline') {
            hasAccess = checkPipelineAccess(userEmail);
          } else if (app.id === 'attendance') {
            hasAccess = checkAttendanceAccess(userEmail);
          }
        }
       
        // Create app card
        const card = document.createElement('a');
        card.className = 'app-card' + (hasAccess ? '' : ' disabled');
        card.href = hasAccess ? app.url : 'javascript:void(0)';
     card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.onclick = (e) => {
          if (!hasAccess) {
            e.preventDefault();
            alert('You do not have access to this application. Please contact your administrator.');
            return false;
          }
		  
		  if (app.id === 'bms') {
            e.preventDefault();
            launchBms(app.url);
            return false;
          }
         
        };
       
        card.innerHTML = `
          <div class="app-icon ${app.iconClass}">${app.icon}</div>
          <div class="app-info">
            <div class="app-name">${app.name}</div>
            <div class="app-description">${app.description}</div>
          </div>
          <div class="app-badge">${app.badge}</div>
        `;
       
        appsGrid.appendChild(card);
      });
    }
   
   async function launchBms(destination) {
      const loadingOverlay = document.getElementById('loadingOverlay');
      const statusText = loadingOverlay ? loadingOverlay.querySelector('p') : null;
      const storageKeys = getStorageKeys();
      const token = localStorage.getItem(storageKeys.tokenKey);
      const dest = destination || BMS_DASHBOARD_URL;
      try { localStorage.setItem(storageKeys.navigateurlKey, dest); } catch {}

      if (!token) {
        window.location.href = `/homepage/index.html?redirect=${encodeURIComponent(dest)}`;
        return;
      }

      if (loadingOverlay) loadingOverlay.classList.add('active');
      if (statusText) statusText.textContent = 'Connecting your BMS session...';

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        try {
          const resp = await fetch('/sso/exchange', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            signal: controller.signal,
            body: JSON.stringify({ id_token: token }),
          });
          clearTimeout(timer);
          if (resp.ok) {
            window.location.href = dest;
            return;
          }
        } catch {
          clearTimeout(timer);
          // Exchange timed out or errored — navigate anyway; ProtectedRoute handles auth.
          window.location.href = dest;
          return;
        }
      } catch {}

      window.location.href = `/homepage/index.html?redirect=${encodeURIComponent(dest)}`;
    }
	
	
    /**
     * Check Pipeline Analytics access
     */
    function checkPipelineAccess(userEmail) {
      if (typeof ACCESS_CONTROL_CONFIG === 'undefined') {
        console.warn('Access control config not loaded');
        return true; // Allow if config not loaded
      }
     
      if (!ACCESS_CONTROL_CONFIG.enabled) {
        return true; // Access control disabled
      }
     
      // Check if user is in authorized users list
      const authorizedUser = ACCESS_CONTROL_CONFIG.AUTHORIZED_USERS.find(
        user => user.email.toLowerCase() === userEmail.toLowerCase()
      );
     
      return !!authorizedUser;
    }
 
    /**
     * Check Office Attendance Compliance access
     */
    function checkAttendanceAccess(userEmail) {
      if (typeof ATTENDANCE_ACCESS_CONTROL_CONFIG === 'undefined') {
        console.warn('Attendance access control config not loaded');
        return true; // Allow if config not loaded
      }
 
      if (!ATTENDANCE_ACCESS_CONTROL_CONFIG.enabled) {
        return true; // Access control disabled
      }
 
      const authorizedUser = ATTENDANCE_ACCESS_CONTROL_CONFIG.AUTHORIZED_USERS.find(
        user => user.email.toLowerCase() === userEmail.toLowerCase()
      );
 
      return !!authorizedUser;
    }
   
    /**
     * Logout
     */
    function goToMicrosoftSso(returnTo) {
      try {
        // Prefer configured values; fallback to ENV_CONFIG; final fallback: baked-in dev values
        var cfg = (typeof getAzureADConfig === 'function') ? getAzureADConfig() : null;
        if (!cfg && typeof ENV_CONFIG !== 'undefined' && ENV_CONFIG.azureAD && ENV_CONFIG.azureAD.development) {
          var dev = ENV_CONFIG.azureAD.development;
          cfg = {
            clientId: dev.clientId,
            tenantId: dev.tenantId,
            authority: dev.authority,
            redirectUri: (window.location.origin + '/homepage/index.html'),
            scopes: dev.scopes || ['User.Read','openid','profile','email']
          };
        }
        if (!cfg) {
          cfg = {
            clientId: '839af47e-325a-4614-8d2d-6a16299c7d0a',
            tenantId: '2ce2daff-4e86-4a36-a7e3-6aa2a22bf4d1',
            authority: 'https://login.microsoftonline.com/2ce2daff-4e86-4a36-a7e3-6aa2a22bf4d1',
            redirectUri: (window.location.origin + '/homepage/index.html'),
            scopes: ['User.Read','openid','profile','email']
          };
        }
        var state = Math.random().toString(36).slice(2);
        var nonce = Math.random().toString(36).slice(2);
        try {
          sessionStorage.setItem('oauth_state', state);
          sessionStorage.setItem('oauth_nonce', nonce);
          var sk = (typeof getStorageKeys === 'function') ? getStorageKeys() : { navigateurlKey: 'navigateurl' };
          localStorage.setItem(sk.navigateurlKey, returnTo || '/microapps.html');
        } catch {}
        var qp = new URLSearchParams({
          client_id: cfg.clientId,
          response_type: 'id_token',
          redirect_uri: cfg.redirectUri,
          response_mode: 'fragment',
          scope: (cfg.scopes || []).join(' '),
          state: state,
          nonce: nonce
        });
        window.location.href = `${cfg.authority}/oauth2/v2.0/authorize?${qp.toString()}`;
      } catch {
        // Last resort: go via portal SSO entry
        window.location.href = '/homepage/index.html?redirect=%2Fmicroapps.html';
      }
    }

    function logout() {
      const storageKeys = getStorageKeys();
      // Clear stored auth data (no checks needed)
      try {
        localStorage.removeItem(storageKeys.tokenKey);
        localStorage.removeItem(storageKeys.empidKey);
        localStorage.removeItem(storageKeys.displaynameKey);
        localStorage.removeItem(storageKeys.logintypeKey);
        // Preserve intent to return to Microapps after login
        localStorage.setItem(storageKeys.navigateurlKey, '/microapps.html');
      } catch {}
      try { sessionStorage.removeItem('oauth_state'); sessionStorage.removeItem('oauth_nonce'); } catch {}
      // Optional: clear app cookies
      try { ['app_session_token','user_profile_info','user_expiry'].forEach(n => { document.cookie = `${n}=; Max-Age=0; Path=/`; }); } catch {}
      // Navigate directly to the IT Apps Microsoft SSO page only
      const urls = (typeof getRedirectUrls === 'function') ? getRedirectUrls() : { login: '/login' };
      window.location.href = urls.login;
    }

   
    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
