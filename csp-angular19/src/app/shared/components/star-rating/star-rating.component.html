<div class="star-rating">
  <button mat-icon-button
      [color]="color"
      *ngFor="let ratingId of ratingArr; index as i"
      [id]="'star_'+i"
      (click)="onClick(i+1)"
      [matTooltip]="gettooltip(i)"
      matTooltipPosition="above"
      [disabled]="disabled"
      [ngClass]="{'disabled-button': disabled}">
    <mat-icon [ngClass]="getStarClass(i)">
      {{showIcon(i)}}
    </mat-icon>
  </button>
</div>

<mat-error *ngIf="starCount === 0 || (rating === 0 && hasBeenClicked)">
  Rating is <strong>required</strong> and cannot be zero.
</mat-error>
