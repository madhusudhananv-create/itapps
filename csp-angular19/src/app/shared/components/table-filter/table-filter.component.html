<div class="filter-container">
  <!-- Filter Controls Row -->
  <div class="filter-controls">
    <!-- Field Selector -->
    <div class="filter-field">
      <mat-form-field appearance="outline" class="filter-select">
        <mat-select [(ngModel)]="selectedFilterPref" placeholder="Filter by..." panelClass="filter-dropdown-panel">
          <mat-select-trigger>
            <span *ngIf="selectedFilterPref?.displaY_NAME">{{ selectedFilterPref.displaY_NAME }}</span>
          </mat-select-trigger>
          <mat-option *ngFor="let field of filterPref" [value]="field">
            <mat-icon class="option-icon">{{ getFieldIcon(field.datA_TYPE) }}</mat-icon>
            {{ field.displaY_NAME }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Search Input / Value Selector -->
    <div class="filter-value">
      <mat-form-field appearance="outline" class="filter-input" *ngIf="selectedFilterPref.values.length === 0">
        <input matInput [(ngModel)]="selectedFilterPref.searchString" 
               placeholder="Type to search..."
               (keyup.enter)="tbnAddFilter_OnClick()">
        <mat-icon matSuffix class="search-icon">search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-input" *ngIf="selectedFilterPref.values.length > 0">
        <mat-select [(ngModel)]="selectedFilterPref.searchString" placeholder="Select value..." panelClass="filter-dropdown-panel">
          <mat-option *ngFor="let option of selectedFilterPref.values" [value]="option.id">
            {{ option.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Action Buttons -->
    <div class="filter-actions">
      <button mat-raised-button class="btn-apply" (click)="tbnAddFilter_OnClick()">
        <mat-icon>check_circle</mat-icon>
        <span>Apply</span>
      </button>
      <button mat-stroked-button class="btn-clear" (click)="btnClearFilter_OnClick()">
        <mat-icon>refresh</mat-icon>
        <span>Clear</span>
      </button>
    </div>
  </div>

  <!-- Active Filters Tags -->
  <div class="filter-tags" *ngIf="filterCriterias.length > 0">
    <div class="tags-label">
      <mat-icon>label</mat-icon>
      <span>Active Filters:</span>
    </div>
    <div class="tags-container">
      <div class="filter-tag" *ngFor="let filter of filterCriterias">
        <span class="tag-field">{{ filter.displaY_NAME }}</span>
        <span class="tag-separator">:</span>
        <span class="tag-value">{{ filter.searchStringValue }}</span>
        <span class="tag-remove" (click)="btnRemoveFilter_OnClick(filter)">
          <mat-icon>close</mat-icon>
        </span>
      </div>
    </div>
    <button mat-button class="clear-all-btn" (click)="btnClearFilter_OnClick()" *ngIf="filterCriterias.length > 1">
      <mat-icon>delete_sweep</mat-icon>
      Clear All
    </button>
  </div>
</div>
