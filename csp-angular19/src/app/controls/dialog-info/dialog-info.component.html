<div class="modern-info-dialog">
  <!-- Animated Background Gradient -->
  <div class="dialog-bg-gradient"></div>
  
  <!-- Content Container -->
  <div class="dialog-content-wrapper">
    <!-- Animated Icon Container -->
    <div class="icon-container">
      <div class="icon-ring ring-1"></div>
      <div class="icon-ring ring-2"></div>
      <div class="icon-ring ring-3"></div>
      <div class="icon-inner">
        <mat-icon class="info-icon" [style.color]="iconColor">{{ icon }}</mat-icon>
      </div>
    </div>

    <!-- Title -->
    <h2 class="dialog-title">{{ data.title }}</h2>
    
    <!-- Message -->
    <p class="dialog-message" *ngIf="!hasHtmlMessage">{{ data.message }}</p>
    <div class="dialog-message" *ngIf="hasHtmlMessage" [innerHTML]="sanitizedHtml"></div>

    <!-- Action Button -->
    <div class="dialog-buttons">
      <button 
        class="btn-ok"
        (click)="onClose()">
        <mat-icon class="btn-icon">check_circle</mat-icon>
        <span class="btn-text">{{ buttonText }}</span>
      </button>
    </div>
  </div>
</div>
