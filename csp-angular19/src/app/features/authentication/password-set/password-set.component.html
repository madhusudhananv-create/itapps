<!-- Password Set Template - Preserved from legacy -->
<div class="mainlogin">
  <img id="bg" src="assets/images/BrandElement_desktop_v1.jpg" alt="Background" style="width:100vw">
  
  <!-- Neurealm Logo Overlay -->
  <div class="logo-overlay">
    <img src="assets/images/neurealm_logo.png" alt="Neurealm" 
         onerror="this.style.display='none'"
         style="height: 50px;">
  </div>
  
  <div class="layout">
    <form #setpasswordform="ngForm" (ngSubmit)="submitForm(setpasswordform.valid ?? false)" style="align-self: center">
      
      <!-- Title -->
      <div style="text-align:center;font-size:25px;padding:15px 0 15px">
        Set password
      </div>
      
      <!-- Email (readonly) -->
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fas fa-user"></i>
          </span>
          <input 
            type="text" 
            [(ngModel)]="email" 
            name="txtUsername" 
            placeholder="Email id" 
            class="form-control input-md LoginTextBox" 
            readonly
            style="Width:250px;Height:40px">
        </div>
      </div>

      <!-- New Password -->
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fas fa-lock"></i>
          </span>
          <input 
            type="password" 
            [(ngModel)]="password1" 
            name="txtpassword1" 
            placeholder="New password" 
            class="form-control input-md LoginTextBox"
            style="Width:250px;Height:40px" 
            [disabled]="password_disable || isSubmitting" 
            required>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fas fa-lock"></i>
          </span>
          <input 
            type="password" 
            [(ngModel)]="password2" 
            name="txtpassword2" 
            placeholder="Re-enter password" 
            class="form-control input-md LoginTextBox"
            style="Width:250px;Height:40px" 
            [disabled]="password_disable || isSubmitting" 
            required>
        </div>
      </div>

      <!-- Password Requirements -->
      <div class="row" style="padding:0 15px;font-size:12px;color:#666">
        Password must be at least 8 characters long
      </div>

      <!-- Buttons -->
      <div style="text-align: center;padding-top:15px">
        <button 
          type="submit" 
          class="btn btn-success"
          [disabled]="password_disable || isSubmitting">
          {{ isSubmitting ? 'Submitting...' : 'Submit' }}
        </button>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <a 
          type="button" 
          class="btn btn-success" 
          [routerLink]="['/login']"
          [class.disabled]="isSubmitting">
          Cancel
        </a>
      </div>
      
    </form>

    <!-- Link to login -->
    <div class="row" style="margin-top:25px;text-align:center">
      <a class="link" [routerLink]="['/login']">Back to login page</a>
    </div>
  </div>
</div>
