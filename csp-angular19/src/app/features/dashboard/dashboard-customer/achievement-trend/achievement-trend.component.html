<div style="padding: 10px; height: 100%; display: flex; flex-direction: column;">
  <!-- Close Button -->
  <div class="row" style="margin-bottom: 5px;">
    <div class="col-lg-12 col-md-12 col-sm-12" style="text-align:right; cursor: pointer;" (click)="closePopup()">
      <i style="font-size:20px; margin-right: 5px;" class="fa">&#xf00d;</i>
    </div>
  </div>

  <!-- Chart Display -->
  <div *ngIf="lineGraphData != null" style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <!-- Highcharts Line Graph -->
    <div *ngIf="lineGraphData.hasOwnProperty('series') && lineGraphData['series'].length > 0" 
         style="width: 100%; height: 500px; padding: 0 10px;">
      <highcharts-chart 
        style="width: 100%; height: 100%; display: block;" 
        [options]="lineGraphData">
      </highcharts-chart>
    </div>
    <!-- No Data Message -->
    <div class="row" *ngIf="lineGraphData.hasOwnProperty('series') && lineGraphData['series'].length == 0" 
         style="height: 400px; width: 100%; line-height: 200px; text-align: center;">
      <b>No Achievement Trend available for this Time Range</b>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div class="row" 
       *ngIf="!lineGraphData" 
       style="height: 400px; width: 100%; line-height: 200px; text-align: center;">
    <i class="fa fa-circle-o-notch fa-spin" style="margin-right: 10px; font-size: 25px;"></i>Loading...
  </div>
</div>
