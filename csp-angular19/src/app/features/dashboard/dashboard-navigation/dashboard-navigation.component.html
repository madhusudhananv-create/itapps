<!-- Navbar -->
<div style="width:100% !important;margin: 0; padding: 0;">
    <app-navbar-new [ShowMenu]="ShowMenu" (showDashboardMenu)="onMenuToggleChange($event)"></app-navbar-new>
    <!-- Menu component - shown when menu icon is clicked -->
    <app-menu [custid]="customerid" *ngIf="menuToggleStatus"></app-menu>
</div>

<!-- Dashboard tabs when SLA is NOT available -->
<div *ngIf="!slaAvailable" class="row" style="background: #FFFFFF 0% 0% no-repeat padding-box;opacity: 1;margin-top: 0;min-height: 600px;">
    <mat-tab-group [selectedIndex]="0">
        <mat-tab label="Operational Dashboard">
            <!-- Dashboard Customer Component (Customer Header + Operational Widgets) -->
            <app-dashboard-customer [custid]="customerid" [reset]="reset"></app-dashboard-customer>
        </mat-tab>

        <mat-tab label="Business Value Dashboard">
            <app-bvd-dashboard [customerId]="customerid"></app-bvd-dashboard>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(76, 1, '', '')" label="CSAT Insights">
            <app-cssdashboard [custId]="customerid" [currIndex]="0"></app-cssdashboard>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(78, 1, '', '')" label="QA Governance">
            <app-dashboard-assessment-findings [custId]="customerid"></app-dashboard-assessment-findings>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(99, 1, '', '')" label="Risk Dashboard">
            <app-risk-chart [customerId]="customerid"></app-risk-chart>
        </mat-tab>
    </mat-tab-group>
</div>

<!-- Dashboard tabs when SLA IS available -->
<div *ngIf="slaAvailable" class="row" style="background: #FFFFFF 0% 0% no-repeat padding-box;opacity: 1;margin-top: 0;min-height: 600px;">
    <mat-tab-group [selectedIndex]="0">
        <mat-tab label="Operational Dashboard">
            <ng-template matTabContent style="overflow: hidden;">
                <!-- Dashboard view based on customer type:
                     - Premier customers: Show Dashboard Premier (currIndex=0) SLA Dashboard first, can navigate to Success Goal with Next button
                     - Frontier customers: Show Dashboard Customer directly (with PORTFOLIO table) -->
                <app-dashboard-previous-next *ngIf="_util.IsPremier(customerid)" [currIndex]="0"></app-dashboard-previous-next>
                <app-dashboard-customer *ngIf="!_util.IsPremier(customerid)" [custid]="customerid" [reset]="reset"></app-dashboard-customer>
            </ng-template>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(72, 1, '', '')" label="Business Value Dashboard">
            <ng-template matTabContent>
                <app-bvd-dashboard [customerId]="customerid"></app-bvd-dashboard>
            </ng-template>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(76, 1, '', '')" label="CSAT Insights">
            <ng-template matTabContent style="overflow: hidden;">
                <app-cssdashboard [custId]="customerid" [currIndex]="0"></app-cssdashboard>
            </ng-template>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(78, 1, '', '')" label="QA Governance">
            <ng-template matTabContent style="overflow: hidden;">
                <app-dashboard-assessment-findings [custId]="customerid"></app-dashboard-assessment-findings>
            </ng-template>
        </mat-tab>

        <mat-tab *ngIf="_access.IsAllowed(99, 1, '', '')" label="Risk Dashboard">
            <ng-template matTabContent style="overflow: hidden;">
                <app-risk-chart [customerId]="customerid"></app-risk-chart>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</div>
