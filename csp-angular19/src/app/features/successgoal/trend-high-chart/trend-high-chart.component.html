<div class="row" >
    <div style="text-align: right; margin-right: 18px; cursor: pointer;" (click)="closeDialog()">
      <i style="font-size:24px; margin-left: auto; margin: 10px;" class="fa">&#xf00d;</i>
    </div>
    <div *ngIf="chartOptions" style="margin: 25px;">
       <highcharts-chart 
         [options]="chartOptions" 
         style="margin-left: auto; margin-right: auto; width: 100%; height: 400px; display: block;">
       </highcharts-chart>
    </div>
 </div>
