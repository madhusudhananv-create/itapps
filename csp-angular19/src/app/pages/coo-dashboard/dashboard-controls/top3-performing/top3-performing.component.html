<div class="row">
  <div class="col-lg-12 Top3Performing">
    <mat-icon [class.green-icon]="top3Performing === 'P'" [class.red-icon]="top3Performing === 'NP'" class="thumb-icon">
      {{top3Performing === 'P' ? 'thumb_up' : 'thumb_down'}}
    </mat-icon>
    <mat-form-field appearance="outline" class="compact-select">
      <mat-select name="top3Performing" (ngModelChange)="ontop3PerformingChange($event)" [(ngModel)]="top3Performing">
        <mat-option value="P">Overall Top 3 Performing</mat-option>
        <mat-option value="NP">Overall Top 3 Non Performing</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>

<div class="row">
  <div class="col-lg-12 marginleft-10px">
    <mat-tab-group class="Top3Perform" [selectedIndex]="0" (selectedTabChange)="OntabChange()">
      
      <!-- Accounts Tab -->
      <mat-tab label="Accounts" *ngIf="_cooDashboardCommon.top3Accounts">
        <div *ngIf="_cooDashboardCommon.top3Accounts.length > 0">
          <div class="row" *ngFor="let t of _cooDashboardCommon.top3Accounts">
            <div class="col-lg-10">
              <span class="top3Performvalues" [title]="t.Name">{{t.Name}}</span>
            </div>
            <div class="col-lg-2">{{t.value}}%</div>
          </div>
        </div>
        <div *ngIf="_cooDashboardCommon.top3Accounts.length === 0">
          <div class="row">
            <div class="col-lg-12">No data available</div>
          </div>
        </div>
      </mat-tab>
      
      <!-- Portfolios Tab -->
      <mat-tab label="Portfolios" *ngIf="_cooDashboardCommon.top3Portfolios && _cooDashboardCommon.top3Portfolios.length > 0">
        <div *ngIf="_cooDashboardCommon.top3Portfolios.length > 0">
          <div class="row" *ngFor="let t of _cooDashboardCommon.top3Portfolios">
            <div class="col-lg-10">
              <span class="top3Performvalues" [title]="t.Name">{{t.Name}}</span>
            </div>
            <div class="col-lg-2">{{t.value}}%</div>
          </div>
        </div>
        <div *ngIf="_cooDashboardCommon.top3Portfolios.length === 0">
          <div class="row">
            <div class="col-lg-12">No data available</div>
          </div>
        </div>
      </mat-tab>
      
      <!-- Projects Tab -->
      <mat-tab label="Projects" *ngIf="_cooDashboardCommon.top3Projects">
        <div *ngIf="_cooDashboardCommon.top3Projects.length > 0">
          <div class="row" *ngFor="let t of _cooDashboardCommon.top3Projects">
            <div class="col-lg-10">
              <span class="top3Performvalues" [title]="t.Name">{{t.Name}}</span>
            </div>
            <div class="col-lg-2">{{t.value}}%</div>
          </div>
        </div>
        <div *ngIf="_cooDashboardCommon.top3Projects.length === 0">
          <div class="row">
            <div class="col-lg-12">No data available</div>
          </div>
        </div>
      </mat-tab>
      
    </mat-tab-group>
  </div>
</div>
