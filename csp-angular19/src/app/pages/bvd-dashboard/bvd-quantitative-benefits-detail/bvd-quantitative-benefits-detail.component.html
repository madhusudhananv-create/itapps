<div class="dialog" style="height: 539px;;box-shadow: 0px -3px 3px #00000029;opacity: 1;overflow-x: hidden;">
<div class="row" mat-dialog-title style="height: 40px;background: #EBEBEB 0% 0% no-repeat padding-box;opacity: 1;">
  <label style="height: 17px;text-align: left;font: normal normal normal 14px/17px Proxima Nova;letter-spacing: 0px;color: #333333;opacity: 1;margin-left: 15px;margin-top: 5px">Quantitative Benefits</label>
  <a  class="close-button" (click)="onClose()" style="margin-left: 850px;color:#333333;cursor: pointer;position: absolute;">
    <mat-icon class="close-icon" >close</mat-icon>
  </a>
</div>
<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12">
    <!-- <div mat-dialog-content style="height: 230px;overflow-y: auto;overflow-x: hidden;border-radius: 5px;opacity: 1;"> -->
      <table mat-table [dataSource]="dataSource" class="table mat-elevation-z0">
          <ng-container matColumnDef="identifiedDate">
              <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Identified Date</th>
              <td mat-cell *matCellDef="let listbenefits">{{listbenefits.identified_Date}}</td>
            </ng-container>
            <ng-container matColumnDef="idea">
              <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Idea</th>
              <td mat-cell *matCellDef="let listbenefits">{{listbenefits.idea}}</td>
            </ng-container>
            <ng-container matColumnDef="area">
              <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Area</th>
              <td mat-cell *matCellDef="let listbenefits">{{listbenefits.area}}</td>
            </ng-container>
            <ng-container matColumnDef="responsible" style="width: 15% !important;">
              <th mat-header-cell *matHeaderCellDef>Responsible</th>
              <td mat-cell *matCellDef="let listbenefits">{{listbenefits.responsible}}</td>
            </ng-container>
            <ng-container matColumnDef="savings">
              <th mat-header-cell *matHeaderCellDef style="width: 15% !important;">Savings</th>
              <td mat-cell *matCellDef="let listbenefits">{{listbenefits.net_Benefits}}</td>
            </ng-container>
            <!-- <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let listbenefits"><a class="Uselink" style="margin-left: 10px">View></a></td>
            </ng-container> -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      
    <!-- </div> -->
    <div #paginator>
      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </div>
  </div>
</div>

</div>
