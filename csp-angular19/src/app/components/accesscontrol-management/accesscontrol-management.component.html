<!-- Loading Overlay - shown while processing approve/reject -->
<div *ngIf="isProcessing" class="loading-overlay">
  <div class="loading-spinner-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">Processing {{ confirmAction }}...</p>
  </div>
</div>

<!-- Request Access Button -->
<!-- Shown when parent sets showAccessRequestButton=true AND user does not already have access -->
<div *ngIf="showAccessRequestButton && !_access.IsAllowed(resourceId, accessType, '', '')"
     class="access-request-wrapper">
  <div class="access-request-card">
    <div class="access-lock-icon" [class.pending-icon]="alreadyRequested">
      <!-- Lock icon when not yet requested -->
      <svg *ngIf="!alreadyRequested" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
      </svg>
      <!-- Clock icon when already requested -->
      <svg *ngIf="alreadyRequested" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="access-request-text">
      <span class="access-request-label" [class.pending-label]="alreadyRequested">
        {{ alreadyRequested ? 'Request Pending' : 'Access Required' }}
      </span>
      <span class="access-request-desc">{{ feature }}</span>
    </div>

    <!-- Pending badge — shown after request is sent -->
    <div *ngIf="alreadyRequested" class="pending-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Awaiting Approval</span>
    </div>

    <!-- Request button — shown before request is sent -->
    <button *ngIf="!alreadyRequested"
            class="access-request-btn"
            [class.is-loading]="isRequestingAccess"
            [disabled]="isRequestingAccess"
            (click)="requestAccess()">
      <ng-container *ngIf="!isRequestingAccess">
        <span class="btn-text">Request Access</span>
        <svg class="btn-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </ng-container>
      <ng-container *ngIf="isRequestingAccess">
        <svg class="btn-spinner" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5"
                  stroke-dasharray="28 56" stroke-linecap="round"/>
        </svg>
        <span class="btn-text">Requesting…</span>
      </ng-container>
    </button>
  </div>
</div>

<!-- Confirmation Dialog Template (approve / reject) -->
<!-- Opened programmatically by confirmDialogOpen() when approver follows email link -->
<ng-template #confirmationDialogAccess>

  <h2 mat-dialog-title class="dialog-title">Confirm</h2>

  <mat-dialog-content class="dialog-content">
    Are you sure you want to <strong>{{ confirmAction }}</strong> the request?
  </mat-dialog-content>

  <div *ngIf="showReasonInput" class="reason-container">
    <textarea
      [(ngModel)]="reasonText"
      rows="3"
      class="reason-textarea"
      placeholder="Please provide a reason for rejection">
    </textarea>
  </div>

  <mat-dialog-actions class="dialog-actions">
    <button mat-button
      [mat-dialog-close]="'1'"
      class="btn btn-primary">
      Yes
    </button>
    <button mat-button
      [mat-dialog-close]="'0'"
      class="btn btn-warning">
      No
    </button>
  </mat-dialog-actions>

</ng-template>
