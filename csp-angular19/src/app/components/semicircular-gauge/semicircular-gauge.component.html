<svg [attr.width]="width" [attr.height]="height" [attr.viewBox]="'0 0 ' + width + ' ' + height">
  <defs>
    <filter id="gauge-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!--
    *** KEY TECHNIQUE ***
    Every <path> below uses [attr.d]="sharedPath" — the IDENTICAL arc geometry.
    Segments are revealed using stroke-dasharray / stroke-dashoffset only.
    It is geometrically impossible for any segment to render outside the track
    because they are all the same path.

    Track stroke-width  = strokeWidth     (e.g. 14)
    Segment stroke-width = segStroke      (e.g. 14 = strokeWidth, matches exactly)
    → Colored arcs match the track width perfectly (no inset).
  -->

  <!-- Grey track (full arc, round caps) -->
  <path
    [attr.d]="sharedPath"
    fill="none"
    [attr.stroke]="trackColor"
    [attr.stroke-width]="strokeWidth"
    stroke-linecap="round"
  />

  <!-- Red: High segment -->
  <path
    *ngIf="highValue > 0"
    [attr.d]="sharedPath"
    fill="none"
    [attr.stroke]="dangerColor"
    [attr.stroke-width]="segStroke"
    [attr.stroke-dasharray]="highDash"
    [attr.stroke-dashoffset]="highOffset"
    stroke-linecap="round"
    [attr.stroke-opacity]="activeSegment === 'high' ? 1 : 0.9"
    [attr.filter]="activeSegment === 'high' ? 'url(#gauge-shadow)' : ''"
    style="cursor:pointer;transition:stroke-opacity .3s ease,filter .3s ease"
    [@pulseOnClick]="pulseState"
    (click)="toggleSegment('high');$event.stopPropagation()"
  />

  <!-- Amber: Medium segment -->
  <path
    *ngIf="mediumValue > 0"
    [attr.d]="sharedPath"
    fill="none"
    [attr.stroke]="warningColor"
    [attr.stroke-width]="segStroke"
    [attr.stroke-dasharray]="mediumDash"
    [attr.stroke-dashoffset]="mediumOffset"
    stroke-linecap="round"
    [attr.stroke-opacity]="activeSegment === 'medium' ? 1 : 0.9"
    [attr.filter]="activeSegment === 'medium' ? 'url(#gauge-shadow)' : ''"
    style="cursor:pointer;transition:stroke-opacity .3s ease,filter .3s ease"
    [@pulseOnClick]="pulseState"
    (click)="toggleSegment('medium');$event.stopPropagation()"
  />

  <!-- Green: Low segment -->
  <path
    *ngIf="lowValue > 0"
    [attr.d]="sharedPath"
    fill="none"
    [attr.stroke]="successColor"
    [attr.stroke-width]="segStroke"
    [attr.stroke-dasharray]="lowDash"
    [attr.stroke-dashoffset]="lowOffset"
    stroke-linecap="round"
    [attr.stroke-opacity]="activeSegment === 'low' ? 1 : 0.9"
    [attr.filter]="activeSegment === 'low' ? 'url(#gauge-shadow)' : ''"
    style="cursor:pointer;transition:stroke-opacity .3s ease,filter .3s ease"
    [@pulseOnClick]="pulseState"
    (click)="toggleSegment('low');$event.stopPropagation()"
  />

  <!-- Click-to-reveal labels -->
  <text *ngIf="activeSegment === 'high' && highValue > 0 && highPercent > 10"
    [@labelFade]
    [attr.x]="highLabelX" [attr.y]="highLabelY"
    text-anchor="middle" font-family="Inter,sans-serif"
    font-size="7" font-weight="600"
    [attr.fill]="dangerColor" pointer-events="none">
    <tspan [attr.x]="highLabelX" dy="-5">{{highLabel}}</tspan>
    <tspan [attr.x]="highLabelX" dy="9">{{highValue}} ({{highPercent | number:'1.0-0'}}%)</tspan>
  </text>

  <text *ngIf="activeSegment === 'medium' && mediumValue > 0 && mediumPercent > 10"
    [@labelFade]
    [attr.x]="mediumLabelX" [attr.y]="mediumLabelY"
    text-anchor="middle" font-family="Inter,sans-serif"
    font-size="7" font-weight="600"
    [attr.fill]="warningColor" pointer-events="none">
    <tspan [attr.x]="mediumLabelX" dy="-5">{{mediumLabel}}</tspan>
    <tspan [attr.x]="mediumLabelX" dy="9">{{mediumValue}} ({{mediumPercent | number:'1.0-0'}}%)</tspan>
  </text>

  <text *ngIf="activeSegment === 'low' && lowValue > 0 && lowPercent > 10"
    [@labelFade]
    [attr.x]="lowLabelX" [attr.y]="lowLabelY"
    text-anchor="middle" font-family="Inter,sans-serif"
    font-size="7" font-weight="600"
    [attr.fill]="successColor" pointer-events="none">
    <tspan [attr.x]="lowLabelX" dy="-5">{{lowLabel}}</tspan>
    <tspan [attr.x]="lowLabelX" dy="9">{{lowValue}} ({{lowPercent | number:'1.0-0'}}%)</tspan>
  </text>

  <!-- Centre total -->
  <text *ngIf="showCenterText"
    [attr.x]="width / 2"
    [attr.y]="isCircular ? (height / 2 + fontSize / 3) : (height - 10)"
    text-anchor="middle" font-family="Inter,sans-serif"
    [attr.font-size]="fontSize" [attr.font-weight]="fontWeight"
    [attr.fill]="textColor">{{ total }}</text>
</svg>
