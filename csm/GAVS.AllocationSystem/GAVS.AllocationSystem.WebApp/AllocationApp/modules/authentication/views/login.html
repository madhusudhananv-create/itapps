<form name="myForm" ng-submit="login()" novalidate>
    <div class="row">
        <div class="col-sm-6" style="margin-left:15px">
            <!--<img src="Images/emphome.jpg" />-->
        </div>
        <div class="col-sm-3" style="margin-top:15px">
            <div class="row">
                <label class="col-md-4 control-label LoginLabel" for="Email">Username</label>
            </div>
            <div class="row" style="height:60px">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-user-o fa-fw"></i></span>
                        <input name="txtUsername" ng-model="username" type="text" placeholder="Username" class="form-control input-md LoginTextBox" style="Width:250px;Height:40px">
                    </div>
                </div>
            </div>
            <div class="row">
                <label class="col-md-3 control-label LoginLabel" for="Password">Password</label>
            </div>
            <div class="row" style="height:60px">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-key fa-fw"></i></span>
                        <input name="txtPassword" ng-model="password" type="password" placeholder="Password" class="form-control input-md LoginTextBox" style="Width:250px;Height:40px">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <input type="submit" ID="btnLogin" Text="Login" class="btn btn-success" />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 col-lg-12">
                    <p style="color:red;font-size:smaller">{{errMessage}}</p>
                </div>
            </div>
        </div>

    </div>
</form>
