<div class="dialog" style="box-shadow: 0px -3px 3px #00000029; opacity: 1; overflow-x: hidden;">
  <!-- Dialog Header -->
  <div 
    class="row" 
    mat-dialog-title 
    style="height: 40px; background: #EBEBEB 0% 0% no-repeat padding-box; opacity: 1;">
    
    <div style="float: left;">
      <label 
        style="height: 17px; text-align: left; font: normal normal normal 14px/17px Roboto, 'Helvetica Neue', sans-serif; letter-spacing: 0px; color: #333333; opacity: 1; margin-left: 15px; margin-top: 5px;">
        Upload KPI File
      </label>
    </div>

    <div style="float: right; margin: 5px;">
      <a 
        class="close-button" 
        (click)="onClose()" 
        style="color: #333333; cursor: pointer;">
        <mat-icon class="close-icon">close</mat-icon>
      </a>
    </div>
  </div>

  <!-- Dialog Content -->
  <div style="margin: 15px;">
    <div class="row">
      <input 
        type="file" 
        #fileUpload 
        class="form-control" 
        name="single"  
        accept="application/vnd.ms-excel.sheet.macroEnabled.12,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" 
        ng2FileSelect 
        style="width: calc(90% - 20px);" />
      
      <button 
        class="btn btn-success" 
        value="Upload" 
        (click)='Save_onClick(fileUpload)'
        style="float: right; margin-top: -33px; margin-right: 29px;"> 
        Upload
      </button>
      
      <span style="color: #4e5882;">
        <span style="color: red;">*</span>.xslm or .xlsx file only
      </span>
    </div>
    
    <!-- Progress Bar -->
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>
</div>
