<div class="spell-check-container">
  <div class="editor-wrapper">
    <div 
      class="editor" 
      contenteditable="true"
      (input)="onEditorInput($event)"
      (keydown)="onKeyDown($event)"
      [innerHTML]="processedHtml">
    </div>
  </div>
  
  <div class="info">
    <p class="hint">Type to check spelling. Misspelled words will be underlined.</p>
  </div>
</div>
