<div style="text-align: center">
  <div class="row" style="border: solid 1px #e0e0e0; background-color:white;padding:5px">
    <div class="col-lg-3 col-md-3 col-sm-12">
      <mat-form-field appearance="outline" class="project-dropdown">
        <mat-label>Project</mat-label>
        <mat-select name="ddProject" [(ngModel)]="projId" (ngModelChange)="ddProject_onChange()">
          <mat-option *ngFor="let p of Projects" [value]="p.proJ_ID">
            {{ p.proJ_NM }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    
    <div class="col-lg-6 col-md-6 col-sm-5">
      <app-monthandyearpicker (onChange)='monthandyearpicker_onChange($event)'></app-monthandyearpicker>
    </div>
    
    <div class="col-lg-3 col-md-3 col-sm-12">
      <button style="margin: 0 0 0 10px;" class="btn" type="button" name="btnPeriod"
        (click)="LoadTimelineChart()">Go</button>
    </div>
  </div>

  <div class="row" style="padding: 10px;">
    <highcharts-chart
      *ngIf="chartOptions"
      [options]="chartOptions"
      [oneToOne]="true"
      style="width: 100%; height: 400px; display: block;"
    ></highcharts-chart>
  </div>
</div>
