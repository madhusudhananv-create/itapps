<!-- Password Forgot Template - Preserved from legacy -->
<div class="mainlogin">
  <img id="bg" src="assets/images/BrandElement_desktop_v1.jpg" alt="Background" style="width:100vw">
  
  <!-- Neurealm Logo Overlay -->
  <!-- <div class="logo-overlay">
    <img src="assets/images/neurealm_logo.png" alt="Neurealm" 
         onerror="this.style.display='none'"
         style="height: 50px;">
  </div> -->
  
  <div class="layout">
    <form #forgotform="ngForm" (ngSubmit)="submitForm(forgotform.valid ?? false)" style="align-self: center">
      
      <!-- Title -->
      <div style="text-align:center;font-size:25px;padding:15px 0 15px">
        Forgot password
      </div>
      
      <!-- Instructions -->
      <div class="row" style="padding:15px">
        Please enter your email id to get password reset link to your email.
      </div>

      <!-- Email Input -->
      <div class="row" style="padding:15px">
        <div class="input-group">
          <span class="input-group-addon">
            <i class="fas fa-user"></i>
          </span>
          <input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="Email id" 
            name="txtEmailid" 
            class="form-control input-md LoginTextBox"
            style="Width:250px;Height:40px" 
            required
            [disabled]="isSubmitting">
        </div>
      </div>

      <!-- Buttons -->
      <div style="text-align: center">
        <button 
          type="submit" 
          class="btn btn-success"
          [disabled]="isSubmitting">
          {{ isSubmitting ? 'Submitting...' : 'Submit' }}
        </button>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <a 
          type="button" 
          class="btn btn-success" 
          [routerLink]="['/login']"
          [class.disabled]="isSubmitting">
          Cancel
        </a>
      </div>
      
    </form>
  </div>
</div>
