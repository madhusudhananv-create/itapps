<div class="success-container">
  <!-- Modern Header -->
  <div class="page-header">
    <div class="header-left">
      <button mat-icon-button class="back-button" 
              [routerLink]="['/newdashboard/cust', _layoutService.selectedCust, false]"
              matTooltip="Back to Customer Dashboard">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="logo-container">
        <img class="customer-logo" 
             src="assets/images/{{_layoutService.selectedCust}}.png"
             onerror="this.src ='assets/images/CustomerLogo.png'">
      </div>
      <div class="header-title">
        <h1>Success Goals</h1>
        <p class="subtitle">Strategic Objectives & Outcomes</p>
      </div>
    </div>
    <div class="header-right" *ngIf="_access.IsAllowed(15, 3, '', '')">
      <!-- Read-only mode: Edit button -->
      <button mat-raised-button color="primary" class="edit-button" 
              *ngIf="readonlymode" 
              (click)="Edit_onClick()">
        <mat-icon>edit</mat-icon>
        Edit
      </button>
      <!-- Edit mode: Save and Cancel buttons -->
      <div *ngIf="editmode" class="edit-actions">
        <button mat-raised-button color="primary" 
                (click)="GoalsSave_onClick(clientId, txtGoals.nativeElement.value)">
          <mat-icon>save</mat-icon>
          Save
        </button>
        <button mat-stroked-button 
                (click)="Cancel_onClick()">
          <mat-icon>close</mat-icon>
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Content Section -->
  <div class="content-wrapper">
    <!-- Read-only View -->
    <div *ngIf="readonlymode" class="goals-card">
      <div class="card-header">
        <mat-icon class="header-icon">flag</mat-icon>
        <h2>Customer Success Goals</h2>
      </div>
      <div class="goals-content">
        <p class="goals-text">{{clientGoals}}</p>
      </div>
    </div>

    <!-- Edit Mode -->
    <div *ngIf="editmode" class="goals-edit-card">
      <div class="card-header">
        <mat-icon class="header-icon">edit_note</mat-icon>
        <h2>Edit Success Goals</h2>
      </div>
      <div class="edit-content">
        <mat-form-field appearance="outline" class="goals-textarea-field">
          <textarea #txtGoals 
                    matInput 
                    [(ngModel)]="clientGoals"
                    placeholder="Enter strategic objectives and success goals..."
                    matTextareaAutosize 
                    matAutosizeMinRows="12"
                    matAutosizeMaxRows="20"></textarea>
          <mat-hint>Define the key objectives and outcomes for customer success</mat-hint>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
