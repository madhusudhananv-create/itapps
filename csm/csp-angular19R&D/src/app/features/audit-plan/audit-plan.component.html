<mat-horizontal-stepper linear #stepper>
  <mat-step linear>
    <ng-template matStepLabel> Planner</ng-template>
    <app-task-planner [stepper]="stepper"></app-task-planner>
  </mat-step>
  <mat-step>
    <ng-template matStepLabel>Manage Event/Task</ng-template>
    <app-task-add 
      [task]="selectedTask"
      (onSave)="handleTaskSave($event)"
      (onCancel)="handleTaskCancel()">
    </app-task-add>
  </mat-step>
  <!-- Execute step commented out
  <mat-step>
    <ng-template matStepLabel>Execute </ng-template>
    <app-execute [stepper]="stepper"></app-execute>
  </mat-step>
  -->
</mat-horizontal-stepper>
