<!-- <app-cssdashboard-filter [allCust] = "allCust" [custId]="customerId" (getCssInputEmitter) = "receivedCssInput($event)"></app-cssdashboard-filter> -->

<div class="row"> 
  <div style="float: left;width: 97%;margin-left: 1%;height:auto">
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>
  <div class="col-sm-4" style="float: left;height: 500px">
    <highcharts-chart *ngIf="trendChartDataNPSInPercentage != undefined"
      [options]="trendChartDataNPSInPercentage"
      class="modern-chart-container">
    </highcharts-chart>
    <div
      class="modern-chart-container no-data-container"
      *ngIf="trendChartDataNPSInPercentage == undefined">
      <div class="chart-title">Response Category ( % )</div>
      <i class="material-icons md-inactive no-data-icon">warning</i>
      <div class="no-data-text">No Data found for the Period</div>
    </div>
  </div>

  <div class="col-sm-4" style="float: left;height: 500px">
    <highcharts-chart *ngIf="surveyData != undefined"
      [options]="surveyData"
      class="modern-chart-container">
    </highcharts-chart>
    <div
      class="modern-chart-container no-data-container"
      *ngIf="surveyData == undefined ">
      <div class="chart-title">Customer Success Distribution</div>
      <i class="material-icons md-inactive no-data-icon">warning</i>
      <div class="no-data-text">No Data found for the Period</div>
    </div>
  </div>
</div>
