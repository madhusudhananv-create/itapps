<!-- Modern Charts Page 2 - Survey Questions -->
<div class="row" style="padding: 16px; position: relative;">
  <div style="float: left;width: 97%;margin-left: 1%;height:auto">
    <mat-progress-bar *ngIf="_loading" mode="indeterminate"></mat-progress-bar>
  </div>

  <!-- Trend Checkbox -->
  <div class="checkbox" style="position: absolute; top: 16px; right: 24px; z-index: 10;" *ngIf="trendQuarter == 2 || trendQuarter == 3">
    <mat-checkbox name="Summary" [(ngModel)]="showTrendData" (change)="loadTrendWiseData($event)"
      style="font-size: 13px; font-weight: 500; color: #616161;">Show Trend Wise Data</mat-checkbox>
  </div>
  
  <!-- No Data State -->
  <div class="no-data-container"
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); height: 400px; text-align: center; border: 1px solid #e2e8f0; margin: 16px; width: calc(100% - 32px);"
    *ngIf="surveyQuestions == undefined">
    <i style="font-size: 72px; color: #9e9e9e; opacity: 0.5; margin-bottom: 16px;" class="material-icons md-inactive">warning</i>
    <div style="font-family: Inter, Segoe UI, sans-serif; font-weight: 500; font-size: 16px; color: #9e9e9e;">No Data found</div>
  </div>

  <!-- Non-Monthly Frequency Charts -->
  <ng-container *ngIf="customerList?.frequency != 'Monthly'">
    <div class="col-sm-4" style="float: left;height: 500px; padding: 12px;" *ngFor="let chart of surveyQuestions">
      <highcharts-chart *ngIf="surveyQuestions.length > 0"
        [options]="chart"
        style="display: block; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; background: #ffffff;">
      </highcharts-chart>
      <div class="no-data-container"
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); height: 400px; text-align: center; border: 1px solid #e2e8f0;"
        *ngIf="surveyQuestions == undefined">
        <div style='font-family: Inter, Segoe UI, sans-serif; font-size: 14px; font-weight: 600; color: #616161; margin-bottom: 16px;'>
          Customer Success Questions</div>
        <i style="font-size: 72px; color: #9e9e9e; opacity: 0.5; margin-bottom: 16px;" class="material-icons md-inactive">warning</i>
        <div style="font-family: Inter, Segoe UI, sans-serif; font-weight: 500; font-size: 16px; color: #9e9e9e;">No Data found for the Quarter</div>
      </div>
    </div>
  </ng-container>

  <!-- Monthly Frequency Charts -->
  <ng-container *ngIf="customerList?.frequency == 'Monthly'">
    <div class="no-data-container"
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); height: 400px; text-align: center; border: 1px solid #e2e8f0; margin: 16px; width: calc(100% - 32px);"
      *ngIf="surveyQuestions != undefined && surveyQuestions.item1.length == 0 && surveyQuestions.item2.length == 0">
      <i style="font-size: 72px; color: #9e9e9e; opacity: 0.5; margin-bottom: 16px;" class="material-icons md-inactive">warning</i>
      <div style="font-family: Inter, Segoe UI, sans-serif; font-weight: 500; font-size: 16px; color: #9e9e9e;">No Data found</div>
    </div>

    <div class="col-sm-4" style="float: left;height: 500px; padding: 12px;" *ngFor="let chart of surveyQuestions?.item1">
      <highcharts-chart *ngIf="surveyQuestions?.item1.length > 0"
        [options]="chart"
        style="display: block; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; background: #ffffff;">
      </highcharts-chart>
    </div>

    <div class="col-sm-4" style="float: left;height: 500px; padding: 12px;" *ngFor="let chart of surveyQuestions?.item2">
      <highcharts-chart *ngIf="surveyQuestions?.item2.length > 0"
        [options]="chart"
        style="display: block; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; background: #ffffff;">
      </highcharts-chart>
      <div class="no-data-container"
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); height: 400px; text-align: center; border: 1px solid #e2e8f0;"
        *ngIf="surveyQuestions.item2.length == 0">
        <div style='font-family: Inter, Segoe UI, sans-serif; font-size: 14px; font-weight: 600; color: #616161; margin-bottom: 16px;'>
          Customer Success Questions</div>
        <i style="font-size: 72px; color: #9e9e9e; opacity: 0.5; margin-bottom: 16px;" class="material-icons md-inactive">warning</i>
        <div style="font-family: Inter, Segoe UI, sans-serif; font-weight: 500; font-size: 16px; color: #9e9e9e;">No Data found for the Quarter</div>
      </div>
    </div>
  </ng-container>
</div>
