<div class="row">
  <div class="col-lg-1"></div>
  <div class="col-lg-9 kpi-container">
    
    <!-- Overall Score -->
    <div class="kpi-row">
      <label class="verysmalltextblack floatleft">Overall Score</label>
      <label class="verysmalltextblack floatright">
        <b>{{getDisplayScore()}}%</b>
      </label>
      <mat-progress-bar 
        class="overallBar" 
        mode="determinate"
        [value]="getDisplayScore()">
      </mat-progress-bar>
    </div>
    
    <!-- KPI Perspectives -->
    <div *ngIf="_cooDashboardCommon.KPIPerspectives && _cooDashboardCommon.KPIPerspectives.perspectivesByKPICategory; else noData">
      <div 
        class="kpi-row" 
        *ngFor="let perspective of _cooDashboardCommon.KPIPerspectives.perspectivesByKPICategory">
        <label class="verysmalltextblack floatleft">
          {{perspective.kpI_CATEGORY}}
        </label>
        <label class="verysmalltextblack floatright">
          <b>{{perspective.score}}%</b>
        </label>
        <mat-progress-bar 
          [ngClass]="getclass(perspective.kpI_CATEGORY)" 
          mode="determinate"
          [value]="perspective.score">
        </mat-progress-bar>
      </div>
    </div>
    
    <ng-template #noData>
      <div class="kpi-row">
        <label class="verysmalltextblack">No KPI data available</label>
      </div>
    </ng-template>
    
  </div>
  <div class="col-lg-2"></div>
</div>
