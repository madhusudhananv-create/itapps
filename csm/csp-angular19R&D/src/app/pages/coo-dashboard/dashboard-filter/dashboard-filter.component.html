<div class="filter-row">
  <!-- Customer Dropdown -->
  <div class="filter-item">
    <app-searchable-multiselect-dropdown 
      (onChange)="customer_Onchange($event)" 
      [data]="customer" 
      displayName="Customer" 
      idField="cusT_ID" 
      nameField="cusT_NM" 
      [reset]="reset">
    </app-searchable-multiselect-dropdown>
  </div>

  <!-- Project Dropdown -->
  <div class="filter-item">
    <app-searchable-multiselect-dropdown 
      (onChange)="project_onChange($event)" 
      [isLoaded]="isLoaded" 
      [data]="project" 
      displayName="Project" 
      idField="proJ_ID" 
      nameField="proJ_NM" 
      [reset]="reset">
    </app-searchable-multiselect-dropdown>
  </div>

  <!-- View By Dropdown -->
  <div class="filter-item view-dropdown">
    <mat-form-field appearance="outline" class="compact-field">
      <mat-label>View by</mat-label>
      <mat-select 
        name="ddView" 
        [(ngModel)]="_cooDashboardCommon.ViewId" 
        (ngModelChange)="ddView_Onchange($event)">
        <mat-option [value]="1">Quarterly</mat-option>
        <mat-option [value]="3">Annual</mat-option>
        <mat-option [value]="4">Period</mat-option>
        <mat-option [value]="5">Monthly</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Year Dropdown -->
  <div class="filter-item year-dropdown" *ngIf="_cooDashboardCommon.ViewId != 4">
    <mat-form-field appearance="outline" class="compact-field">
      <mat-label>Year</mat-label>
      <mat-select 
        name="ddYear" 
        [(ngModel)]="Year" 
        (ngModelChange)="ddYear_Onchange($event)">
        <mat-option *ngFor="let Y of Yearrange" [value]="Y" [title]="Y">
          {{ Y }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Quarter Dropdown -->
  <div class="filter-item quarter-dropdown" *ngIf="_cooDashboardCommon.ViewId == 1">
    <mat-form-field appearance="outline" class="compact-field">
      <mat-label>Quarter</mat-label>
      <mat-select 
        name="ddquarter" 
        [(ngModel)]="QiD" 
        (ngModelChange)="ddQuarter_Onchange($event)">
        <mat-option [value]="1">Q1</mat-option>
        <mat-option [value]="2">Q2</mat-option>
        <mat-option [value]="3">Q3</mat-option>
        <mat-option [value]="4">Q4</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Month Dropdown -->
  <div class="filter-item month-dropdown" *ngIf="_cooDashboardCommon.ViewId == 5">
    <mat-form-field appearance="outline" class="compact-field">
      <mat-label>Month</mat-label>
      <mat-select 
        name="ddmonth" 
        [(ngModel)]="Month" 
        (ngModelChange)="ddMonth_OnChange($event)">
        <mat-option [value]="1">Jan</mat-option>
        <mat-option [value]="2">Feb</mat-option>
        <mat-option [value]="3">Mar</mat-option>
        <mat-option [value]="4">Apr</mat-option>
        <mat-option [value]="5">May</mat-option>
        <mat-option [value]="6">June</mat-option>
        <mat-option [value]="7">Jul</mat-option>
        <mat-option [value]="8">Aug</mat-option>
        <mat-option [value]="9">Sep</mat-option>
        <mat-option [value]="10">Oct</mat-option>
        <mat-option [value]="11">Nov</mat-option>
        <mat-option [value]="12">Dec</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Date Range Pickers (Period View) -->
  <div class="filter-item date-pickers" *ngIf="_cooDashboardCommon.ViewId == 4">
    <mat-form-field appearance="outline" class="compact-field date-field">
      <mat-label>From</mat-label>
      <input 
        readonly 
        [(ngModel)]="_cooDashboardCommon.dashboardStartdate" 
        matInput 
        [matDatepicker]="picker1">
      <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="compact-field date-field">
      <mat-label>To</mat-label>
      <input 
        readonly 
        [min]="_cooDashboardCommon.dashboardStartdate" 
        [(ngModel)]="_cooDashboardCommon.dashboardEnddate" 
        matInput 
        [matDatepicker]="picker2">
      <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
  </div>

  <!-- Action Buttons -->
  <div class="filter-item action-buttons">
    <button 
      mat-raised-button 
      color="primary" 
      class="apply-btn"
      [disabled]="_cooDashboardCommon.progress" 
      (click)="Apply()">
      Apply
    </button>
    <button 
      mat-raised-button 
      class="reset-btn"
      [disabled]="_cooDashboardCommon.progress" 
      (click)="Reset()">
      Reset
    </button>
  </div>
</div>
