<div class="modern-dialog">
  <!-- Header -->
  <div class="dialog-header" mat-dialog-title>
    <div class="header-content">
      <div class="header-icon">📊</div>
      <h2 class="header-title">Base Measure Data</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <!-- Base Measure Fields -->
    <div class="measure-section" *ngFor="let g of KpiData; let i = index">
      <div class="measure-grid">
        <!-- Numerator Field -->
        <div class="measure-field">
          <label class="field-label">{{g.numeratorDescription}}</label>
          <input 
            [disabled]="isDisabled || isNA"
            class="field-input" 
            maxlength="14"
            (keypress)="numberOnly($event)" 
            type="text" 
            (change)="formatDecimal(g.numerator)"
            [(ngModel)]="g.numerator"
            placeholder="0">
        </div>
        
        <!-- Denominator Field -->
        <div class="measure-field" *ngIf="g.denominatorDescription != 'NA'">
          <label class="field-label">{{g.denominatorDescription}}</label>
          <input 
            [disabled]="isDisabled || isNA"
            class="field-input" 
            maxlength="14"
            (keypress)="numberOnly($event)" 
            type="text" 
            (change)="formatDecimal(g.denominator)"
            [(ngModel)]="g.denominator"
            placeholder="0">
        </div>
      </div>
    </div>

    <!-- Not Applicable Section -->
    <div class="option-section">
      <mat-checkbox 
        [disabled]="isDisabled || isExclusion" 
        [(ngModel)]="isNA" 
        (ngModelChange)="applyChanges('NA')"
        class="option-checkbox">
        Not applicable due to no tickets/transactions
      </mat-checkbox>

      <div *ngIf="isNA" class="reason-field">
        <label class="field-label">Reason</label>
        <mat-form-field appearance="outline" class="full-width-field">
          <textarea 
            [disabled]="isDisabled" 
            [(ngModel)]="remarks" 
            matInput 
            rows="4"
            placeholder="Enter reason for not applicable (minimum 10 characters)"></textarea>
        </mat-form-field>
      </div>
    </div>

    <!-- Exclusions Section -->
    <div *ngIf="enableExclusion" class="option-section">
      <mat-checkbox 
        [disabled]="isDisabled || isNA" 
        [(ngModel)]="isExclusion"
        class="option-checkbox exclusion-checkbox">
        <strong>Exclusions</strong>
      </mat-checkbox>

      <div *ngIf="isExclusion" class="reason-field">
        <label class="field-label">Justification</label>
        <mat-form-field appearance="outline" class="full-width-field">
          <textarea 
            [disabled]="isDisabled || !isExclusion" 
            maxlength="2000"
            [(ngModel)]="exclusionComment" 
            matInput 
            rows="4"
            placeholder="Enter detailed justification for exclusion (max 2000 characters)"></textarea>
        </mat-form-field>
      </div>
      
      <!-- Exclusion Base Measures -->
      <div class="measure-section" *ngFor="let ex of KpiDataExclusion; let i = index">
        <div class="measure-grid">
          <!-- Exclusion Numerator -->
          <div class="measure-field">
            <label class="field-label">{{ex.numeratorDescription}}</label>
            <input 
              [disabled]="isDisabled || isNA || isExNoData"
              class="field-input" 
              maxlength="14"
              (keypress)="numberOnly($event)" 
              type="text" 
              (change)="formatDecimal(ex.numerator)"
              [(ngModel)]="ex.numerator"
              placeholder="0">
          </div>
          
          <!-- Exclusion Denominator -->
          <div class="measure-field" *ngIf="ex.denominatorDescription != 'NA'">
            <label class="field-label">{{ex.denominatorDescription}}</label>
            <input 
              [disabled]="isDisabled || isNA || isExNoData"
              class="field-input" 
              maxlength="14"
              (keypress)="numberOnly($event)" 
              type="text" 
              (change)="formatDecimal(ex.denominator)"
              [(ngModel)]="ex.denominator"
              placeholder="0">
          </div>
        </div>
      </div>

      <!-- Exclusion NA Checkbox -->
      <mat-checkbox 
        [disabled]="!isExclusion" 
        [(ngModel)]="isExNoData" 
        (ngModelChange)="applyExChanges('NA')"
        class="option-checkbox">
        Not applicable due to no tickets/transactions
      </mat-checkbox>
      
      <div *ngIf="isExNoData" class="reason-field">
        <label class="field-label">Reason</label>
        <mat-form-field appearance="outline" class="full-width-field">
          <textarea 
            [disabled]="isDisabled" 
            [(ngModel)]="exRemarks" 
            matInput 
            rows="4"
            placeholder="Enter reason for not applicable (minimum 10 characters)"></textarea>
        </mat-form-field>
      </div>
    </div>
    
    <!-- Progress Bar -->
    <mat-progress-bar *ngIf="progress" mode="indeterminate" class="progress-bar"></mat-progress-bar>
  </div>

  <!-- Footer Actions -->
  <div class="dialog-footer">
    <div class="footer-actions">
      <button 
        mat-raised-button 
        color="primary"
        [disabled]="isDisabled || loading" 
        (click)="SaveBaseMeasures()" 
        class="save-btn">
        <mat-icon *ngIf="!loading">save</mat-icon>
        <mat-icon *ngIf="loading" class="spinning">hourglass_empty</mat-icon>
        <span *ngIf="!loading">Save</span>
        <span *ngIf="loading">Saving...</span>
      </button>
      
      <button 
        *ngIf="_access.IsAllowed(98,1,'','') && isKPIProcessEnabledCustomer && baseMeasureValId != null"
        mat-icon-button 
        class="export-btn"
        title="Click here to download details for numerator and denominator"
        (click)="ExportTOExcel(-1)">
        <mat-icon>download</mat-icon>
      </button>
    </div>
    
    <!-- Hidden Export Table -->
    <div style="visibility: hidden;position: absolute;left: -9999px;">
      <div class="mat-elevation-z8" #TABLE style="overflow: auto;">
        <table class="table mat-elevation-z8" mat-table [dataSource]="dataSource" matSort>
          <ng-container *ngFor="let hdr of displayedColumns" [matColumnDef]="hdr">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="font-weight: bolder;color: black;">{{hdr | uppercase}}</th>
            <td mat-cell *matCellDef="let element"> {{element[hdr]}} </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>
</div>
