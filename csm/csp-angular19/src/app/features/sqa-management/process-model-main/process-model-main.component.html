<div class="apple-navigation-container">

  <!-- Level 1: Module Switcher -->
  <mat-tab-group class="level-1-module-switcher" animationDuration="200ms">
    <mat-tab *ngIf="_access.IsAllowed(822, 1, '','')">
      <ng-template mat-tab-label>
        <span class="module-label">SQA Management</span>
      </ng-template>
      
      <!-- Level 2: Section Tabs (Segmented Control Style) -->
      <mat-tab-group class="level-2-segmented-control" animationDuration="200ms">
        <mat-tab *ngIf="_access.IsAllowed(800, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">settings</mat-icon>
            <span class="section-label">Setup</span>
          </ng-template>
          <ng-template matTabContent>
            <app-checklist-user></app-checklist-user>
          </ng-template>
        </mat-tab>
        
        <mat-tab *ngIf="_access.IsAllowed(808, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">calendar_today</mat-icon>
            <span class="section-label">Plan</span>
          </ng-template>
          <mat-tab-group class="level-3-nested-tabs" (selectedTabChange)="tabChange($event)">
            <mat-tab label="View Planner" *ngIf="_access.IsAllowed(809, 1, '','')">
              <ng-template matTabContent>
                <app-audit-plan></app-audit-plan>
              </ng-template>
            </mat-tab>
            <mat-tab label="Add Event/Task" *ngIf="_access.IsAllowed(810, 1, '','')">
              <ng-template matTabContent>
                <app-task-add></app-task-add>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </mat-tab>
        
        <mat-tab *ngIf="_access.IsAllowed(821, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">play_circle</mat-icon>
            <span class="section-label">Execute</span>
          </ng-template>
          <mat-tab-group class="level-3-nested-tabs">
            <mat-tab label="Checklist Based Assessment" *ngIf="_access.IsAllowed(805, 1, '','')">
              <ng-template matTabContent>
                <app-checklist-execution-new [tabIndex]="tabIndex"></app-checklist-execution-new>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </mat-tab>
      </mat-tab-group>
    </mat-tab>

    <mat-tab *ngIf="_access.IsAllowed(823, 1, '','')">
      <ng-template mat-tab-label>
        <span class="module-label">GRC</span>
      </ng-template>
      
      <!-- Level 2: Section Tabs (Segmented Control Style) -->
      <mat-tab-group class="level-2-segmented-control" animationDuration="200ms">
        <mat-tab *ngIf="_access.IsAllowed(800, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">settings</mat-icon>
            <span class="section-label">Setup</span>
          </ng-template>
          <mat-tab-group class="level-3-nested-tabs">
            <mat-tab label="Add/Map Objective" *ngIf="_access.IsAllowed(817, 1, '','')">
              <ng-template matTabContent>
                <app-objective-user></app-objective-user>
              </ng-template>
            </mat-tab>
            <mat-tab label="Add Risk" *ngIf="_access.IsAllowed(818, 1, '','')">
              <ng-template matTabContent>
                <app-risk-user></app-risk-user>
              </ng-template>
            </mat-tab>
            <mat-tab label="Add Control" *ngIf="_access.IsAllowed(819, 1, '','')">
              <ng-template matTabContent>
                <app-control-user></app-control-user>
              </ng-template>
            </mat-tab>
            <mat-tab label="Add Test" *ngIf="_access.IsAllowed(820, 1, '','')">
              <ng-template matTabContent>
                <app-test-user></app-test-user>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </mat-tab>
        
        <mat-tab *ngIf="_access.IsAllowed(808, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">calendar_today</mat-icon>
            <span class="section-label">Plan</span>
          </ng-template>
          <mat-tab-group class="level-3-nested-tabs" (selectedTabChange)="tabChange($event)">
            <mat-tab label="Compliance Requirements Tracker" *ngIf="_access.IsAllowed(807, 1, '','')">
              <ng-template matTabContent>
                <app-requirement-reference></app-requirement-reference>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </mat-tab>
        
        <mat-tab *ngIf="_access.IsAllowed(821, 1, '','')">
          <ng-template mat-tab-label>
            <mat-icon class="section-icon">play_circle</mat-icon>
            <span class="section-label">Execute</span>
          </ng-template>
          <mat-tab-group class="level-3-nested-tabs">
            <mat-tab label="Risk Based Assessment" *ngIf="_access.IsAllowed(804, 1, '','')">
              <ng-template matTabContent>
                <app-audit-execution></app-audit-execution>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </mat-tab>
      </mat-tab-group>
    </mat-tab>
  </mat-tab-group>

</div>
