<div class="row" >
    <div style="text-align: right; margin-right: 18px; cursor: pointer;" (click)="closeDialog()">
      <i style="font-size:24px; margin-left: auto; margin: 10px;" class="fa">&#xf00d;</i>
    </div>
    <div *ngIf="chartOptions" style="margin: 25px;">
       <highcharts-chart 
         [options]="chartOptions" 
         style="margin-left: auto; margin-right: auto; width: 100%; height: 400px; display: block;">
       </highcharts-chart>
    </div>
    <div *ngIf="!chartOptions" style="margin: 25px; padding: 50px; text-align: center;">
      <p style="font-size: 16px; color: #666;">No trend data available for this KPI.</p>
      <p style="font-size: 14px; color: #999;">Please check the browser console for more details.</p>
    </div>
 </div>
