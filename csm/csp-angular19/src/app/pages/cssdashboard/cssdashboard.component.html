<!-- Filter Section with integrated Prev/Next -->
<div style="margin-left: 0.5%; margin-top: 0;">
  <app-cssdashboard-filter [allCust]="allCust" [custId]="customerId" [currIndex]="currIndex"
    (getCssInputEmitter)="receivedCssInput($event)" (prevClicked)="onPrev()" (nextClicked)="onNext()"
    ></app-cssdashboard-filter>
</div>

<!-- Heat Map Table Page -->
<div *ngIf="currIndex == 0" style="width: 99%; margin-left: 1%; margin-top: 8px;">
  <app-cssdashboard-css-table class="portfolioCard verysmalltextblack "
    [cssDashboardInputs]="cssInputs"></app-cssdashboard-css-table>
</div>

<!-- Charts Page 1 -->
<div *ngIf="currIndex == 1" style="height: 100%">
  <app-cssdashboard-next-page1 [customerId]="customerId" [fromDate]="fromDate" [toDate]="toDate"
    [customerIds]="cssInputs.customeR_IDS" [allCust]="allCust" [frequency]="cssInputs.frequency"
    [selectedQuarter]="selectedQuarter">
  </app-cssdashboard-next-page1>
</div>

<!-- Charts Page 2 -->
<div *ngIf="currIndex == 2" style="height: 100%">
  <app-cssdashboard-next-page2 [customerId]="customerId" [fromDate]="fromDate" [toDate]="toDate"
    [customerIds]="cssInputs.customeR_IDS" [allCust]="allCust" [frequency]="cssInputs.frequency"
    [trendQuarter]="trendQuarter">
  </app-cssdashboard-next-page2>
</div>
