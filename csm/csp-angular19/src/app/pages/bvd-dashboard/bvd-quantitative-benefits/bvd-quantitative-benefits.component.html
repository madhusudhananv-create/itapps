<div class="qb-card">

  <!-- Card Header -->
  <div class="qb-header">
    <div class="qb-title-wrap">
      <span class="qb-title-bar"></span>
      <span class="qb-title">Quantitative Benefits</span>
    </div>
    <div class="qb-controls">
      <div class="qb-control-group">
        <span class="qb-control-label">View By:</span>
        <mat-form-field appearance="outline" class="qb-select-field">
          <mat-select name="ddlView" [(value)]="selectedView">
            <mat-option value="benefits">Benefits</mat-option>
            <mat-option value="ideas">Ideas</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="qb-control-group" *ngIf="selectedView == 'benefits'">
        <mat-form-field appearance="outline" class="qb-select-field">
          <mat-select [(ngModel)]="UOM_ID" name="uomSelect" (selectionChange)="onUOMChange()">
            <mat-option [value]="uom.id" *ngFor="let uom of UOM_Title">{{ uom.title }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Chart area: benefits view with data -->
  <div class="qb-chart-area" *ngIf="selectedView == 'benefits' && Value.length > 0 && ValueColumn.length > 0">
    <google-chart #chart1 [type]="type" [data]="pieData" [options]="options" [width]="width" [height]="height"></google-chart>
    <google-chart #chart2 [type]="type1" [data]="columnGraphData" [options]="options1" [width]="width1" [height]="height1"></google-chart>
  </div>

  <!-- Chart area: ideas view with data -->
  <div class="qb-chart-area" *ngIf="selectedView == 'ideas' && !isDataEmpty">
    <google-chart #chart3 [type]="type2" [data]="stackedData" [options]="options2" [width]="width2" [height]="height2"></google-chart>
    <table class="qb-ideas-table" [ngClass]="ideasCount.length >= 4 ? 'qb-ideas-table--compact' : ''">
      <thead><tr><th>Idea Type</th><th>Total</th></tr></thead>
      <tbody>
        <tr *ngFor="let row of ideasCount">
          <td>{{ row[0] }}</td>
          <td class="qb-ideas-count">{{ row[1] }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty state: no benefits -->
  <div class="qb-empty" *ngIf="selectedView == 'benefits' && Value.length == 0 && ValueColumn.length == 0">
    <div class="qb-empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="rgba(75,78,177,0.10)"/>
        <path d="M8 12h8M8 8h8M8 16h5" stroke="#4B4EB1" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="qb-empty-title">No data for this period</div>
    <div class="qb-empty-sub">Adjust filters to see benefits</div>
  </div>

  <!-- Empty state: no ideas -->
  <div class="qb-empty" *ngIf="selectedView == 'ideas' && isDataEmpty">
    <div class="qb-empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="3" fill="rgba(75,78,177,0.10)"/>
        <path d="M8 12h8M8 8h8M8 16h5" stroke="#4B4EB1" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="qb-empty-title">No data for this period</div>
    <div class="qb-empty-sub">Adjust filters to see ideas</div>
  </div>

  <!-- View More -->
  <div class="qb-footer">
    <a class="qb-view-more" (click)="openView()">View More &rsaquo;</a>
  </div>

</div>
