<div class="bell-wrap">
  <button type="button" class="bell-btn" (click)="toggle()" aria-label="Notifications">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
      <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="bell-badge" *ngIf="notifications.length">{{ notifications.length > 9 ? '9+' : notifications.length }}</span>
  </button>

  <div class="bell-panel" *ngIf="open">
    <div class="bell-header">
      <span>Notifications</span>
      <button type="button" class="bell-clear" *ngIf="notifications.length" (click)="clearAll()">Clear all</button>
    </div>

    <div class="bell-empty" *ngIf="!notifications.length">You're all caught up.</div>

    <ul class="bell-list" *ngIf="notifications.length">
      <li *ngFor="let n of notifications" (click)="openNotification(n)">
        <div class="bell-item-body">
          <span class="bell-item-message">{{ n.message }}</span>
          <span class="bell-item-time">{{ timeAgo(n.createdDate) }}</span>
        </div>
        <button type="button" class="bell-item-dismiss" (click)="dismiss(n, $event)" aria-label="Dismiss">&times;</button>
      </li>
    </ul>
  </div>
</div>
