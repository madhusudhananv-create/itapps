<svg
  class="app-spinner"
  [style.width.px]="size"
  [style.height.px]="size"
  viewBox="0 0 44 44"
  fill="none"
  role="status"
  aria-label="Loading"
>
  <defs>
    <linearGradient [attr.id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent, #0072b2)" />
      <stop offset="100%" stop-color="var(--accent2, var(--accent, #0072b2))" />
    </linearGradient>
  </defs>
  <circle class="app-spinner-track" cx="22" cy="22" r="18" stroke="currentColor" stroke-width="3" opacity="0.15" />
  <circle
    class="app-spinner-arc app-spinner-arc-outer"
    cx="22"
    cy="22"
    r="18"
    [attr.stroke]="'url(#' + gradientId + ')'"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="64 149"
  />
  <circle
    class="app-spinner-arc app-spinner-arc-inner"
    cx="22"
    cy="22"
    r="11"
    [attr.stroke]="'url(#' + gradientId + ')'"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="30 69"
    opacity="0.65"
  />
</svg>
