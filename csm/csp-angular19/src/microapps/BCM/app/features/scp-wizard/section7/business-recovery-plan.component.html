
    <mat-card class="section-card">
      <mat-card-content>
              <div class="form-container">
        <!-- Add Activity Button - Outside form and banner -->
          <div class="add-service-container">
            <button
          mat-raised-button color="primary"
          (click)="openAddActivityDialog($event)">
          <mat-icon>add</mat-icon>
          Add Row
        </button>
          </div>
        <form [formGroup]="brpForm">
          <input type="hidden" formControlName="id">
          <input type="hidden" formControlName="activity">
          <table mat-table [dataSource]="dataList" class="data-table">
              <!-- Activity -->
              <ng-container matColumnDef="activity">
                <th mat-header-cell *matHeaderCellDef>Activity / Services</th>
                <td mat-cell *matCellDef="let row">
                  <div class="read-only">{{ row.activity }}<br>
                  </div>
                </td>
              </ng-container>

              <!-- Outage Scenario -->
              <ng-container matColumnDef="outageScenario">
                <th mat-header-cell *matHeaderCellDef>Outage Scenario</th>
                <td mat-cell *matCellDef="let row">

                  <!-- EDIT MODE -->
                  <ng-container *ngIf="editingRowId === row.id; else viewOutage">
                    <mat-form-field appearance="outline" class="full-width">
                      <mat-select formControlName="outageScenario" placeholder="Select Outage Scenario">
                        <mat-option *ngFor="let o of outageOptions" [value]="o">{{ o }}</mat-option>
                      </mat-select>
                    </mat-form-field>
                  </ng-container>

                  <!-- VIEW MODE -->
                  <ng-template #viewOutage>
                    <div class="read-only">{{ row.outageScenario }}</div>
                  </ng-template>

                </td>
              </ng-container>

              <!-- Recovery Strategy -->
              <ng-container matColumnDef="recoveryStrategy">
                <th mat-header-cell *matHeaderCellDef>Recovery Strategy</th>
                <td mat-cell *matCellDef="let row">

                  <!-- EDIT MODE -->
                  <ng-container *ngIf="editingRowId === row.id; else viewRecovery">
                    <mat-form-field appearance="outline" class="full-width">
                      <mat-select formControlName="recoveryStrategy" placeholder="Select Recovery Strategy">
                        <mat-option *ngFor="let r of strategyOptions" [value]="r">{{ r }}</mat-option>
                      </mat-select>
                    </mat-form-field>

                    <!-- When Other/Specify selected -->
                    <mat-form-field *ngIf="brpForm.get('recoveryStrategy')?.value === 'Other / Specify'"
                                    appearance="outline"
                                    class="full-width">
                      <input matInput formControlName="customRecoveryStrategy" placeholder="Specify"/>
                    </mat-form-field>
                  </ng-container>

                  <!-- VIEW MODE -->
                  <ng-template #viewRecovery>
                    <div class="read-only">
                      {{ row.recoveryStrategy }}
                      <span *ngIf="row.recoveryStrategy === 'Other / Specify'">({{ row.customRecoveryStrategy }})</span>
                    </div>
                  </ng-template>

                </td>
              </ng-container>

              <!-- Comments -->
              <ng-container matColumnDef="comments">
                <th mat-header-cell *matHeaderCellDef>Comments</th>
                <td mat-cell *matCellDef="let row">

                  <!-- EDIT MODE -->
                  <ng-container *ngIf="editingRowId === row.id; else viewComments">
                    <mat-form-field appearance="outline" class="full-width">
                      <textarea matInput formControlName="comments"></textarea>
                    </mat-form-field>
                  </ng-container>

                  <!-- VIEW MODE -->
                  <ng-template #viewComments>
                    <div class="read-only multiline">
                      {{ row.comments }}
                    </div>
                  </ng-template>

                </td>
              </ng-container>

              <!-- Action -->
              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Edit / Delete</th>
                <td mat-cell *matCellDef="let row">

                  <ng-container *ngIf="editingRowId === row.id; else showEditButton">
                    <button mat-icon-button class="save-button" (click)="saveRow()">
                      <mat-icon>check</mat-icon>
                    </button>
                    <button mat-icon-button class="cancel-button" (click)="cancelEdit()">
                      <mat-icon>close</mat-icon>
                    </button>
                  </ng-container>

                  <ng-template #showEditButton>
                    <button mat-icon-button class="edit-button" (click)="editRow(row)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button class="delete-button" (click)="deleteRow(row.id)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </ng-template>

                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        </form>
        </div>
      </mat-card-content>
      </mat-card>
      <mat-card-actions class="section-actions">
        <div class="spacer"></div>
        <div class="validation-status" *ngIf="brpForm.invalid && brpForm.touched">
          <mat-icon color="warn">warning</mat-icon>
          <span>Please complete all required fields</span>
        </div>
        <div class="validation-status success" *ngIf="brpForm.valid">
          <mat-icon color="primary">check_circle</mat-icon>
          <span>Section completed</span>
        </div>
      </mat-card-actions>
